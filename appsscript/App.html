<script>
/* ============================================================
   ALMACÉN — capa de persistencia intercambiable
   ------------------------------------------------------------
   ÚNICO punto del código que toca el almacenamiento.
   - En navegador (mockup): localStorage.
   - En Apps Script: google.script.run → PropertiesService.
   Toda la API es asíncrona (promesas) para que la migración
   no exija cambiar ninguna vista.
   ============================================================ */

var Almacen = (function () {
  var CLAVE = 'tutor-mit-cardio-v1';

  var enAppsScript = (typeof google !== 'undefined' &&
    typeof google.script !== 'undefined' &&
    typeof google.script.run !== 'undefined');

  function estadoInicial() {
    return {
      version: 1,
      creado: new Date().toISOString(),
      ajustes: JSON.parse(JSON.stringify(TUTOR.AJUSTES_DEFECTO)),
      temas: {},
      tarjetas: {},
      sesiones: [],
      plan: {},
      brechas: [],
      racha: { ultimoDia: null, dias: 0, mejor: 0 },
      /* Contenido creado por el usuario desde el Taller. Viaja con
         el progreso, de modo que se exporta e importa con él. */
      contenido: { areas: [], modulos: [], temas: [] },
      examenes: [],
      /* Segundo cerebro: fuentes consultadas y notas atómicas. */
      fuentes: [],
      notas: []
    };
  }

  function fusionar(guardado) {
    var base = estadoInicial();
    if (!guardado) return base;
    Object.keys(base).forEach(function (k) {
      if (guardado[k] === undefined) guardado[k] = base[k];
    });
    Object.keys(base.ajustes).forEach(function (k) {
      if (guardado.ajustes[k] === undefined) guardado.ajustes[k] = base.ajustes[k];
    });
    return guardado;
  }

  function leerLocal() {
    try {
      var crudo = window.localStorage.getItem(CLAVE);
      return crudo ? JSON.parse(crudo) : null;
    } catch (e) {
      return null;
    }
  }

  function escribirLocal(estado) {
    try {
      window.localStorage.setItem(CLAVE, JSON.stringify(estado));
      return true;
    } catch (e) {
      return false;
    }
  }

  return {
    modo: enAppsScript ? 'appsscript' : 'local',

    /* Devuelve una promesa con el estado completo. */
    cargar: function () {
      return new Promise(function (resolver) {
        if (enAppsScript) {
          google.script.run
            .withSuccessHandler(function (json) {
              resolver(fusionar(json ? JSON.parse(json) : null));
            })
            .withFailureHandler(function () { resolver(estadoInicial()); })
            .leerEstado();
        } else {
          resolver(fusionar(leerLocal()));
        }
      });
    },

    /* Persiste el estado. Devuelve promesa. */
    guardar: function (estado) {
      return new Promise(function (resolver) {
        if (enAppsScript) {
          google.script.run
            .withSuccessHandler(function () { resolver(true); })
            .withFailureHandler(function () { resolver(false); })
            .guardarEstado(JSON.stringify(estado));
        } else {
          resolver(escribirLocal(estado));
        }
      });
    },

    reiniciar: function () {
      return this.guardar(estadoInicial());
    },

    inicial: estadoInicial
  };
})();


/* ============================================================
   ESTADO — modelo en memoria y reglas de negocio
   ============================================================ */

var Estado = (function () {
  var d = null;                 // datos
  var oyentes = [];
  var guardadoPendiente = null;

  function hoyISO(desplazamiento) {
    var f = new Date();
    if (desplazamiento) f.setDate(f.getDate() + desplazamiento);
    return f.toISOString().slice(0, 10);
  }

  function diasEntre(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }

  /* Contador de cambios. Sirve para que quien construya índices
     derivados del estado (Notas, por ejemplo) sepa en O(1) si su
     copia sigue valiendo, en vez de recalcularla por si acaso. */
  var revision = 0;

  function notificar() {
    revision += 1;
    oyentes.forEach(function (fn) { fn(d); });
  }

  /* Guardado diferido para no escribir en cada tecla. */
  function persistir() {
    if (guardadoPendiente) clearTimeout(guardadoPendiente);
    guardadoPendiente = setTimeout(function () {
      Almacen.guardar(d);
    }, 400);
  }

  function temaEstado(id) {
    if (!d.temas[id]) {
      d.temas[id] = {
        dominio: 0, vistas: 0, minutos: 0, ultimo: null,
        aciertos: 0, intentos: 0, feynman: 0, casos: 0
      };
    }
    return d.temas[id];
  }

  function tarjetaEstado(id) {
    if (!d.tarjetas[id]) {
      d.tarjetas[id] = {
        facilidad: TUTOR.SRS.facilidadInicial,
        intervalo: 0,
        repeticiones: 0,
        lapsos: 0,
        vence: hoyISO(),
        ultimo: null,
        nueva: true
      };
    }
    return d.tarjetas[id];
  }

  return {
    /* ---------- ciclo de vida ---------- */
    iniciar: function () {
      return Almacen.cargar().then(function (cargado) {
        d = cargado;
        Estado.registrarDia();
        return d;
      });
    },

    datos: function () { return d; },
    ajustes: function () { return d.ajustes; },
    suscribir: function (fn) { oyentes.push(fn); },
    guardar: persistir,
    revision: function () { return revision; },

    guardarAjustes: function (parciales) {
      Object.keys(parciales).forEach(function (k) { d.ajustes[k] = parciales[k]; });
      persistir();
      notificar();
    },

    /* ---------- racha ---------- */
    registrarDia: function () {
      var hoy = hoyISO();
      var r = d.racha;
      if (r.ultimoDia === hoy) return;
      if (r.ultimoDia === hoyISO(-1)) r.dias += 1;
      else if (r.ultimoDia !== null) r.dias = 1;
      else r.dias = 1;
      r.ultimoDia = hoy;
      if (r.dias > (r.mejor || 0)) r.mejor = r.dias;
      persistir();
    },

    /* ---------- temas ---------- */
    tema: temaEstado,

    dominio: function (id) {
      return d.temas[id] ? Math.round(d.temas[id].dominio) : 0;
    },

    /* El dominio combina precisión en preguntas, exposición y
       frescura: decae con el tiempo si no se repasa. */
    recalcularDominio: function (id) {
      var t = temaEstado(id);
      var precision = t.intentos > 0 ? (t.aciertos / t.intentos) : 0;
      var exposicion = Math.min(1, t.vistas / 3);
      var profundidad = Math.min(1, (t.feynman * 0.6 + t.casos * 0.4) / 2);
      var bruto = (precision * 55) + (exposicion * 25) + (profundidad * 20);

      // Decaimiento por olvido: −1,5 puntos por día sin repasar (tope 30).
      if (t.ultimo) {
        var dias = diasEntre(t.ultimo, hoyISO());
        bruto -= Math.min(30, Math.max(0, dias - 2) * 1.5);
      }
      t.dominio = Math.max(0, Math.min(100, bruto));
      return t.dominio;
    },

    dominioModulo: function (idModulo) {
      var temas = TUTOR.temasDe(idModulo);
      if (!temas.length) return 0;
      var suma = 0;
      temas.forEach(function (t) { suma += Estado.dominio(t.id); });
      return Math.round(suma / temas.length);
    },

    dominioArea: function (idArea) {
      var temas = TUTOR.temasDeArea(idArea);
      if (!temas.length) return 0;
      var suma = 0;
      temas.forEach(function (t) { suma += Estado.dominio(t.id); });
      return Math.round(suma / temas.length);
    },

    /* El dominio global solo cuenta las áreas activas: si Diego
       ha desactivado un área para concentrarse en un examen, no
       tiene sentido que su progreso se diluya con ella. */
    dominioGlobal: function () {
      var temas = Estado.temasActivos();
      if (!temas.length) return 0;
      var suma = 0;
      temas.forEach(function (t) { suma += Estado.dominio(t.id); });
      return Math.round(suma / temas.length);
    },

    /* ---------- áreas del conocimiento ---------- */
    areasActivas: function () {
      var a = d.ajustes.areasActivas;
      if (!a || !a.length) return TUTOR.AREAS.map(function (x) { return x.id; });
      return a;
    },

    areaActiva: function (idArea) {
      return Estado.areasActivas().indexOf(idArea) >= 0;
    },

    alternarArea: function (idArea) {
      var activas = Estado.areasActivas().slice();
      var i = activas.indexOf(idArea);
      if (i >= 0) {
        if (activas.length === 1) return false;   // nunca dejar el temario vacío
        activas.splice(i, 1);
      } else {
        activas.push(idArea);
      }
      d.ajustes.areasActivas = activas;
      persistir();
      notificar();
      return true;
    },

    /* Temas de las áreas actualmente activas. */
    temasActivos: function () {
      var activas = Estado.areasActivas();
      return TUTOR.TEMAS.filter(function (t) {
        return activas.indexOf(TUTOR.areaDeTema(t.id)) >= 0;
      });
    },

    registrarRespuesta: function (idTema, acierto) {
      var t = temaEstado(idTema);
      t.intentos += 1;
      if (acierto) t.aciertos += 1;
      t.ultimo = hoyISO();
      Estado.recalcularDominio(idTema);
      persistir();
    },

    registrarFase: function (idTema, fase) {
      var t = temaEstado(idTema);
      if (fase === 'feynman') t.feynman += 1;
      if (fase === 'caso') t.casos += 1;
      t.ultimo = hoyISO();
      Estado.recalcularDominio(idTema);
      persistir();
    },

    /* ---------- sesiones ---------- */
    cerrarSesion: function (resumen) {
      var t = temaEstado(resumen.tema);
      t.vistas += 1;
      t.minutos += resumen.minutos;
      t.ultimo = hoyISO();
      Estado.recalcularDominio(resumen.tema);
      resumen.fecha = new Date().toISOString();
      d.sesiones.unshift(resumen);
      if (d.sesiones.length > 300) d.sesiones.length = 300;
      Estado.registrarDia();
      Estado.marcarPlanHecho(resumen.tema);
      persistir();
      notificar();
    },

    sesionesDe: function (fechaISO) {
      return d.sesiones.filter(function (s) {
        return s.fecha && s.fecha.slice(0, 10) === fechaISO;
      });
    },

    minutosDe: function (fechaISO) {
      return Estado.sesionesDe(fechaISO).reduce(function (a, s) {
        return a + (s.minutos || 0);
      }, 0);
    },

    /* ---------- brechas conceptuales ---------- */
    anotarBrecha: function (idTema, texto) {
      d.brechas.unshift({
        tema: idTema, texto: texto,
        fecha: new Date().toISOString(), resuelta: false
      });
      if (d.brechas.length > 120) d.brechas.length = 120;
      persistir();
    },

    resolverBrecha: function (indice) {
      if (d.brechas[indice]) d.brechas[indice].resuelta = true;
      persistir();
      notificar();
    },

    brechasAbiertas: function () {
      return d.brechas.filter(function (b) { return !b.resuelta; });
    },

    /* ---------- tarjetas (SM-2 adaptado) ---------- */
    tarjeta: tarjetaEstado,

    tarjetasVencidas: function () {
      var hoy = hoyISO();
      var activas = Estado.areasActivas();
      var todas = TUTOR.todasLasTarjetas().filter(function (c) {
        return activas.indexOf(TUTOR.areaDeTema(c.tema)) >= 0;
      });
      var vencidas = [], nuevas = [];
      todas.forEach(function (c) {
        var e = d.tarjetas[c.id];
        if (!e) { nuevas.push(c); return; }
        if (e.vence <= hoy) vencidas.push(c);
      });
      var maxNuevas = d.ajustes.tarjetasNuevasDia;
      var limite = d.ajustes.maxTarjetasDia;
      var lote = vencidas.concat(nuevas.slice(0, maxNuevas));
      return lote.slice(0, limite);
    },

    tarjetasDeTema: function (idTema) {
      return TUTOR.todasLasTarjetas().filter(function (c) {
        return c.tema === idTema;
      });
    },

    /* grado: 1 = otra vez, 2 = difícil, 3 = bien, 4 = fácil */
    calificarTarjeta: function (idTarjeta, grado) {
      var s = TUTOR.SRS;
      var e = tarjetaEstado(idTarjeta);
      e.nueva = false;
      e.ultimo = hoyISO();

      if (grado === 1) {
        e.repeticiones = 0;
        e.lapsos += 1;
        e.intervalo = 0;
        e.facilidad = Math.max(s.facilidadMinima, e.facilidad - s.penalizacionFallo);
        e.vence = hoyISO();           // vuelve a aparecer hoy
      } else {
        e.repeticiones += 1;
        if (e.repeticiones === 1) e.intervalo = s.primerIntervalo;
        else if (e.repeticiones === 2) e.intervalo = s.segundoIntervalo;
        else {
          var mult = e.facilidad;
          if (grado === 2) mult = s.multiplicadorDificil;
          if (grado === 4) mult = e.facilidad * s.multiplicadorFacil;
          e.intervalo = Math.round(e.intervalo * mult);
        }
        if (grado === 2) e.facilidad = Math.max(s.facilidadMinima, e.facilidad - 0.15);
        if (grado === 4) e.facilidad = e.facilidad + 0.1;
        e.intervalo = Math.min(s.intervaloMaximo, Math.max(1, e.intervalo));
        e.vence = hoyISO(e.intervalo);
      }
      persistir();
      return e;
    },

    estadisticasTarjetas: function () {
      var activas = Estado.areasActivas();
      var todas = TUTOR.todasLasTarjetas().filter(function (c) {
        return activas.indexOf(TUTOR.areaDeTema(c.tema)) >= 0;
      });
      var hoy = hoyISO();
      var r = { total: todas.length, nuevas: 0, aprendiendo: 0, maduras: 0, vencenHoy: 0 };
      todas.forEach(function (c) {
        var e = d.tarjetas[c.id];
        if (!e) { r.nuevas += 1; return; }
        if (e.intervalo >= 21) r.maduras += 1; else r.aprendiendo += 1;
        if (e.vence <= hoy) r.vencenHoy += 1;
      });
      r.vencenHoy += Math.min(r.nuevas, d.ajustes.tarjetasNuevasDia);
      return r;
    },

    /* ---------- planificador ---------- */
    minutosDisponibles: function (fechaISO) {
      var dia = new Date(fechaISO + 'T12:00:00').getDay();
      return d.ajustes.minutosPorDia[dia] || 0;
    },

    plan: function () { return d.plan; },

    planDe: function (fechaISO) { return d.plan[fechaISO] || []; },

    marcarPlanHecho: function (idTema) {
      var hoy = hoyISO();
      (d.plan[hoy] || []).forEach(function (b) {
        if (b.tema === idTema && !b.hecho) b.hecho = true;
      });
    },

    /* Genera un plan de N días equilibrando temas nuevos,
       repasos vencidos y prioridad de alto rendimiento. */
    generarPlan: function (dias) {
      dias = dias || 14;
      var plan = {};

      /* Prioridad dentro de cada área: alto rendimiento primero y,
         a igualdad, menor dominio. */
      var porArea = {};
      Estado.temasActivos().forEach(function (t) {
        var area = TUTOR.areaDeTema(t.id);
        if (!porArea[area]) porArea[area] = [];
        porArea[area].push(t);
      });
      Object.keys(porArea).forEach(function (k) {
        porArea[k].sort(function (a, b) {
          if (a.alto !== b.alto) return a.alto ? -1 : 1;
          return Estado.dominio(a.id) - Estado.dominio(b.id);
        });
      });

      /* Intercalado entre áreas: alternar materias distintas retiene
         mejor que agotar una antes de pasar a la siguiente, porque
         obliga a discriminar en lugar de reconocer por contexto. */
      var pendientes = [];
      var areas = Object.keys(porArea);
      var quedan = true;
      for (var vuelta = 0; quedan; vuelta++) {
        quedan = false;
        for (var a = 0; a < areas.length; a++) {
          var lista = porArea[areas[a]];
          if (lista[vuelta]) { pendientes.push(lista[vuelta]); quedan = true; }
        }
      }
      if (!pendientes.length) { d.plan = {}; persistir(); return {}; }

      var cola = pendientes.slice();
      for (var i = 0; i < dias; i++) {
        var fecha = hoyISO(i);
        var disponibles = Estado.minutosDisponibles(fecha);
        if (disponibles <= 0) { plan[fecha] = []; continue; }

        var bloques = [];
        var restantes = disponibles;

        // Reserva fija para repaso espaciado si hay mazo activo.
        var stats = Estado.estadisticasTarjetas();
        if (stats.vencenHoy > 0 || i > 0) {
          var minRepaso = Math.min(10, Math.round(disponibles * 0.3));
          bloques.push({ tipo: 'repaso', tema: null, minutos: minRepaso, hecho: false });
          restantes -= minRepaso;
        }

        // Bloques de estudio con el tiempo restante.
        while (restantes >= 12 && cola.length) {
          var tema = cola.shift();
          var min = Math.min(restantes, tema.minutos || 20);
          bloques.push({ tipo: 'estudio', tema: tema.id, minutos: min, hecho: false });
          restantes -= min;
          if (cola.length === 0) cola = pendientes.slice();  // segunda vuelta = consolidación
        }
        plan[fecha] = bloques;
      }
      d.plan = plan;
      persistir();
      notificar();
      return plan;
    },

    /* Sugerencia de la próxima sesión según tiempo disponible hoy. */
    sugerencia: function () {
      var hoy = hoyISO();
      var bloques = Estado.planDe(hoy).filter(function (b) {
        /* El plan se guarda con identificadores de tema. Si el
           temario cambió —al quitar el de fábrica, por ejemplo—
           quedan bloques apuntando a temas que ya no existen, y
           sugerirlos daría un tema nulo. */
        return !b.hecho && b.tipo === 'estudio' && !!TUTOR.tema(b.tema);
      });
      if (bloques.length) {
        return { tema: bloques[0].tema, minutos: bloques[0].minutos, origen: 'plan' };
      }
      var candidatos = Estado.temasActivos().sort(function (a, b) {
        if (a.alto !== b.alto) return a.alto ? -1 : 1;
        return Estado.dominio(a.id) - Estado.dominio(b.id);
      });
      if (!candidatos.length) candidatos = TUTOR.TEMAS.slice();
      /* Sin ningún tema no hay nada que sugerir. Ocurre de verdad:
         al quitar el temario de fábrica para usar la app con otra
         materia, el temario queda vacío hasta el primer import. */
      if (!candidatos.length) return null;
      return {
        tema: candidatos[0].id,
        minutos: Math.min(Estado.minutosDisponibles(hoy) || 25, 30),
        origen: 'sugerido'
      };
    },

    /* ---------- biblioteca de fuentes ---------- */
    fuentes: function () { return d.fuentes || (d.fuentes = []); },

    guardarFuente: function (f) {
      var lista = Estado.fuentes();
      var i = lista.findIndex(function (x) { return x.id === f.id; });
      if (i >= 0) lista[i] = f; else lista.unshift(f);
      persistir();
      notificar();
    },

    eliminarFuente: function (id) {
      d.fuentes = Estado.fuentes().filter(function (f) { return f.id !== id; });
      persistir();
      notificar();
    },

    fuentesDeTema: function (idTema) {
      return Estado.fuentes().filter(function (f) {
        return (f.temas || []).indexOf(idTema) >= 0;
      });
    },

    /* ---------- notas atómicas ---------- */
    notas: function () { return d.notas || (d.notas = []); },

    guardarNota: function (n) {
      var lista = Estado.notas();
      var i = lista.findIndex(function (x) { return x.id === n.id; });
      n.modificado = new Date().toISOString();
      if (i >= 0) lista[i] = n;
      else { n.creado = n.modificado; lista.unshift(n); }
      persistir();
      notificar();
    },

    eliminarNota: function (id) {
      d.notas = Estado.notas().filter(function (n) { return n.id !== id; });
      persistir();
      notificar();
    },

    /* ---------- exámenes ---------- */
    registrarExamen: function (resumen) {
      if (!d.examenes) d.examenes = [];
      d.examenes.unshift(resumen);
      if (d.examenes.length > 60) d.examenes.length = 60;
      Estado.registrarDia();
      persistir();
      notificar();
    },

    examenes: function () { return d.examenes || []; },

    /* ---------- contenido propio (Taller) ---------- */
    contenido: function () {
      if (!d.contenido) d.contenido = { areas: [], modulos: [], temas: [] };
      return d.contenido;
    },

    /* Guarda un paquete ya validado por el Taller. Las áreas y los
       módulos se añaden solo si no existían: así se pueden ir
       sumando temas a un área propia creada antes. */
    agregarContenido: function (paquete) {
      var c = Estado.contenido();
      if (paquete.area && !c.areas.some(function (a) { return a.id === paquete.area.id; })) {
        c.areas.push(paquete.area);
      }
      if (paquete.modulo && !c.modulos.some(function (m) { return m.id === paquete.modulo.id; })) {
        c.modulos.push(paquete.modulo);
      }
      paquete.temas.forEach(function (t) {
        var i = c.temas.findIndex(function (x) { return x.id === t.id; });
        if (i >= 0) c.temas[i] = t; else c.temas.push(t);
      });
      persistir();
      notificar();
    },

    verificarTema: function (idTema) {
      var c = Estado.contenido();
      c.temas.forEach(function (t) { if (t.id === idTema) t.verificado = true; });
      var vivo = TUTOR.tema(idTema);
      if (vivo) vivo.verificado = true;
      persistir();
      notificar();
    },

    eliminarTema: function (idTema) {
      var c = Estado.contenido();
      c.temas = c.temas.filter(function (t) { return t.id !== idTema; });
      /* Áreas y módulos que se quedan sin temas dejan de tener sentido. */
      c.modulos = c.modulos.filter(function (m) {
        return c.temas.some(function (t) { return t.modulo === m.id; });
      });
      c.areas = c.areas.filter(function (a) {
        return c.modulos.some(function (m) { return m.area === a.id; });
      });
      delete d.temas[idTema];
      Object.keys(d.tarjetas).forEach(function (k) {
        if (k.indexOf(idTema + '::') === 0) delete d.tarjetas[k];
      });
      persistir();
      notificar();
    },

    temasPropios: function () {
      return Estado.contenido().temas;
    },

    temasSinVerificar: function () {
      return Estado.contenido().temas.filter(function (t) { return !t.verificado; });
    },

    /* ---------- utilidades expuestas ---------- */
    hoyISO: hoyISO,
    diasEntre: diasEntre,

    exportar: function () { return JSON.stringify(d, null, 2); },

    importar: function (json) {
      try {
        var nuevo = JSON.parse(json);
        if (!nuevo || typeof nuevo !== 'object') return false;
        d = nuevo;
        persistir();
        notificar();
        return true;
      } catch (e) { return false; }
    },

    reiniciar: function () {
      d = Almacen.inicial();
      persistir();
      notificar();
    }
  };
})();


/* ============================================================
   UI — utilidades, enrutador y armazón de la aplicación
   Sin dependencias externas: compatible con HtmlService.
   ============================================================ */

var UI = (function () {
  var acciones = {};   // registro de manejadores por data-accion

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function $(sel, raiz) { return (raiz || document).querySelector(sel); }
  function $$(sel, raiz) {
    return Array.prototype.slice.call((raiz || document).querySelectorAll(sel));
  }

  function brindis(mensaje) {
    var el = $('#brindis');
    el.textContent = mensaje;
    el.classList.add('ver');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('ver'); }, 2200);
  }

  function modal(html) {
    cerrarModal();
    var velo = document.createElement('div');
    velo.className = 'velo';
    velo.id = 'velo';
    velo.innerHTML = '<div class="modal">' + html + '</div>';
    velo.addEventListener('click', function (e) {
      if (e.target === velo) cerrarModal();
    });
    document.body.appendChild(velo);
  }

  function cerrarModal() {
    var v = $('#velo');
    if (v) v.remove();
  }

  function barra(valor, clase) {
    return '<div class="barra-progreso ' + (clase || '') + '">' +
      '<i style="width:' + Math.max(0, Math.min(100, valor)) + '%"></i></div>';
  }

  function flecha(direccion) {
    if (direccion === 'up') return '<span class="dir up">↑</span>';
    if (direccion === 'down') return '<span class="dir down">↓</span>';
    return '<span class="dir eq">=</span>';
  }

  function variables(lista) {
    if (!lista || !lista.length) return '';
    return '<div class="variables">' + lista.map(function (v) {
      return '<span class="var-chip" title="' + esc(v.nota || '') + '">' +
        flecha(v.d) + esc(v.n) + '</span>';
    }).join('') + '</div>';
  }

  function cadena(pasos) {
    if (!pasos || !pasos.length) return '';
    return '<div class="cadena">' + pasos.map(function (p, i) {
      var sep = i < pasos.length - 1 ? '<span class="flecha">→</span>' : '';
      var clase = i === pasos.length - 1 ? 'paso destacado' : 'paso';
      return '<span class="' + clase + '">' + esc(p) + '</span>' + sep;
    }).join('') + '</div>';
  }

  function esquema(nodos) {
    if (!nodos || !nodos.length) return '';
    return '<div class="esquema">' + nodos.map(function (n, i) {
      var f = i < nodos.length - 1 ? '<span class="baja-flecha">↓</span>' : '';
      return '<div class="nodo">' + esc(n) + '</div>' + f;
    }).join('') + '</div>';
  }

  function etiquetaDominio(valor) {
    var n = TUTOR.nivelDominio(valor);
    return '<span class="etiq ' + n.clase + '">' + n.etiqueta + ' · ' + valor + '%</span>';
  }

  function minutosTexto(m) {
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60), r = m % 60;
    return h + ' h' + (r ? ' ' + r + ' min' : '');
  }

  function fechaCorta(iso) {
    var f = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
    return f.toLocaleDateString('es', { day: 'numeric', month: 'short' });
  }

  function nombreDia(iso) {
    var f = new Date(iso + 'T12:00:00');
    return ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'][f.getDay()];
  }

  /* ---------------- acciones delegadas ---------------- */
  function accion(nombre, fn) { acciones[nombre] = fn; }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-accion]');
    if (!el) return;
    var fn = acciones[el.getAttribute('data-accion')];
    if (fn) {
      e.preventDefault();
      fn(el.dataset, el, e);
    }
  });

  /* ---------------- enrutador ---------------- */
  var rutas = {};
  var rutaActual = null;
  var parametros = {};

  function registrar(id, def) { rutas[id] = def; }

  function ir(id, params) {
    if (!rutas[id]) id = 'inicio';
    rutaActual = id;
    parametros = params || {};
    pintar();
    window.scrollTo(0, 0);
  }

  function pintar() {
    var r = rutas[rutaActual];
    if (!r) return;
    var titulo = typeof r.titulo === 'function' ? r.titulo(parametros) : r.titulo;
    var sub = typeof r.sub === 'function' ? r.sub(parametros) : (r.sub || '');
    var acc = r.acciones ? r.acciones(parametros) : '';

    $('#titulo-vista').innerHTML = esc(titulo);
    $('#sub-vista').innerHTML = sub;
    $('#acciones-vista').innerHTML = acc;
    $('#contenido').className = 'contenido' + (r.angosto ? ' angosto' : '');
    $('#contenido').innerHTML = r.render(parametros);

    if (r.despues) r.despues(parametros);
    marcarNavegacion();
    /* Minerva reevalúa su consejo en cada cambio de vista. */
    if (typeof Minerva !== 'undefined') Minerva.pintarBoton();
  }

  function refrescar() { pintar(); }

  function marcarNavegacion() {
    $$('.nav-item').forEach(function (b) {
      b.classList.toggle('activo', b.dataset.ruta === rutaActual);
    });
    $$('.menu-movil button').forEach(function (b) {
      b.classList.toggle('activo', b.dataset.ruta === rutaActual);
    });
  }

  function actualizarGlobos() {
    var pendientes = Estado.estadisticasTarjetas().vencenHoy;
    $$('[data-globo="tarjetas"]').forEach(function (el) {
      el.innerHTML = pendientes ? '<span class="globo">' + pendientes + '</span>' : '';
    });
  }

  /* ---------------- tema claro/oscuro ----------------
     'auto' retira el atributo para que decidan el anfitrión
     (data-theme) o la preferencia del sistema. */
  function aplicarTema(tema) {
    if (tema === 'auto' || !tema) document.documentElement.removeAttribute('data-tema');
    else document.documentElement.setAttribute('data-tema', tema);
  }

  return {
    esc: esc, $: $, $$: $$,
    brindis: brindis, modal: modal, cerrarModal: cerrarModal,
    barra: barra, variables: variables, cadena: cadena, esquema: esquema,
    etiquetaDominio: etiquetaDominio, minutosTexto: minutosTexto,
    fechaCorta: fechaCorta, nombreDia: nombreDia,
    accion: accion, registrar: registrar, ir: ir, refrescar: refrescar,
    actualizarGlobos: actualizarGlobos, aplicarTema: aplicarTema,
    rutaActual: function () { return rutaActual; }
  };
})();


/* ============================================================
   Cronómetro reutilizable para las sesiones y el examen
   ------------------------------------------------------------
   Cuenta con MARCAS DE TIEMPO, no restando un segundo por cada
   tic. La diferencia importa: los navegadores frenan los
   temporizadores de las pestañas en segundo plano (llegan a un
   tic por minuto), así que un contador por tics se atrasaría
   durante un examen de 30 minutos si Diego cambia de pestaña.
   Calculando contra Date.now(), el reloj de pantalla se corrige
   solo al volver, y la entrega automática se dispara aunque el
   tiempo se haya agotado con la pestaña oculta.
   ============================================================ */

var Crono = (function () {
  var intervalo = null;
  var finEn = 0;          /* marca de tiempo en que llega a cero  */
  var restanteAlPausar = 0;
  var alCambiar = null;
  var alTerminar = null;
  var pausado = false;
  var terminado = false;  /* alTerminar se dispara una sola vez   */

  function formatear(seg) {
    var m = Math.floor(Math.abs(seg) / 60), s = Math.abs(seg) % 60;
    return (seg < 0 ? '−' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function restante() {
    if (pausado) return Math.round(restanteAlPausar / 1000);
    return Math.round((finEn - Date.now()) / 1000);
  }

  function refrescar() {
    if (pausado || !intervalo) return;
    var seg = restante();
    if (alCambiar) alCambiar(seg, formatear(seg));
    /* Al volver de segundo plano el salto puede ser de minutos,
       así que se comprueba <= 0 y no == 0. */
    if (seg <= 0 && !terminado) {
      terminado = true;
      if (alTerminar) alTerminar();
    }
  }

  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refrescar();
    });
  }

  return {
    iniciar: function (minutos, cambio, fin) {
      Crono.parar();
      finEn = Date.now() + Math.round(minutos * 60) * 1000;
      alCambiar = cambio; alTerminar = fin;
      pausado = false; terminado = false;
      if (alCambiar) alCambiar(restante(), formatear(restante()));
      intervalo = setInterval(refrescar, 1000);
    },
    alternarPausa: function () {
      if (pausado) {
        finEn = Date.now() + restanteAlPausar;
        pausado = false;
      } else {
        restanteAlPausar = finEn - Date.now();
        pausado = true;
      }
      return pausado;
    },
    estaPausado: function () { return pausado; },
    parar: function () {
      if (intervalo) clearInterval(intervalo);
      intervalo = null;
      pausado = false;
    },
    transcurridoMin: function (totalMin) {
      return Math.max(0, Math.round(totalMin - restante() / 60));
    },
    formatear: formatear,
    restante: restante
  };
})();


/* ============================================================
   PUENTE CON GOOGLE
   ------------------------------------------------------------
   Todo lo que la app necesita del lado servidor pasa por aquí:
   leer un Google Doc, listar los recientes y (más adelante)
   hablar con la API de Gemini.

   Por qué existe este archivo y no está repartido por las
   vistas: estas funciones SOLO existen dentro de Apps Script.
   En el navegador no hay DriveApp ni UrlFetchApp, y fingir lo
   contrario haría que la app pareciese funcionar en el mockup
   y fallara justo donde importa. Así que el puente responde
   siempre con la misma forma —{ ok, ... } o { ok:false, error }—
   y cuando no está disponible lo dice con todas las letras en
   vez de romperse.
   ============================================================ */

var Puente = (function () {

  var enAppsScript = (typeof google !== 'undefined' &&
    typeof google.script !== 'undefined' &&
    typeof google.script.run !== 'undefined');

  var MOTIVO_SIN_PUENTE =
    'Esto necesita la versión instalada en Google Apps Script. ' +
    'En el mockup del navegador no hay acceso a tu Drive: mira MIGRACION.md ' +
    'para instalarla, o pega el JSON a mano en el paso 3.';

  /* google.script.run usa manejadores, no promesas. Envolverlo
     una vez evita repetir el mismo bloque en cada llamada y deja
     que las vistas usen async/await como con el almacén. */
  function llamar(nombre) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolver) {
      if (!enAppsScript) {
        resolver({ ok: false, error: MOTIVO_SIN_PUENTE, sinPuente: true });
        return;
      }
      var run = google.script.run
        .withSuccessHandler(function (r) {
          /* El servidor devuelve siempre { ok: ... }; si algo
             llega vacío se trata como fallo, no como éxito mudo. */
          resolver(r || { ok: false, error: 'El servidor no devolvió nada.' });
        })
        .withFailureHandler(function (e) {
          resolver({ ok: false, error: (e && e.message) ? e.message : String(e) });
        });
      run[nombre].apply(run, args);
    });
  }

  return {
    disponible: function () { return enAppsScript; },
    motivo: MOTIVO_SIN_PUENTE,
    llamar: llamar,

    /* --- Google Docs como bandeja de entrada --- */
    leerDoc: function (referencia) { return llamar('leerDocumento', referencia); },
    docsRecientes: function () { return llamar('listarDocsRecientes'); },

    /* --- Gemini con File Search ---
       La clave nunca pasa por aquí de vuelta: guardarClave la
       manda al servidor y estadoClave solo dice si está puesta.
       Así no queda copia en el estado de la app, que es
       exportable. */
    guardarClave: function (clave, modelo) { return llamar('guardarClaveGemini', clave, modelo); },
    borrarClave: function () { return llamar('borrarClaveGemini'); },
    estadoClave: function () { return llamar('estadoGemini'); },
    probarClave: function () { return llamar('probarGemini'); },
    almacenes: function () { return llamar('listarAlmacenesGemini'); },
    generar: function (prompt, almacen) { return llamar('generarConGemini', prompt, almacen); },

    /* --- base de datos en Sheets --- */
    bdEstado: function () { return llamar('estadoBaseDeDatos'); },
    bdCrear: function (titulo) { return llamar('crearBaseDeDatos', titulo); },
    bdVincular: function (ref) { return llamar('vincularBaseDeDatos', ref); },
    bdOlvidar: function () { return llamar('olvidarBaseDeDatos'); },
    bdVolcar: function (seccion, filas) { return llamar('volcarSeccion', seccion, filas); },
    bdFinalizar: function (meta) { return llamar('finalizarVolcado', meta); },
    bdLeerContenido: function () { return llamar('leerContenidoBD'); }
  };
})();


/* ============================================================
   MINERVA — asistente de estudio
   ------------------------------------------------------------
   El búho de Minerva emprende su vuelo al caer el crepúsculo
   (Hegel). Apropiado para quien estudia después del turno.

   No es un adorno: lee el estado real (racha, tarjetas vencidas,
   brechas, precisión por nivel, decaimiento por área) y produce
   consejos priorizados con UNA acción concreta cada uno.
   ============================================================ */

var Minerva = (function () {

  /* ------------------------------------------------------------
     Avatar en SVG. Hereda color de los tokens del tema, de modo
     que funciona igual en claro y en oscuro.
     ------------------------------------------------------------ */
  function avatar(tamano, clase) {
    var t = tamano || 40;
    return '<svg class="buho ' + (clase || '') + '" viewBox="0 0 64 64" width="' + t + '" height="' + t + '" ' +
      'role="img" aria-label="Minerva, tu asistente de estudio">' +
      /* penachos */
      '<path d="M14 20 L18 8 L26 16 Z" fill="var(--buho-cuerpo)"/>' +
      '<path d="M50 20 L46 8 L38 16 Z" fill="var(--buho-cuerpo)"/>' +
      /* cuerpo */
      '<ellipse cx="32" cy="36" rx="22" ry="24" fill="var(--buho-cuerpo)"/>' +
      /* pecho */
      '<ellipse cx="32" cy="42" rx="14" ry="16" fill="var(--buho-pecho)" opacity=".55"/>' +
      /* discos faciales */
      '<circle cx="23" cy="30" r="10" fill="var(--buho-cara)"/>' +
      '<circle cx="41" cy="30" r="10" fill="var(--buho-cara)"/>' +
      /* ojos */
      '<g class="buho-ojos">' +
      '<circle cx="23" cy="30" r="6" fill="var(--buho-ojo)"/>' +
      '<circle cx="41" cy="30" r="6" fill="var(--buho-ojo)"/>' +
      '<circle cx="25" cy="28" r="2" fill="#fff" opacity=".9"/>' +
      '<circle cx="43" cy="28" r="2" fill="#fff" opacity=".9"/>' +
      '</g>' +
      /* párpados para el parpadeo */
      '<g class="buho-parpados">' +
      '<circle cx="23" cy="30" r="6.4" fill="var(--buho-cara)"/>' +
      '<circle cx="41" cy="30" r="6.4" fill="var(--buho-cara)"/>' +
      '</g>' +
      /* pico */
      '<path d="M32 33 L28 40 L36 40 Z" fill="var(--buho-pico)"/>' +
      /* alas */
      '<path d="M12 32 Q8 44 16 52 Q14 42 16 34 Z" fill="var(--buho-ala)"/>' +
      '<path d="M52 32 Q56 44 48 52 Q50 42 48 34 Z" fill="var(--buho-ala)"/>' +
      /* patas */
      '<path d="M27 58 v3 M31 58 v3 M33 58 v3 M37 58 v3" stroke="var(--buho-pico)" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>';
  }

  /* ------------------------------------------------------------
     Saludo según la hora. Diego estudia de noche, después del
     turno: el mensaje lo reconoce en lugar de ignorarlo.
     ------------------------------------------------------------ */
  function saludo() {
    var h = new Date().getHours();
    var n = Estado.ajustes().nombre;
    if (h < 6) return '¿Guardia o insomnio, ' + n + '? A esta hora conviene repaso corto, no tema nuevo.';
    if (h < 12) return 'Buenos días, ' + n + '. La mañana rinde bien para comprender mecanismos.';
    if (h < 18) return 'Buenas tardes, ' + n + '. ¿Cuánto tiempo real tienes ahora?';
    if (h < 22) return 'Buenas noches, ' + n + '. Es la franja en la que más has estudiado.';
    return 'Tarde, ' + n + '. Si vienes cansado, quince minutos de tarjetas valen más que forzar un tema nuevo.';
  }

  /* ------------------------------------------------------------
     MOTOR DE REGLAS
     Cada regla devuelve null o un consejo con una sola acción.
     Prioridad mayor = más arriba.
     ------------------------------------------------------------ */
  var REGLAS = [

    /* --- 1. Tarjetas vencidas acumuladas --- */
    function () {
      var s = Estado.estadisticasTarjetas();
      if (s.vencenHoy < 1) return null;
      var urgente = s.vencenHoy >= 25;
      return {
        id: 'tarjetas',
        prioridad: urgente ? 95 : 60,
        tono: urgente ? 'alerta' : 'info',
        titulo: s.vencenHoy + ' tarjetas esperan hoy',
        texto: urgente
          ? 'Se te han acumulado. Si las dejas crecer, el mazo se vuelve una deuda y acabas abandonándolo. Haz una tanda ahora aunque no las termines todas: el algoritmo reorganiza el resto.'
          : 'Es lo más rentable por minuto invertido que puedes hacer ahora mismo. Se recuperan en cualquier hueco, también desde el móvil.',
        accion: { etiqueta: 'Repasar ahora', accion: 'ir-tarjetas' }
      };
    },

    /* --- 2. Racha en riesgo --- */
    function () {
      var d = Estado.datos();
      var hoy = Estado.hoyISO();
      var minHoy = Estado.minutosDe(hoy);
      if (minHoy > 0) return null;
      if (d.racha.dias < 2) return null;
      var hora = new Date().getHours();
      if (hora < 17) return null;
      return {
        id: 'racha',
        prioridad: 80,
        tono: 'alerta',
        titulo: 'Tu racha de ' + d.racha.dias + ' días se corta hoy',
        texto: 'No hace falta una sesión completa. Diez minutos de repaso mantienen la continuidad, y la continuidad es lo que realmente construye la memoria: importa más la frecuencia que la duración.',
        accion: { etiqueta: 'Sesión de 10 min', accion: 'arranque-rapido', datos: { min: 10 } }
      };
    },

    /* --- 3. Brechas repetidas en un mismo tema --- */
    function () {
      var abiertas = Estado.brechasAbiertas();
      if (abiertas.length < 3) return null;
      var cuenta = {};
      abiertas.forEach(function (b) { cuenta[b.tema] = (cuenta[b.tema] || 0) + 1; });
      var peor = null, max = 0;
      Object.keys(cuenta).forEach(function (k) {
        if (cuenta[k] > max) { max = cuenta[k]; peor = k; }
      });
      if (max < 2) return null;
      var t = TUTOR.tema(peor);
      if (!t) return null;
      return {
        id: 'brechas',
        prioridad: 85,
        tono: 'alerta',
        titulo: max + ' brechas abiertas en «' + t.nombre + '»',
        texto: 'Cuando las brechas se concentran en un tema, no es despiste: hay un concepto de base que no está sujeto. Vuelve a él en modo comprender y detente en la fase Feynman, que es donde se ve exactamente qué falta.',
        accion: { etiqueta: 'Reforzar el tema', accion: 'estudiar-tema', datos: { tema: peor } }
      };
    },

    /* --- 4. Área sin tocar --- */
    function () {
      /* No tiene sentido antes de la primera sesión: ahí manda la
         regla de arranque, y decir que "todo está sin abrir" sobra. */
      if (Estado.datos().sesiones.length === 0) return null;
      var activas = Estado.areasActivas();
      if (activas.length < 2) return null;
      var candidata = null;
      activas.forEach(function (id) {
        if (candidata) return;
        var temas = TUTOR.temasDeArea(id);
        if (!temas.length) return;
        var tocada = temas.some(function (t) { return Estado.tema(t.id).vistas > 0; });
        if (!tocada) candidata = id;
      });
      if (!candidata) return null;
      var a = TUTOR.area(candidata);
      var primero = TUTOR.temasDeArea(candidata).filter(function (t) { return t.alto; })[0] ||
        TUTOR.temasDeArea(candidata)[0];
      return {
        id: 'area-nueva',
        prioridad: 40,
        tono: 'info',
        titulo: a.icono + ' ' + a.nombre + ' sigue sin abrir',
        texto: a.lema + ' Intercalar áreas distintas rinde más que agotar una antes de pasar a la siguiente: el contraste entre materias mejora la discriminación y la retención.',
        accion: { etiqueta: 'Empezar por lo esencial', accion: 'estudiar-tema', datos: { tema: primero.id } }
      };
    },

    /* --- 5. Precisión baja en razonamiento clínico --- */
    function () {
      var d = Estado.datos();
      if (d.sesiones.length < 3) return null;
      var acc = 0, tot = 0;
      d.sesiones.slice(0, 8).forEach(function (s) { acc += s.aciertos || 0; tot += s.total || 0; });
      if (tot < 10) return null;
      var pct = Math.round((acc / tot) * 100);
      if (pct >= 65) return null;
      return {
        id: 'precision',
        prioridad: 70,
        tono: 'alerta',
        titulo: 'Precisión del ' + pct + '% en tus últimas sesiones',
        texto: 'Fallar no es el problema; fallar sin volver sí lo es. Prueba una sesión en modo examen: sin explicación previa, solo preguntas con corrección razonada. Es incómodo y es exactamente lo que consolida.',
        accion: { etiqueta: 'Modo examen', accion: 'abrir-preparar' }
      };
    },

    /* --- 6. Tema consolidado que empieza a decaer --- */
    function () {
      var candidato = null, peorDias = 0;
      TUTOR.TEMAS.forEach(function (t) {
        var e = Estado.tema(t.id);
        if (!e.ultimo || e.vistas < 1) return;
        var dias = Estado.diasEntre(e.ultimo, Estado.hoyISO());
        if (dias >= 7 && dias > peorDias) { peorDias = dias; candidato = t; }
      });
      if (!candidato) return null;
      return {
        id: 'decaimiento',
        prioridad: 55,
        tono: 'info',
        titulo: 'Hace ' + peorDias + ' días que no tocas «' + candidato.nombre + '»',
        texto: 'La curva de olvido es más pronunciada justo después de aprender algo. Un repaso corto ahora cuesta cinco minutos; reconstruirlo desde cero dentro de un mes costará la sesión entera.',
        accion: { etiqueta: 'Repaso rápido', accion: 'estudiar-tema', datos: { tema: candidato.id } }
      };
    },

    /* --- 7. Plan más ambicioso que la realidad --- */
    function () {
      var plan = Estado.plan();
      var claves = Object.keys(plan).sort();
      if (claves.length < 4) return null;
      var hoy = Estado.hoyISO();
      var pasados = claves.filter(function (f) { return f < hoy; });
      if (pasados.length < 3) return null;
      var total = 0, hechos = 0;
      pasados.forEach(function (f) {
        plan[f].forEach(function (b) { total++; if (b.hecho) hechos++; });
      });
      if (total === 0) return null;
      var cumplimiento = hechos / total;
      if (cumplimiento > 0.45) return null;
      return {
        id: 'sobrecarga',
        prioridad: 75,
        tono: 'alerta',
        titulo: 'Estás cumpliendo el ' + Math.round(cumplimiento * 100) + '% de tu plan',
        texto: 'Eso casi nunca significa falta de voluntad: significa que el plan no cabe en tu semana. Baja los minutos diarios a lo que de verdad puedes sostener con guardias y familia. Un plan que se cumple al 90 % rinde más que uno ambicioso que se abandona.',
        accion: { etiqueta: 'Ajustar disponibilidad', accion: 'navegar', datos: { ruta: 'ajustes' } }
      };
    },

    /* --- 8. Todo al día --- */
    function () {
      var s = Estado.estadisticasTarjetas();
      var minHoy = Estado.minutosDe(Estado.hoyISO());
      if (s.vencenHoy > 0 || minHoy === 0) return null;
      var global = Estado.dominioGlobal();
      return {
        id: 'al-dia',
        prioridad: 20,
        tono: 'ok',
        titulo: 'Vas al día',
        texto: global < 50
          ? 'Tarjetas al día y sesión hecha. Si te queda tiempo y energía, un tema nuevo rinde más ahora que mañana con prisa.'
          : 'Tarjetas al día, sesión hecha y dominio del ' + global + '%. Este es el momento de profundizar en un tema que ya domines: la profundización sobre base sólida es lo que separa aprobar de razonar.',
        accion: { etiqueta: 'Elegir tema', accion: 'abrir-preparar' }
      };
    },

    /* --- 9. Contenido propio pendiente de revisar --- */
    function () {
      if (typeof Estado.temasSinVerificar !== 'function') return null;
      var pendientes = Estado.temasSinVerificar();
      if (!pendientes.length) return null;
      return {
        id: 'sin-verificar',
        prioridad: 90,
        tono: 'alerta',
        titulo: pendientes.length === 1
          ? 'Un tema tuyo sigue sin verificar'
          : pendientes.length + ' temas tuyos siguen sin verificar',
        texto: 'Los importaste desde tus fuentes y la app comprobó su estructura, no su exactitud. ' +
          'Revísalos antes de fiarte de ellos en un examen o con un paciente: una vez marcados como verificados, ' +
          'dejo de insistir.',
        accion: { etiqueta: 'Revisar «' + pendientes[0].nombre + '»', accion: 'ver-tema', datos: { tema: pendientes[0].id } }
      };
    },

    /* --- 10. Primer arranque --- */
    function () {
      var d = Estado.datos();
      if (d.sesiones.length > 0) return null;
      var s = Estado.sugerencia();
      var t = s ? TUTOR.tema(s.tema) : null;
      if (!t) return null;
      return {
        id: 'primera',
        prioridad: 100,
        tono: 'info',
        titulo: 'Empecemos por lo que más rinde',
        texto: 'No hace falta que decidas nada todavía. «' + t.nombre + '» es alto rendimiento y sostiene buena parte de lo que viene después. Veinte minutos bastan para una sesión completa: se dosifica sola.',
        accion: { etiqueta: 'Sesión de 20 min', accion: 'arranque-rapido', datos: { min: 20 } }
      };
    }
  ];

  function consejos() {
    var salida = [];
    REGLAS.forEach(function (r) {
      try {
        var c = r();
        if (c) salida.push(c);
      } catch (e) { /* una regla defectuosa no debe romper el panel */ }
    });
    salida.sort(function (a, b) { return b.prioridad - a.prioridad; });
    return salida;
  }

  function principal() {
    var c = consejos();
    return c.length ? c[0] : null;
  }

  /* ------------------------------------------------------------
     Voz de Minerva dentro de la sesión: una línea por fase que
     explica POR QUÉ se hace lo que se está haciendo.
     ------------------------------------------------------------ */
  var VOZ_FASE = {
    anclaje: 'Vas a fallar esto y está bien. Intentar recuperar algo que aún no sabes prepara al cerebro para codificarlo: el error previo hace que la explicación se fije mejor que si la leyeras directamente.',
    comprension: 'Lee buscando la cadena causal, no los datos sueltos. Si una flecha no tiene un porqué, ahí tienes tu primera brecha.',
    feynman: 'Esta es la fase que más incomoda y la que más te va a servir. La fluidez al leer engaña; solo producir la explicación revela lo que falta.',
    recuperacion: 'Responde antes de revelar, aunque sea a medias. Y sé honesto al calificarte: si te sobrevaloras, el sistema te devolverá esta pregunta demasiado tarde.',
    caso: 'Pregúntate siempre lo mismo: ¿qué variable cambió primero? El resto del cuadro son consecuencias y compensaciones de esa primera.',
    consolidacion: 'Cierra bien: el error frecuente y la perla son lo que sobrevive a los meses. Las tarjetas ya quedan programadas para devolvértelo justo antes de que lo olvides.'
  };

  function vozFase(idFase) { return VOZ_FASE[idFase] || ''; }

  /* ------------------------------------------------------------
     Panel flotante
     ------------------------------------------------------------ */
  function pintarBoton() {
    var contenedor = UI.$('#minerva');
    if (!contenedor) return;
    if (!Estado.ajustes().asistente) { contenedor.innerHTML = ''; return; }

    var c = principal();
    var alerta = c && (c.tono === 'alerta');
    contenedor.innerHTML =
      '<button class="minerva-btn' + (alerta ? ' con-aviso' : '') + '" data-accion="abrir-minerva" ' +
      'aria-label="Abrir a Minerva, tu asistente">' + avatar(34) +
      (alerta ? '<span class="punto"></span>' : '') + '</button>';
  }

  function abrir() {
    var lista = consejos();
    var html =
      '<div class="minerva-cab">' + avatar(52) +
      '<div><h3 style="margin:0">Minerva</h3>' +
      '<div class="sm tenue">Tu asistente de estudio</div></div>' +
      '<button class="btn btn-s btn-fantasma" data-accion="cerrar-modal" style="margin-left:auto">✕</button>' +
      '</div>' +
      '<p class="minerva-saludo">' + UI.esc(saludo()) + '</p>';

    if (!lista.length) {
      html += '<div class="vacio"><span class="emoji">🌙</span>Nada urgente ahora mismo.</div>';
    } else {
      html += lista.slice(0, 4).map(function (c) {
        return '<div class="minerva-consejo tono-' + c.tono + '">' +
          '<div class="titulo">' + UI.esc(c.titulo) + '</div>' +
          '<p>' + UI.esc(c.texto) + '</p>' +
          (c.accion
            ? '<button class="btn btn-s btn-primario" data-accion="minerva-accion" ' +
              'data-real="' + c.accion.accion + '" ' +
              'data-carga="' + UI.esc(JSON.stringify(c.accion.datos || {})) + '">' +
              UI.esc(c.accion.etiqueta) + ' →</button>'
            : '') +
          '</div>';
      }).join('');
    }

    html += '<div class="minerva-pie">' +
      '<span class="sm tenue">«El búho de Minerva levanta el vuelo al anochecer.» ' +
      'Un buen momento para estudiar es el que existe de verdad.</span></div>';

    UI.modal(html);
  }

  return {
    avatar: avatar,
    consejos: consejos,
    principal: principal,
    vozFase: vozFase,
    pintarBoton: pintarBoton,
    abrir: abrir,
    saludo: saludo
  };
})();

        : '<div class="aviso">Todas las áreas están pausadas. Actívalas en <b>Áreas</b> para que la app pueda sugerirte algo.</div>') +

function tarjetaMetrica(rotulo, valor, extra) {
  return '<div class="tarjeta"><div class="metrica">' +
    '<span class="rotulo">' + rotulo + '</span>' +
    '<span class="valor">' + valor + '</span>' + (extra || '') + '</div></div>';
}

function descripcionTiempo(m) {
  if (m <= 10) return 'Repaso rápido';
  if (m <= 20) return 'Imprescindible';
  if (m <= 30) return 'Comprender';
  if (m <= 45) return 'Tutor intensivo';
  return 'Profundización';
}

function bloqueError(e) {
  if (!e) return '';
  return '<div class="tarjeta"><div class="tarjeta-cab"><h3>⚠️ Error frecuente</h3></div>' +
    '<div class="doc">' +
    '<p><b>Qué se confunde:</b> ' + e.confunde + '</p>' +
    '<p><b>Por qué se parecen:</b> ' + e.parecido + '</p>' +
    '<p><b>La diferencia real:</b> ' + e.diferencia + '</p>' +
    '<p><b>Ejemplo clínico:</b> ' + e.ejemplo + '</p>' +
    '<div class="aviso aviso-alerta"><b>Regla mental:</b> ' + e.regla + '</div>' +
    '</div></div>';
}

UI.registrar('plan', {
  titulo: 'Plan de estudio',
  sub: 'Dosificado según tus minutos disponibles cada día',
  acciones: function () {
    return '<button class="btn btn-s" data-accion="editar-disponibilidad">Disponibilidad</button>' +
      '<button class="btn btn-s btn-primario" data-accion="generar-plan">Regenerar</button>';
  },
  render: function () {
    var plan = Estado.plan();
    var claves = Object.keys(plan).sort();
    if (!claves.length) {
      return '<div class="tarjeta"><div class="vacio"><span class="emoji">🗓️</span>' +
        'Todavía no has generado un plan.<br><span class="sm">El plan reparte los temas priorizando alto rendimiento y menor dominio, y reserva tiempo diario para el repaso espaciado.</span>' +
        '<div class="mt"><button class="btn btn-primario" data-accion="generar-plan">Generar plan de 14 días</button></div></div></div>';
    }

    var hoy = Estado.hoyISO();
    var html = '';
    var totalMin = 0, totalBloques = 0, hechos = 0;
    claves.forEach(function (f) {
      plan[f].forEach(function (b) {
        totalMin += b.minutos; totalBloques++; if (b.hecho) hechos++;
      });
    });

    html += '<div class="rejilla c3">' +
      tarjetaMetrica('Tiempo planificado', UI.minutosTexto(totalMin), '<span class="nota">próximos 14 días</span>') +
      tarjetaMetrica('Bloques completados', hechos + ' / ' + totalBloques,
        UI.barra(totalBloques ? (hechos / totalBloques) * 100 : 0, 'ok')) +
      tarjetaMetrica('Media diaria', Math.round(totalMin / claves.length) + ' min',
        '<span class="nota">ajustable en Disponibilidad</span>') +
      '</div>';

    // semanas de 7 días
    for (var semana = 0; semana < Math.ceil(claves.length / 7); semana++) {
      var dias = claves.slice(semana * 7, semana * 7 + 7);
      html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>' +
        (semana === 0 ? 'Esta semana' : 'Semana siguiente') + '</h3>' +
        '<div class="der sm tenue">' + UI.fechaCorta(dias[0]) + ' – ' + UI.fechaCorta(dias[dias.length - 1]) + '</div></div>' +
        '<div class="semana">';
      dias.forEach(function (f) {
        var bloques = plan[f];
        var min = bloques.reduce(function (a, b) { return a + b.minutos; }, 0);
        html += '<div class="dia' + (f === hoy ? ' hoy' : '') + '">' +
          '<div class="cab"><span class="nombre">' + UI.nombreDia(f) + '</span>' +
          '<span class="num">' + parseInt(f.slice(8), 10) + '</span>' +
          '<span class="min">' + (min || '—') + (min ? "'" : '') + '</span></div>';
        if (!bloques.length) {
          html += '<div class="sm tenue">Descanso</div>';
        } else {
          bloques.forEach(function (b) {
            if (b.tipo === 'repaso') {
              html += '<div class="bloque-plan repaso' + (b.hecho ? ' hecho' : '') + '" data-accion="ir-tarjetas">' +
                '🔁 Tarjetas · ' + b.minutos + "'" + '</div>';
            } else {
              var t = TUTOR.tema(b.tema);
              html += '<div class="bloque-plan' + (b.hecho ? ' hecho' : '') + '" data-accion="estudiar-tema" data-tema="' + b.tema + '">' +
                (t && t.alto ? '🔥 ' : '📘 ') + UI.esc(t ? t.nombre : b.tema) + ' · ' + b.minutos + "'" + '</div>';
            }
          });
        }
        html += '</div>';
      });
      html += '</div></div>';
    }

    html += '<div class="aviso mt"><b>Cómo se construye el plan.</b> Los temas de 🔥 alto rendimiento y los de menor dominio van primero; ' +
      'cada día reserva un bloque de repaso espaciado, porque la retención depende más de la frecuencia de recuperación que del tiempo total invertido. ' +
      'Al completar una sesión, el bloque correspondiente se marca automáticamente.</div>';

    return html;
  }
});

UI.registrar('rendimiento', {
  titulo: 'Rendimiento',
  sub: 'Dónde estás sólido y dónde conviene volver',
  render: function () {
    var d = Estado.datos();
    var sesiones = d.sesiones;
    var totalMin = sesiones.reduce(function (a, s) { return a + (s.minutos || 0); }, 0);
    var totalPreg = sesiones.reduce(function (a, s) { return a + (s.total || 0); }, 0);
    var totalAcc = sesiones.reduce(function (a, s) { return a + (s.aciertos || 0); }, 0);
    var precision = totalPreg ? Math.round((totalAcc / totalPreg) * 100) : 0;
    var stats = Estado.estadisticasTarjetas();

    var html = '<div class="rejilla c4">' +
      tarjetaMetrica('Tiempo total', UI.minutosTexto(totalMin), '<span class="nota">' + sesiones.length + ' sesiones</span>') +
      tarjetaMetrica('Precisión', precision + '%', UI.barra(precision, precision >= 70 ? 'ok' : 'alerta')) +
      tarjetaMetrica('Tarjetas maduras', stats.maduras + ' / ' + stats.total,
        UI.barra(stats.total ? (stats.maduras / stats.total) * 100 : 0, 'ok')) +
      tarjetaMetrica('Dominio global', Estado.dominioGlobal() + '%',
        UI.barra(Estado.dominioGlobal(), 'ok')) +
      '</div>';

    /* mapa de calor de los últimos 35 días */
    html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Constancia (últimos 35 días)</h3>' +
      '<div class="der sm tenue">Cada cuadro es un día</div></div><div class="mapa-calor">';
    for (var i = 34; i >= 0; i--) {
      var f = Estado.hoyISO(-i);
      var min = Estado.minutosDe(f);
      var n = min === 0 ? 0 : min < 10 ? 1 : min < 20 ? 2 : min < 40 ? 3 : 4;
      html += '<i class="' + (n ? 'n' + n : '') + '" title="' + f + ': ' + min + ' min"></i>';
    }
    html += '</div></div>';

    /* tabla de temas ordenada por prioridad de repaso */
    var orden = Estado.temasActivos().sort(function (a, b) {
      return Estado.dominio(a.id) - Estado.dominio(b.id);
    });

    html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Prioridad de repaso</h3>' +
      '<div class="der sm tenue">De menor a mayor dominio</div></div>';
    orden.slice(0, 10).forEach(function (t) {
      var e = Estado.tema(t.id);
      var pct = e.intentos ? Math.round((e.aciertos / e.intentos) * 100) : null;
      var dias = e.ultimo ? Estado.diasEntre(e.ultimo, Estado.hoyISO()) : null;
      html += '<div class="fila"><div class="crece">' +
        '<div class="titulo">' + UI.esc(t.nombre) + (t.alto ? ' <span class="etiq etiq-fuego">🔥</span>' : '') + '</div>' +
        '<div class="sub">' +
        (pct !== null ? pct + '% de acierto · ' : 'sin preguntas respondidas · ') +
        (dias === null ? 'nunca estudiado' : dias === 0 ? 'hoy' : 'hace ' + dias + (dias === 1 ? ' día' : ' días')) +
        '</div>' + UI.barra(Estado.dominio(t.id), Estado.dominio(t.id) >= 70 ? 'ok' : 'acento') + '</div>' +
        '<button class="btn btn-s btn-primario" data-accion="estudiar-tema" data-tema="' + t.id + '">Estudiar</button></div>';
    });
    html += '</div>';

    /* brechas históricas */
    var brechas = Estado.datos().brechas;
    html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Registro de brechas</h3>' +
      '<div class="der sm tenue">' + Estado.brechasAbiertas().length + ' abiertas</div></div>';
    if (!brechas.length) {
      html += '<div class="vacio"><span class="emoji">🧩</span>Sin brechas registradas todavía.</div>';
    } else {
      brechas.slice(0, 12).forEach(function (b, i) {
        var t = TUTOR.tema(b.tema);
        html += '<div class="fila"><div class="crece">' +
          '<div class="titulo"' + (b.resuelta ? ' style="text-decoration:line-through;opacity:.5"' : '') + '>' +
          UI.esc(b.texto) + '</div>' +
          '<div class="sub">' + UI.esc(t ? t.nombre : '') + ' · ' + UI.fechaCorta(b.fecha.slice(0, 10)) + '</div></div>' +
          (b.resuelta ? '<span class="etiq etiq-ok">Resuelta</span>' :
            '<button class="btn btn-s" data-accion="cerrar-brecha" data-i="' + i + '">Marcar resuelta</button>') +
          '</div>';
      });
    }
    html += '</div>';

    return html;
  }
});

/* ============================================================
   TALLER — crear contenido propio desde la interfaz
   ------------------------------------------------------------
   Flujo completo sin tocar código:

     1. Defines destino y tema  → la app genera un PROMPT con el
        esquema exacto que usa el temario.
     2. Lo pegas en NotebookLM (o similar) SOBRE TUS FUENTES:
        apuntes, papers, guías de tu unidad.
     3. Pegas aquí el JSON que devuelve → se valida, se limpia,
        se previsualiza y se integra al temario, al plan y al mazo.

   El contenido importado entra marcado como SIN VERIFICAR hasta
   que lo revisas: es material clínico y la app no puede
   garantizar que sea correcto.
   ============================================================ */

var Taller = (function () {

  /* ------------------------------------------------------------
     Esquema. Fuente única de verdad: de aquí salen el prompt y
     el validador, de modo que no pueden divergir.
     ------------------------------------------------------------ */
  var ESQUEMA = {
    tema: {
      id: { tipo: 'texto', req: true, nota: 'minúsculas y guiones, sin espacios ni acentos' },
      nombre: { tipo: 'texto', req: true },
      alto: { tipo: 'bool', req: true, nota: 'true si es concepto de alto rendimiento' },
      minutos: { tipo: 'numero', req: true, nota: 'duración estimada, 15–30' },
      fuentes: { tipo: 'texto', req: true, nota: 'de qué documento tuyo sale cada parte' },
      ideaCentral: { tipo: 'texto', req: true, nota: '2–4 frases: qué hay que entender de verdad' },
      anclaje: { tipo: 'objeto', req: true, claves: ['q', 'pista'] },
      bloques: { tipo: 'lista', req: true, min: 3, nota: 'cada uno con nivel, titulo y html' },
      variables: { tipo: 'lista', req: true, min: 3, nota: 'cada una con n, d (up/down/eq) y nota' },
      fisiopatologia: { tipo: 'texto', req: true },
      clinica: { tipo: 'texto', req: true },
      error: { tipo: 'objeto', req: true, claves: ['confunde', 'parecido', 'diferencia', 'ejemplo', 'regla'] },
      perla: { tipo: 'texto', req: true },
      feynman: { tipo: 'objeto', req: true, claves: ['consigna', 'puntos', 'referencia'] },
      preguntas: { tipo: 'lista', req: true, min: 6, nota: 'con nivel 1, 2 y 3' },
      caso: { tipo: 'objeto', req: true, claves: ['vineta', 'pasos', 'cierre'] },
      tarjetas: { tipo: 'lista', req: true, min: 5, nota: 'cada una con f (frente) y d (dorso)' }
    }
  };

  var NIVELES_BLOQUE = ['imprescindible', 'importante', 'complementario'];
  var DIRECCIONES = ['up', 'down', 'eq'];

  /* ------------------------------------------------------------
     Saneado del HTML importado.
     El contenido llega de fuera y se inyecta con innerHTML, así
     que se elimina todo lo que pueda ejecutar código. Se permite
     únicamente el marcado que usa el temario.
     ------------------------------------------------------------ */
  var ETIQUETAS_PERMITIDAS = ['P', 'B', 'STRONG', 'I', 'EM', 'U', 'BR', 'UL', 'OL', 'LI',
    'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'CODE', 'SPAN', 'DIV', 'H3', 'H4', 'SMALL', 'SUB', 'SUP'];

  function limpiarHtml(bruto) {
    var texto = String(bruto === undefined || bruto === null ? '' : bruto);
    if (!texto) return '';

    /* Se analiza en un documento INERTE. Asignar innerHTML a un
       elemento suelto no basta: el navegador intenta cargar las
       imágenes y dispara sus manejadores onerror antes de que dé
       tiempo a limpiarlos. DOMParser no carga recursos ni ejecuta
       nada, así que el contenido nunca llega a estar vivo. */
    if (typeof DOMParser === 'undefined') {
      return texto.replace(/<[^>]*>/g, '');   // respaldo conservador
    }
    var doc = new DOMParser().parseFromString('<!doctype html><body>' + texto, 'text/html');
    var caja = doc.body;

    var nodos = caja.querySelectorAll('*');
    for (var i = nodos.length - 1; i >= 0; i--) {
      var n = nodos[i];
      if (ETIQUETAS_PERMITIDAS.indexOf(n.tagName) < 0) {
        /* Se conserva el texto y se descarta la etiqueta. */
        while (n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
        n.parentNode.removeChild(n);
        continue;
      }
      for (var j = n.attributes.length - 1; j >= 0; j--) {
        var attr = n.attributes[j].name;
        var valor = n.attributes[j].value || '';
        var peligroso = attr.indexOf('on') === 0 ||
          attr === 'style' ||
          /javascript:/i.test(valor);
        if (peligroso || ['href', 'src', 'srcset', 'formaction'].indexOf(attr) >= 0) {
          n.removeAttribute(n.attributes[j].name);
        }
      }
    }
    return caja.innerHTML;
  }

  function limpiarTexto(bruto) {
    return String(bruto === undefined || bruto === null ? '' : bruto)
      .replace(/<[^>]*>/g, '').trim();
  }

  function idValido(bruto) {
    return String(bruto || '')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 48);
  }

  /* ------------------------------------------------------------
     VALIDADOR
     Devuelve { ok, errores, avisos, paquete }
     ------------------------------------------------------------ */
  function extraerJson(bruto) {
    var texto = String(bruto || '').trim();
    /* Tolerancia: muchos modelos envuelven la respuesta en ``` */
    var cerca = texto.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (cerca) texto = cerca[1].trim();
    /* O añaden una frase antes del objeto */
    var primero = texto.indexOf('{');
    var ultimo = texto.lastIndexOf('}');
    if (primero > 0 || (ultimo >= 0 && ultimo < texto.length - 1)) {
      if (primero >= 0 && ultimo > primero) texto = texto.slice(primero, ultimo + 1);
    }
    return texto;
  }

  /* Google Docs sustituye las comillas rectas por tipográficas al
     pegar, y eso basta para que JSON.parse falle entero. Como es
     precisamente lo que ocurre al usar un Doc de bandeja, hay que
     contemplarlo o esa vía no sirve de nada. */
  function enderezarComillas(t) {
    return t
      .replace(/[“”„‟«»]/g, '"')
      .replace(/[‘’‚‛]/g, "'");
  }

  function validar(bruto) {
    var errores = [], avisos = [];
    var datos;
    var texto = extraerJson(bruto);

    try {
      datos = JSON.parse(texto);
    } catch (e) {
      /* Se reintenta enderezando las comillas, pero solo como
         segundo intento: hacerlo siempre estropearía un texto que
         legítimamente lleve comillas tipográficas dentro de un
         valor. Si el reintento también falla, se informa del error
         original, que es el que describe el problema de verdad. */
      var rescatado = null;
      try { rescatado = JSON.parse(enderezarComillas(texto)); } catch (e2) { rescatado = null; }

      if (rescatado === null) {
        return {
          ok: false,
          errores: ['El texto no es un JSON válido. ' + e.message +
            '  ·  Comprueba que has pegado el objeto completo, desde la primera llave { hasta la última }.'],
          avisos: []
        };
      }
      datos = rescatado;
      avisos.push('El documento traía comillas tipográficas («») en lugar de rectas ("). ' +
        'Es lo que hace Google Docs al pegar; se corrigieron solas, pero revisa que ningún ' +
        'texto haya perdido comillas que fueran intencionadas.');
    }

    /* Normalización: se acepta un tema suelto o una lista. */
    if (datos.tema && !datos.temas) datos.temas = [datos.tema];
    if (!datos.temas || !datos.temas.length) {
      errores.push('No se encontró ningún tema. El JSON debe incluir "temas": [ … ] (o "tema": { … }).');
      return { ok: false, errores: errores, avisos: avisos };
    }
    if (!datos.modulo) errores.push('Falta el objeto "modulo".');
    if (!datos.area) errores.push('Falta el objeto "area".');
    if (errores.length) return { ok: false, errores: errores, avisos: avisos };

    /* --- área --- */
    var areaId = idValido(datos.area.id || datos.area.nombre);
    if (!areaId) errores.push('El área no tiene un "id" utilizable.');
    var areaExistente = TUTOR.area(areaId);
    var area = null;
    if (!areaExistente) {
      area = {
        id: areaId,
        nombre: limpiarTexto(datos.area.nombre) || areaId,
        icono: limpiarTexto(datos.area.icono).slice(0, 4) || '📗',
        resumen: limpiarTexto(datos.area.resumen) || 'Área creada desde el Taller.',
        lema: limpiarTexto(datos.area.lema) || '',
        propio: true
      };
      if (!datos.area.nombre) avisos.push('El área no traía nombre: se usó el identificador.');
    }

    /* --- módulo --- */
    var moduloId = idValido(datos.modulo.id || datos.modulo.nombre);
    if (!moduloId) errores.push('El módulo no tiene un "id" utilizable.');
    var moduloExistente = TUTOR.modulo(moduloId);
    var modulo = moduloExistente ? null : {
      id: moduloId,
      area: areaId,
      nombre: limpiarTexto(datos.modulo.nombre) || moduloId,
      icono: limpiarTexto(datos.modulo.icono).slice(0, 4) || '📘',
      resumen: limpiarTexto(datos.modulo.resumen) || '',
      propio: true
    };

    /* --- temas --- */
    var temas = [];
    datos.temas.forEach(function (bruto, indice) {
      var ref = 'temas[' + indice + ']';
      var t = {};
      var falta = function (campo) { errores.push(ref + ': falta "' + campo + '".'); };

      t.id = idValido(bruto.id || bruto.nombre);
      if (!t.id) { falta('id'); return; }
      if (TUTOR.tema(t.id)) {
        avisos.push('Ya existía un tema con id "' + t.id + '": se reemplazará.');
      }
      t.nombre = limpiarTexto(bruto.nombre);
      if (!t.nombre) falta('nombre');

      t.modulo = moduloId;
      t.alto = bruto.alto === true || bruto.alto === 'true';
      t.minutos = parseInt(bruto.minutos, 10) || 20;
      if (t.minutos < 5 || t.minutos > 90) { t.minutos = 20; avisos.push(ref + ': minutos fuera de rango, se ajustó a 20.'); }
      t.requisitos = [];
      t.fuentes = limpiarTexto(bruto.fuentes);
      if (!t.fuentes) avisos.push(ref + ': no declara fuentes. Conviene anotarlas para poder revisar el material.');

      t.ideaCentral = limpiarTexto(bruto.ideaCentral);
      if (!t.ideaCentral) falta('ideaCentral');

      /* anclaje */
      if (!bruto.anclaje || !bruto.anclaje.q) falta('anclaje.q');
      t.anclaje = {
        q: limpiarTexto(bruto.anclaje && bruto.anclaje.q),
        pista: limpiarTexto(bruto.anclaje && bruto.anclaje.pista)
      };

      /* bloques */
      t.bloques = [];
      (bruto.bloques || []).forEach(function (b, k) {
        var nivel = String(b.nivel || '').toLowerCase();
        if (NIVELES_BLOQUE.indexOf(nivel) < 0) {
          avisos.push(ref + '.bloques[' + k + ']: nivel "' + b.nivel + '" no reconocido, se usó «imprescindible».');
          nivel = 'imprescindible';
        }
        var bloque = {
          nivel: nivel,
          titulo: limpiarTexto(b.titulo) || 'Bloque ' + (k + 1),
          html: limpiarHtml(b.html)
        };
        if (Array.isArray(b.cadena) && b.cadena.length) {
          bloque.cadena = b.cadena.map(limpiarTexto).filter(Boolean);
        }
        if (Array.isArray(b.esquema) && b.esquema.length) {
          bloque.esquema = b.esquema.map(limpiarTexto).filter(Boolean);
        }
        if (bloque.html) t.bloques.push(bloque);
      });
      if (t.bloques.length < 2) errores.push(ref + ': se necesitan al menos 2 bloques con contenido (hay ' + t.bloques.length + ').');

      /* variables */
      t.variables = (bruto.variables || []).map(function (v, k) {
        var d = String(v.d || '').toLowerCase();
        if (DIRECCIONES.indexOf(d) < 0) {
          d = 'eq';
          avisos.push(ref + '.variables[' + k + ']: dirección no reconocida, se usó «=».');
        }
        return { n: limpiarTexto(v.n), d: d, nota: limpiarTexto(v.nota) };
      }).filter(function (v) { return v.n; });
      if (t.variables.length < 2) avisos.push(ref + ': hay menos de 2 variables clave.');

      t.fisiopatologia = limpiarHtml(bruto.fisiopatologia);
      if (!t.fisiopatologia) falta('fisiopatologia');
      t.clinica = limpiarHtml(bruto.clinica);
      if (!t.clinica) falta('clinica');

      /* error frecuente */
      var e = bruto.error || {};
      t.error = {
        confunde: limpiarTexto(e.confunde),
        parecido: limpiarTexto(e.parecido),
        diferencia: limpiarHtml(e.diferencia),
        ejemplo: limpiarHtml(e.ejemplo),
        regla: limpiarHtml(e.regla)
      };
      if (!t.error.confunde || !t.error.diferencia) falta('error (confunde y diferencia)');

      t.perla = limpiarHtml(bruto.perla);
      if (!t.perla) falta('perla');

      /* feynman */
      var f = bruto.feynman || {};
      t.feynman = {
        consigna: limpiarTexto(f.consigna),
        puntos: (f.puntos || []).map(limpiarTexto).filter(Boolean),
        referencia: limpiarHtml(f.referencia)
      };
      if (!t.feynman.consigna) falta('feynman.consigna');
      if (t.feynman.puntos.length < 3) errores.push(ref + ': feynman.puntos necesita al menos 3 puntos de autoevaluación (hay ' + t.feynman.puntos.length + ').');
      if (!t.feynman.referencia) falta('feynman.referencia');

      /* preguntas */
      t.preguntas = (bruto.preguntas || []).map(function (q) {
        var nivel = parseInt(q.nivel, 10);
        if ([1, 2, 3].indexOf(nivel) < 0) nivel = 1;
        return { nivel: nivel, q: limpiarHtml(q.q), r: limpiarHtml(q.r) };
      }).filter(function (q) { return q.q && q.r; });
      if (t.preguntas.length < 4) errores.push(ref + ': se necesitan al menos 4 preguntas completas (hay ' + t.preguntas.length + ').');
      else {
        [1, 2, 3].forEach(function (n) {
          if (!t.preguntas.some(function (q) { return q.nivel === n; })) {
            avisos.push(ref + ': no hay ninguna pregunta de nivel ' + n + '.');
          }
        });
      }

      /* caso clínico */
      var c = bruto.caso || {};
      t.caso = {
        vineta: limpiarHtml(c.vineta),
        pasos: (c.pasos || []).map(function (p) {
          return { q: limpiarHtml(p.q), pista: limpiarTexto(p.pista), r: limpiarHtml(p.r) };
        }).filter(function (p) { return p.q && p.r; }),
        cierre: limpiarHtml(c.cierre)
      };
      if (!t.caso.vineta) falta('caso.vineta');
      if (t.caso.pasos.length < 3) errores.push(ref + ': el caso necesita al menos 3 pasos con pregunta y respuesta (hay ' + t.caso.pasos.length + ').');

      /* tarjetas */
      t.tarjetas = (bruto.tarjetas || []).map(function (x) {
        return { f: limpiarTexto(x.f), d: limpiarTexto(x.d) };
      }).filter(function (x) { return x.f && x.d; });
      if (t.tarjetas.length < 3) errores.push(ref + ': se necesitan al menos 3 tarjetas (hay ' + t.tarjetas.length + ').');

      /* preguntas de alternativa (opcionales) */
      t.mcq = [];
      (bruto.mcq || []).forEach(function (m, k) {
        var ref2 = ref + '.mcq[' + k + ']';
        var enunciado = limpiarHtml(m.q);
        var opciones = (m.o || []).map(function (o) {
          var op = { t: limpiarTexto(o.t), r: limpiarTexto(o.r) };
          if (o.ok === true || o.ok === 'true') op.ok = true;
          return op;
        }).filter(function (o) { return o.t; });

        if (!enunciado) { avisos.push(ref2 + ': sin enunciado, se descarta.'); return; }
        if (opciones.length < 3) { avisos.push(ref2 + ': menos de 3 opciones, se descarta.'); return; }

        var correctas = opciones.filter(function (o) { return o.ok; }).length;
        if (correctas !== 1) {
          avisos.push(ref2 + ': tiene ' + correctas + ' opciones marcadas como correctas (debe haber exactamente 1). Se descarta.');
          return;
        }
        var sinRazon = opciones.filter(function (o) { return !o.r; }).length;
        if (sinRazon) {
          avisos.push(ref2 + ': ' + sinRazon + ' opciones sin explicación. Se importa, pero la revisión será menos útil.');
        }
        var nivel = parseInt(m.n, 10);
        if ([1, 2, 3].indexOf(nivel) < 0) nivel = 1;
        t.mcq.push({ n: nivel, q: enunciado, o: opciones });
      });

      /* Marcas de procedencia */
      t.propio = true;
      t.verificado = false;
      t.creado = new Date().toISOString();

      /* Aviso si el modelo declaró huecos */
      var serializado = JSON.stringify(t);
      if (/NO CUBIERTO POR LAS FUENTES/i.test(serializado)) {
        avisos.push(ref + ': hay apartados marcados como no cubiertos por tus fuentes. Revísalos antes de estudiar el tema.');
      }

      temas.push(t);
    });

    return {
      ok: errores.length === 0,
      errores: errores,
      avisos: avisos,
      paquete: { area: area, modulo: modulo, temas: temas, areaId: areaId, moduloId: moduloId }
    };
  }

  /* ------------------------------------------------------------
     Registro del contenido guardado al arrancar la app
     ------------------------------------------------------------ */
  function registrarGuardado() {
    var c = Estado.contenido();
    (c.areas || []).forEach(function (a) {
      if (!TUTOR.area(a.id)) TUTOR.AREAS.push(a);
    });
    (c.modulos || []).forEach(function (m) {
      if (!TUTOR.modulo(m.id)) TUTOR.MODULOS.push(m);
    });
    (c.temas || []).forEach(function (t) {
      if (!TUTOR.tema(t.id)) TUTOR.TEMAS.push(t);
    });
  }

  /* Integra un paquete recién validado, en memoria y en disco. */
  function importar(paquete) {
    if (paquete.area && !TUTOR.area(paquete.area.id)) TUTOR.AREAS.push(paquete.area);
    if (paquete.modulo && !TUTOR.modulo(paquete.modulo.id)) TUTOR.MODULOS.push(paquete.modulo);
    paquete.temas.forEach(function (t) {
      var i = -1;
      for (var k = 0; k < TUTOR.TEMAS.length; k++) if (TUTOR.TEMAS[k].id === t.id) i = k;
      if (i >= 0) TUTOR.TEMAS[i] = t; else TUTOR.TEMAS.push(t);
    });
    Estado.agregarContenido(paquete);

    /* El área nueva entra activa: si acabas de crearla, la quieres. */
    if (paquete.area) {
      var activas = Estado.areasActivas().slice();
      if (activas.indexOf(paquete.area.id) < 0) {
        activas.push(paquete.area.id);
        Estado.guardarAjustes({ areasActivas: activas });
      }
    }
    Estado.generarPlan(14);
  }

  return {
    construirPrompt: construirPrompt,
    validar: validar,
    importar: importar,
    registrarGuardado: registrarGuardado,
    limpiarHtml: limpiarHtml,
    idValido: idValido,
    ESQUEMA: ESQUEMA
  };
})();
