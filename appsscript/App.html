    /* --- contenidos propios --- */
    var propios = Estado.temasPropios();
    html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Tus contenidos</h3>' +
      '<div class="der"><span class="etiq' + (Estado.temasSinVerificar().length ? ' etiq-alerta' : '') + '">' +
      Estado.temasSinVerificar().length + ' sin verificar</span></div></div>';
    if (!propios.length) {
      html += '<div class="vacio"><span class="emoji">📥</span>Todavía no has creado contenido propio.<br>' +
        '<span class="sm">Lo que importes aparecerá aquí y podrás revisarlo, verificarlo o eliminarlo.</span></div>';
    } else {
      propios.forEach(function (t) {
        var area = TUTOR.area(TUTOR.areaDeTema(t.id));
        html += '<div class="fila"><div class="crece">' +
          '<div class="titulo">' + UI.esc(t.nombre) +
          (t.verificado
            ? ' <span class="etiq etiq-ok">verificado</span>'
            : ' <span class="etiq etiq-alerta">sin verificar</span>') + '</div>' +
          '<div class="sub">' + (area ? area.icono + ' ' + UI.esc(area.nombre) + ' · ' : '') +
          (t.tarjetas || []).length + ' tarjetas' +
          (t.fuentes ? ' · ' + UI.esc(t.fuentes.slice(0, 60)) : '') + '</div></div>' +
          '<button class="btn btn-s btn-fantasma" data-accion="ver-tema" data-tema="' + t.id + '">Revisar</button>' +
          (t.verificado ? '' :
            '<button class="btn btn-s" data-accion="taller-verificar" data-tema="' + t.id + '">Marcar verificado</button>') +
          '<button class="btn btn-s btn-fantasma" data-accion="taller-eliminar" data-tema="' + t.id + '">Eliminar</button>' +
          '</div>';
      });
    }
    html += '</div>';

    return html;
  },

  despues: function () {
    var destino = UI.$('#t-destino');
    if (!destino) return;
    destino.addEventListener('change', function () {
      var nueva = destino.value === 'nueva';
      UI.$('#t-bloque-nueva').classList.toggle('oculto', !nueva);
      UI.$('#t-bloque-existente').classList.toggle('oculto', nueva);
    });
  }
});


/* ============================================================
   ESTUDIO — motor de la sesión guiada con el método MIT
   Fases: anclaje → comprensión → Feynman → recuperación activa
          → razonamiento clínico → consolidación
   ============================================================ */

var Sesion = (function () {
  var s = null;   // sesión activa

  /* ------------------------------------------------------------
     Reparto del tiempo entre fases según el modo elegido
     ------------------------------------------------------------ */
  function repartirTiempo(modo, minutos) {
    var total = 0;
    modo.fases.forEach(function (f) { total += modo.pesos[f] || 0; });
    return modo.fases.map(function (f) {
      return {
        id: f,
        minutos: Math.max(1, Math.round(minutos * (modo.pesos[f] || 0) / total))
      };
    });
  }

  /* Selección de preguntas según modo y tiempo disponible. */
  function elegirPreguntas(tema, modo, minutosFase) {
    var cupo = Math.max(2, Math.min(8, Math.round(minutosFase / 1.6)));
    var porNivel = { 1: [], 2: [], 3: [] };
    tema.preguntas.forEach(function (q) { porNivel[q.nivel].push(q); });

    var orden;
    if (modo.id === 'repaso') orden = [1, 1, 2, 1, 2];
    else if (modo.id === 'examen') orden = [1, 2, 2, 3, 3, 3];
    else if (modo.id === 'profundizar') orden = [2, 3, 2, 3, 3];
    else orden = [1, 2, 2, 3, 1, 3];

    var salida = [];
    var indices = { 1: 0, 2: 0, 3: 0 };
    for (var i = 0; i < orden.length && salida.length < cupo; i++) {
      var n = orden[i];
      if (porNivel[n][indices[n]]) { salida.push(porNivel[n][indices[n]]); indices[n]++; }
    }
    // completar con lo que quede
    [1, 2, 3].forEach(function (n) {
      while (salida.length < cupo && porNivel[n][indices[n]]) {
        salida.push(porNivel[n][indices[n]]); indices[n]++;
      }
    });
    return salida;
  }

  function iniciar(idTema, idModo, minutos) {
    var tema = TUTOR.tema(idTema);
    var modo = TUTOR.modo(idModo);
    if (!tema) return;

    s = {
      tema: tema,
      modo: modo,
      minutos: minutos,
      fases: repartirTiempo(modo, minutos),
      indice: 0,
      inicio: Date.now(),
      aciertos: 0,
      total: 0,
      preguntas: [],
      pasoPregunta: 0,
      pasoCaso: 0,
      brechasMarcadas: [],
      bloques: tema.bloques.filter(function (b) {
        return modo.niveles.indexOf(b.nivel) >= 0;
      })
    };
    var faseRec = s.fases.filter(function (f) { return f.id === 'recuperacion'; })[0];
    s.preguntas = elegirPreguntas(tema, modo, faseRec ? faseRec.minutos : 6);

    UI.ir('sesion');
    arrancarCrono();
  }

  function arrancarCrono() {
    Crono.iniciar(s.minutos, function (seg, txt) {
      var el = UI.$('#crono');
      if (!el) return;
      el.textContent = txt;
      el.className = 'cronometro' + (seg < 0 ? ' critico' : seg < 120 ? ' aviso' : '');
    }, function () {
      UI.brindis('Se acabó el tiempo previsto. Puedes cerrar la sesión cuando quieras.');
    });
  }

  function faseActual() { return s.fases[s.indice]; }

  function avanzar() {
    var fase = faseActual();
    if (fase) Estado.registrarFase(s.tema.id, fase.id);
    if (s.indice < s.fases.length - 1) {
      s.indice += 1;
      s.pasoPregunta = 0;
      s.pasoCaso = 0;
      UI.refrescar();
      window.scrollTo(0, 0);
    } else {
      cerrar();
    }
  }

  function cerrar() {
    Crono.parar();
    var transcurrido = Math.max(1, Math.round((Date.now() - s.inicio) / 60000));
    Estado.cerrarSesion({
      tema: s.tema.id,
      modo: s.modo.id,
      minutos: transcurrido,
      aciertos: s.aciertos,
      total: s.total
    });
    var resumen = {
      tema: s.tema, minutos: transcurrido,
      aciertos: s.aciertos, total: s.total,
      brechas: s.brechasMarcadas.slice(),
      dominio: Estado.dominio(s.tema.id)
    };
    s = null;
    UI.ir('resumen', { r: resumen });
  }

  function abandonar() {
    Crono.parar();
    s = null;
    UI.ir('inicio');
  }

  /* ============================================================
     RENDERIZADO POR FASE
     ============================================================ */

  function cabecera() {
    var fase = faseActual();
    var def = TUTOR.FASES[fase.id];
    var pasos = s.fases.map(function (f, i) {
      return '<div class="paso-sesion ' + (i < s.indice ? 'hecho' : i === s.indice ? 'actual' : '') + '"></div>';
    }).join('');

    return '<div class="sesion-cab">' +
      '<div><div class="sm tenue">' + UI.esc(s.tema.nombre) + '</div>' +
      '<div style="font-weight:650">' + def.icono + ' ' + def.nombre + '</div></div>' +
      '<div class="pasos-sesion">' + pasos + '</div>' +
      '<div class="cronometro" id="crono">--:--</div>' +
      '<button class="btn btn-s btn-fantasma" data-accion="pausar-sesion" id="btn-pausa">⏸</button>' +
      '<button class="btn btn-s btn-fantasma" data-accion="abandonar-sesion">Salir</button>' +
      '</div>' +
      '<div class="aviso"><b>' + UI.esc(def.lema) + '</b><br>' +
      '<span class="sm">' + UI.esc(def.principio) + '</span></div>' +
      (Estado.ajustes().asistente && typeof Minerva !== 'undefined'
        ? '<div class="minerva-linea">' + Minerva.avatar(32) +
          '<div><div class="nombre">Minerva</div><p>' + UI.esc(Minerva.vozFase(fase.id)) + '</p></div></div>'
        : '');
  }

  function pie(textoBoton) {
    return '<div class="linea fin mt">' +
      '<button class="btn btn-primario btn-g" data-accion="fase-siguiente">' +
      (textoBoton || 'Continuar') + ' →</button></div>';
  }

  function renderAnclaje() {
    var t = s.tema;
    return '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">1</span>Antes de leer nada</div>' +
      '<h2>' + UI.esc(t.anclaje.q) + '</h2>' +
      '<p class="sm tenue">No busques la respuesta. Escribe lo que recuerdes, aunque sea incompleto o erróneo: ' +
      'el intento fallido es lo que prepara la codificación del contenido que viene.</p>' +
      '<textarea id="resp-anclaje" placeholder="Escribe tu respuesta de memoria…"></textarea>' +
      '<div class="aviso aviso-alerta mt"><b>Pista si te bloqueas:</b> ' + UI.esc(t.anclaje.pista) + '</div>' +
      '</div>' +
      '<div class="aviso aviso-acento mt"><b>Idea central del tema.</b> ' + t.ideaCentral + '</div>' +
      pie('Ya lo intenté, seguir');
  }

  function renderComprension() {
    var html = '<div class="tarjeta"><div class="fase-etiqueta"><span class="num">2</span>Construir el mecanismo</div>' +
      '<div class="doc">';
    s.bloques.forEach(function (b) {
      html += '<div class="seccion-tema"><h3>' + UI.esc(b.titulo) +
        ' <span class="etiq ' + (b.nivel === 'imprescindible' ? 'etiq-acento' : b.nivel === 'importante' ? 'etiq-info' : '') + '">' +
        TUTOR.NIVELES[b.nivel].nombre + '</span></h3>' +
        (b.html || '') + UI.cadena(b.cadena) + UI.esquema(b.esquema) + '</div>';
    });
    html += '</div></div>';

    html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Variables que debes manejar</h3></div>' +
      UI.variables(s.tema.variables) + '</div>';

    if (s.modo.niveles.length > 1) {
      html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Fisiopatología</h3></div>' +
        '<div class="doc">' + s.tema.fisiopatologia + '</div></div>';
      html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Correlación clínica</h3></div>' +
        '<div class="doc">' + s.tema.clinica + '</div></div>';
    }

    var omitidos = s.tema.bloques.length - s.bloques.length;
    if (omitidos > 0) {
      html += '<div class="aviso mt"><b>Modo «poco tiempo» activo.</b> Se han omitido ' + omitidos +
        ' bloque(s) de nivel complementario para proteger las fases de recuperación y caso clínico, ' +
        'que son las que producen retención. Puedes verlos en la ficha del tema cuando tengas más margen.</div>';
    }

    return html + pie('Ahora explícalo tú');
  }

  function renderFeynman() {
    var f = s.tema.feynman;
    var puntos = f.puntos.map(function (p, i) {
      return '<label class="fila" style="cursor:pointer;gap:9px">' +
        '<input type="checkbox" class="chk-feynman" data-i="' + i + '" style="width:auto;margin:0">' +
        '<span class="crece">' + UI.esc(p) + '</span></label>';
    }).join('');

    return '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">3</span>Técnica Feynman</div>' +
      '<h2>' + UI.esc(f.consigna) + '</h2>' +
      '<p class="sm tenue">Escríbelo como se lo explicarías a un residente de primer año, sin volver atrás a mirar. ' +
      'Si necesitas una palabra técnica para no trabarte, esa palabra es tu brecha.</p>' +
      '<textarea id="resp-feynman" style="min-height:170px" placeholder="Explícalo con tus palabras…"></textarea>' +
      '<div class="linea mt"><button class="btn btn-primario" data-accion="revelar-feynman">Comparar con la explicación de referencia</button></div>' +
      '</div>' +
      '<div id="feynman-referencia" class="oculto">' +
      '<div class="tarjeta"><div class="tarjeta-cab"><h3>Autoevaluación</h3>' +
      '<div class="der sm tenue">Marca lo que SÍ mencionaste</div></div>' +
      puntos +
      '<div class="aviso aviso-alerta mt"><b>Lo que dejes sin marcar se registra como brecha</b> y aparecerá en tu panel de inicio y en el plan de repaso.</div>' +
      '</div>' +
      '<div class="tarjeta"><div class="tarjeta-cab"><h3>Explicación de referencia</h3></div>' +
      '<div class="doc">' + f.referencia + '</div></div>' +
      pie('Registrar brechas y seguir') +
      '</div>';
  }

  function renderRecuperacion() {
    if (!s.preguntas.length) return '<div class="vacio">Sin preguntas disponibles.</div>' + pie();

    var i = s.pasoPregunta;
    if (i >= s.preguntas.length) {
      var pct = s.total ? Math.round((s.aciertos / s.total) * 100) : 0;
      return '<div class="tarjeta centro">' +
        '<div class="metrica" style="align-items:center"><span class="rotulo">Precisión en esta fase</span>' +
        '<span class="valor">' + pct + '%</span>' +
        '<span class="nota">' + s.aciertos + ' de ' + s.total + ' preguntas</span></div>' +
        UI.barra(pct, pct >= 70 ? 'ok' : 'alerta') +
        '<p class="sm tenue mt">' + (pct >= 80
          ? 'Sólido. El tema está entrando en memoria a largo plazo.'
          : pct >= 50
            ? 'Va bien, pero conviene un repaso corto en 2 días: es justo cuando la curva de olvido cae más.'
            : 'Precisión baja: no es fracaso, es información. Este tema vuelve al principio de tu plan.') +
        '</p></div>' + pie('Ir al caso clínico');
    }

    var q = s.preguntas[i];
    var nombresNivel = { 1: 'Nivel 1 · Conocimiento', 2: 'Nivel 2 · Integración', 3: 'Nivel 3 · Razonamiento clínico' };

    return '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">4</span>Recuperación activa · ' + (i + 1) + ' de ' + s.preguntas.length + '</div>' +
      '<div class="pregunta-bloque" style="border:0;padding:0">' +
      '<div class="nivel">' + nombresNivel[q.nivel] + '</div>' +
      '<div class="enunciado" style="font-size:1.08rem">' + q.q + '</div>' +
      '<textarea id="resp-preg" placeholder="Responde antes de revelar. Escribir obliga a comprometerse."></textarea>' +
      '<div class="linea mt"><button class="btn btn-primario" data-accion="revelar-respuesta">Revelar respuesta</button></div>' +
      '<div id="zona-respuesta" class="oculto">' +
      '<div class="respuesta-oculta">' + q.r + '</div>' +
      '<div class="autoeval">' +
      '<button class="btn grado-1" data-accion="calificar-preg" data-ok="0">✗ Fallé</button>' +
      '<button class="btn grado-2" data-accion="calificar-preg" data-ok="0">~ Dudé mucho</button>' +
      '<button class="btn grado-3" data-accion="calificar-preg" data-ok="1">◐ Casi completo</button>' +
      '<button class="btn grado-4" data-accion="calificar-preg" data-ok="1">✓ Correcto</button>' +
      '</div>' +
      '<p class="sm tenue mt mb0">Sé honesto: el sistema usa esta calificación para decidir cuándo te vuelve a preguntar. ' +
      'Sobrevalorarte solo retrasa el momento en que descubres que no lo sabías.</p>' +
      '</div></div></div>';
  }

  function renderCaso() {
    var caso = s.tema.caso;
    var i = s.pasoCaso;

    var html = '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">5</span>Razonamiento clínico</div>' +
      '<div class="caso-vineta">' + caso.vineta + '</div></div>';

    if (i >= caso.pasos.length) {
      html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Cierre del caso</h3></div>' +
        '<div class="doc">' + caso.cierre + '</div></div>';
      return html + pie('Consolidar');
    }

    var paso = caso.pasos[i];
    html += '<div class="tarjeta">' +
      '<div class="sm tenue">Pregunta ' + (i + 1) + ' de ' + caso.pasos.length + '</div>' +
      '<div class="enunciado" style="font-size:1.05rem;font-weight:600;margin:6px 0 12px">' + paso.q + '</div>' +
      '<textarea id="resp-caso" placeholder="Razona en voz alta: ¿qué variable cambió y por qué?"></textarea>' +
      '<div class="linea mt">' +
      '<button class="btn btn-s btn-fantasma" data-accion="pista-caso">Ver pista</button>' +
      '<button class="btn btn-primario" data-accion="revelar-caso">Revelar razonamiento</button></div>' +
      '<div id="pista-caso" class="oculto"><div class="aviso aviso-alerta mt">' + UI.esc(paso.pista) + '</div></div>' +
      '<div id="zona-caso" class="oculto">' +
      '<div class="respuesta-oculta">' + paso.r + '</div>' +
      '<div class="linea fin mt"><button class="btn btn-primario" data-accion="siguiente-caso">Siguiente paso →</button></div>' +
      '</div></div>';

    // pasos ya respondidos, plegados arriba
    if (i > 0) {
      html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Cadena reconstruida</h3></div>' +
        UI.cadena(caso.pasos.slice(0, i).map(function (p, k) { return 'Paso ' + (k + 1); })) + '</div>';
    }
    return html;
  }

  function renderConsolidacion() {
    var t = s.tema;
    var nTarjetas = (t.tarjetas || []).length;

    return '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">6</span>Consolidación</div>' +
      '<h2>Lo que no debe olvidarse de este tema</h2></div>' +
      bloqueError(t.error) +
      '<div class="aviso aviso-ok mt"><b>Perla de examen.</b> ' + t.perla + '</div>' +
      '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Al mazo de repaso espaciado</h3>' +
      '<div class="der"><span class="etiq etiq-info">' + nTarjetas + ' tarjetas</span></div></div>' +
      '<p class="sm tenue">Estas tarjetas ya están en tu mazo y el algoritmo las programará según tu rendimiento. ' +
      'La primera revisión será mañana; después, los intervalos crecen si aciertas y se reinician si fallas.</p>' +
      '<ul class="lista-limpia">' +
      (t.tarjetas || []).slice(0, 4).map(function (c) {
        return '<div class="fila"><div class="crece"><div class="titulo">' + UI.esc(c.f) + '</div></div>' +
          '<span class="etiq">nueva</span></div>';
      }).join('') +
      (nTarjetas > 4 ? '<div class="fila"><div class="sm tenue">y ' + (nTarjetas - 4) + ' más…</div></div>' : '') +
      '</ul></div>' +
      '<div class="linea fin mt"><button class="btn btn-primario btn-g" data-accion="fase-siguiente">Cerrar sesión ✓</button></div>';
  }

  /* ------------------------------------------------------------ */
  function render() {
    if (!s) return '<div class="vacio">No hay sesión activa.</div>';
    var fase = faseActual().id;
    var cuerpo =
      fase === 'anclaje' ? renderAnclaje() :
      fase === 'comprension' ? renderComprension() :
      fase === 'feynman' ? renderFeynman() :
      fase === 'recuperacion' ? renderRecuperacion() :
      fase === 'caso' ? renderCaso() :
      renderConsolidacion();
    return cabecera() + cuerpo;
  }

  return {
    iniciar: iniciar,
    render: render,
    avanzar: avanzar,
    abandonar: abandonar,
    activa: function () { return !!s; },
    datos: function () { return s; },
    calificar: function (ok) {
      s.total += 1;
      if (ok) s.aciertos += 1;
      Estado.registrarRespuesta(s.tema.id, ok);
      if (!ok) {
        var q = s.preguntas[s.pasoPregunta];
        Estado.anotarBrecha(s.tema.id, 'Pregunta fallada: ' + q.q.slice(0, 90));
      }
      s.pasoPregunta += 1;
      UI.refrescar();
      window.scrollTo(0, 0);
    },
    siguienteCaso: function () {
      s.pasoCaso += 1;
      UI.refrescar();
      window.scrollTo(0, 0);
    },
    registrarBrechasFeynman: function (indicesNoMarcados) {
      var f = s.tema.feynman;
      indicesNoMarcados.forEach(function (i) {
        Estado.anotarBrecha(s.tema.id, 'No explicado: ' + f.puntos[i]);
        s.brechasMarcadas.push(f.puntos[i]);
      });
    }
  };
})();


/* ------------------------------------------------------------
   VISTA de la sesión y del resumen
   ------------------------------------------------------------ */
UI.registrar('sesion', {
  titulo: function () { return Sesion.activa() ? Sesion.datos().tema.nombre : 'Sesión'; },
  sub: function () {
    if (!Sesion.activa()) return '';
    var s = Sesion.datos();
    return s.modo.icono + ' ' + UI.esc(s.modo.nombre) + ' · ' + s.minutos + ' min planificados';
  },
  angosto: true,
  render: function () { return Sesion.render(); }
});

UI.registrar('resumen', {
  titulo: 'Sesión completada',
  sub: 'Lo que has consolidado y lo que queda pendiente',
  angosto: true,
  render: function (p) {
    var r = p.r;
    if (!r) return '<div class="vacio">Sin datos de sesión.</div>';
    var pct = r.total ? Math.round((r.aciertos / r.total) * 100) : null;

    var html = '<div class="tarjeta centro">' +
      '<div style="font-size:2.6rem">✅</div>' +
      '<h2>' + UI.esc(r.tema.nombre) + '</h2>' +
      '<p class="tenue">' + r.minutos + ' minutos de estudio efectivo</p></div>';

    html += '<div class="rejilla c3 mt">' +
      tarjetaMetrica('Precisión', pct === null ? '—' : pct + '%',
        pct === null ? '' : UI.barra(pct, pct >= 70 ? 'ok' : 'alerta')) +
      tarjetaMetrica('Dominio del tema', r.dominio + '%', UI.barra(r.dominio, 'ok')) +
      tarjetaMetrica('Brechas nuevas', r.brechas.length,
        '<span class="nota">' + (r.brechas.length ? 'irán al plan de repaso' : 'explicación completa') + '</span>') +
      '</div>';

    if (r.brechas.length) {
      html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Puntos que no explicaste</h3></div>' +
        r.brechas.map(function (b) {

});

/* ============================================================
   EXAMEN — preguntas de alternativa con corrección automática
   ------------------------------------------------------------
   Simula la prueba real: cronómetro, navegación entre preguntas,
   marcar para revisar y entrega con informe.

   Lo que lo separa de un cuestionario cualquiera es la revisión:
   cada distractor lleva escrito POR QUÉ es incorrecto, de modo
   que un fallo enseña el error conceptual concreto que lo
   provocó. Los temas fallados generan brechas y vuelven al plan.
   ============================================================ */

var Examen = (function () {
  var e = null;   // examen en curso

  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ------------------------------------------------------------
     Construcción del examen.
     Se muestrea de los temas activos, priorizando los de menor
     dominio y los de alto rendimiento: el examen debe atacar lo
     flojo, no repartirse a ciegas.
     ------------------------------------------------------------ */
  function construir(cfg) {
    var candidatos = [];

    Estado.temasActivos().forEach(function (t) {
      if (cfg.area && TUTOR.areaDeTema(t.id) !== cfg.area) return;
      TUTOR.mcqDe(t.id).forEach(function (p, i) {
        if (cfg.nivel && cfg.nivel !== 'todos' && String(p.n) !== String(cfg.nivel)) return;
        candidatos.push({
          ref: t.id + '#' + i,
          tema: t.id,
          area: TUTOR.areaDeTema(t.id),
          n: p.n,
          q: p.q,
          o: p.o,
          /* Menor dominio y alto rendimiento pesan más. */
          peso: (100 - Estado.dominio(t.id)) + (t.alto ? 30 : 0) + Math.random() * 25
        });
      });
    });

    if (!candidatos.length) return null;

    candidatos.sort(function (a, b) { return b.peso - a.peso; });
    var elegidas = candidatos.slice(0, cfg.preguntas);

    /* Se baraja el orden de las preguntas y el de sus opciones,
       para que no se memorice la posición de la correcta. */
    return barajar(elegidas).map(function (p) {
      return {
        ref: p.ref, tema: p.tema, area: p.area, n: p.n, q: p.q,
        opciones: barajar(p.o),
        respuesta: null,
        marcada: false
      };
    });
  }

  function iniciar(cfg) {
    var preguntas = construir(cfg);
    if (!preguntas || !preguntas.length) {
      UI.brindis('No hay preguntas disponibles con esos filtros');
      return false;
    }
    e = {
      cfg: cfg,
      preguntas: preguntas,
      indice: 0,
      inicio: Date.now(),
      entregado: false,
      resultado: null
    };
    UI.ir('examen');
    Crono.iniciar(cfg.minutos, function (seg, txt) {
      var el = UI.$('#crono-examen');
      if (!el) return;
      el.textContent = txt;
      el.className = 'cronometro' + (seg < 0 ? ' critico' : seg < 120 ? ' aviso' : '');
    }, function () {
      UI.brindis('Se acabó el tiempo · entrega automática');
      entregar();
    });
    return true;
  }

  function responder(indicePregunta, indiceOpcion) {
    e.preguntas[indicePregunta].respuesta = indiceOpcion;
  }

  function marcar(indicePregunta) {
    var p = e.preguntas[indicePregunta];
    p.marcada = !p.marcada;
  }

  function ir(indice) {
    e.indice = Math.max(0, Math.min(e.preguntas.length - 1, indice));
    UI.refrescar();
    window.scrollTo(0, 0);
  }

  /* ------------------------------------------------------------
     Corrección
     ------------------------------------------------------------ */
  function entregar() {
    if (!e || e.entregado) return;
    Crono.parar();
    e.entregado = true;

    var porArea = {}, porNivel = { 1: { ok: 0, n: 0 }, 2: { ok: 0, n: 0 }, 3: { ok: 0, n: 0 } };
    var aciertos = 0, sinResponder = 0;
    var temasFallados = {};

    e.preguntas.forEach(function (p) {
      var elegida = p.respuesta === null ? null : p.opciones[p.respuesta];
      var correcta = elegida && elegida.ok === true;
      p.correcta = correcta;
      if (p.respuesta === null) sinResponder++;
      if (correcta) aciertos++;

      if (!porArea[p.area]) porArea[p.area] = { ok: 0, n: 0 };
      porArea[p.area].n++;
      if (correcta) porArea[p.area].ok++;

      porNivel[p.n].n++;
      if (correcta) porNivel[p.n].ok++;

      /* Cada respuesta alimenta el dominio del tema, igual que
         las preguntas abiertas de una sesión. */
      Estado.registrarRespuesta(p.tema, correcta);

      if (!correcta) {
        temasFallados[p.tema] = (temasFallados[p.tema] || 0) + 1;
      }
    });

    /* Los fallos se convierten en brechas: es información, no castigo. */
    Object.keys(temasFallados).forEach(function (idTema) {
      Estado.anotarBrecha(idTema, 'Examen: ' + temasFallados[idTema] +
        (temasFallados[idTema] === 1 ? ' pregunta fallada' : ' preguntas falladas'));
    });

    var minutos = Math.max(1, Math.round((Date.now() - e.inicio) / 60000));
    e.resultado = {
      aciertos: aciertos,
      total: e.preguntas.length,
      sinResponder: sinResponder,
      porcentaje: Math.round((aciertos / e.preguntas.length) * 100),
      porArea: porArea,
      porNivel: porNivel,
      minutos: minutos
    };

    Estado.registrarExamen({
      fecha: new Date().toISOString(),
      preguntas: e.preguntas.length,
      aciertos: aciertos,
      minutos: minutos,
      area: e.cfg.area || null
    });

    UI.refrescar();
    window.scrollTo(0, 0);
  }

  function abandonar() {
    Crono.parar();
    e = null;
    UI.ir('inicio');
  }

  /* ------------------------------------------------------------
     RENDER
     ------------------------------------------------------------ */
  function cabecera() {
    var respondidas = e.preguntas.filter(function (p) { return p.respuesta !== null; }).length;
    return '<div class="sesion-cab">' +
      '<div><div class="sm tenue">Examen · ' + e.preguntas.length + ' preguntas</div>' +
      '<div style="font-weight:650">' + respondidas + ' respondidas</div></div>' +
      '<div class="pasos-sesion">' +
      e.preguntas.map(function (p, i) {
        return '<div class="paso-sesion ' +
          (p.respuesta !== null ? 'hecho' : '') + (i === e.indice ? ' actual' : '') + '"></div>';
      }).join('') +
      '</div>' +
      '<div class="cronometro" id="crono-examen">--:--</div>' +
      '<button class="btn btn-s btn-fantasma" data-accion="examen-abandonar">Salir</button>' +
      '</div>';
  }

  function renderPregunta() {
    var p = e.preguntas[e.indice];
    var nombresNivel = { 1: 'Conocimiento', 2: 'Integración', 3: 'Razonamiento clínico' };

    var html = cabecera();

    html += '<div class="tarjeta">' +
      '<div class="linea entre" style="margin-bottom:10px">' +
      '<span class="etiq">Pregunta ' + (e.indice + 1) + ' de ' + e.preguntas.length + '</span>' +
      '<span class="etiq etiq-info">' + nombresNivel[p.n] + '</span>' +
      '</div>' +
      '<div class="enunciado" style="font-size:1.06rem;font-weight:600;margin-bottom:16px">' + p.q + '</div>' +
      '<div class="alternativas">';

    p.opciones.forEach(function (o, i) {
      html += '<button class="alternativa' + (p.respuesta === i ? ' sel' : '') + '" ' +
        'data-accion="examen-responder" data-i="' + i + '">' +
        '<span class="letra">' + String.fromCharCode(65 + i) + '</span>' +
        '<span class="texto">' + UI.esc(o.t) + '</span></button>';
    });

    html += '</div>' +
      '<div class="linea entre mt">' +
      '<button class="btn btn-s btn-fantasma" data-accion="examen-marcar">' +
      (p.marcada ? '★ Marcada para revisar' : '☆ Marcar para revisar') + '</button>' +
      '<div class="linea">' +
      (e.indice > 0 ? '<button class="btn btn-s" data-accion="examen-ir" data-i="' + (e.indice - 1) + '">← Anterior</button>' : '') +
      (e.indice < e.preguntas.length - 1
        ? '<button class="btn btn-s btn-primario" data-accion="examen-ir" data-i="' + (e.indice + 1) + '">Siguiente →</button>'
        : '<button class="btn btn-s btn-acento" data-accion="examen-entregar">Entregar</button>') +
      '</div></div></div>';

    /* Mapa de navegación */
    html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Todas las preguntas</h3>' +
      '<div class="der"><button class="btn btn-s btn-acento" data-accion="examen-entregar">Entregar examen</button></div></div>' +
      '<div class="mapa-preguntas">' +
      e.preguntas.map(function (q, i) {
        var clase = 'casilla' + (q.respuesta !== null ? ' respondida' : '') +
          (q.marcada ? ' marcada' : '') + (i === e.indice ? ' actual' : '');
        return '<button class="' + clase + '" data-accion="examen-ir" data-i="' + i + '">' + (i + 1) + '</button>';
      }).join('') +
      '</div>' +
      '<p class="sm tenue mt mb0">Puedes volver atrás y cambiar respuestas antes de entregar. ' +
      'Las marcadas aparecen con borde para localizarlas rápido.</p>' +
      '</div>';

    return html;
  }

  function renderResultado() {
    var r = e.resultado;
    var aprobado = r.porcentaje >= 60;

    var html = '<div class="tarjeta centro">' +
      '<div style="font-size:2.6rem">' + (r.porcentaje >= 80 ? '🎯' : aprobado ? '✅' : '📌') + '</div>' +
      '<div class="metrica" style="align-items:center">' +
      '<span class="valor" style="font-size:3rem">' + r.porcentaje + '%</span>' +
      '<span class="nota">' + r.aciertos + ' de ' + r.total + ' correctas · ' + r.minutos + ' min' +
      (r.sinResponder ? ' · ' + r.sinResponder + ' sin responder' : '') + '</span></div>' +
      UI.barra(r.porcentaje, r.porcentaje >= 70 ? 'ok' : r.porcentaje >= 50 ? 'alerta' : 'acento') +
      '</div>';

    /* Desglose por nivel: dice QUÉ tipo de fallo tienes */
    html += '<div class="rejilla c3 mt">';
    var nombresNivel = { 1: 'Conocimiento', 2: 'Integración', 3: 'Razonamiento' };
    [1, 2, 3].forEach(function (n) {
      var d = r.porNivel[n];
      var pct = d.n ? Math.round((d.ok / d.n) * 100) : null;
      html += '<div class="tarjeta"><div class="metrica">' +
        '<span class="rotulo">' + nombresNivel[n] + '</span>' +
        '<span class="valor">' + (pct === null ? '—' : pct + '%') + '</span>' +
        '<span class="nota">' + d.ok + ' de ' + d.n + '</span>' +
        (pct === null ? '' : UI.barra(pct, pct >= 70 ? 'ok' : 'alerta')) +
        '</div></div>';
    });
    html += '</div>';

    /* Desglose por área */
    html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Por área</h3></div>';
    Object.keys(r.porArea).forEach(function (idArea) {
      var a = TUTOR.area(idArea);
      var d = r.porArea[idArea];
      var pct = Math.round((d.ok / d.n) * 100);
      html += '<div class="fila"><div style="font-size:1.15rem">' + (a ? a.icono : '📗') + '</div>' +
        '<div class="crece"><div class="titulo">' + UI.esc(a ? a.nombre : idArea) + '</div>' +
        UI.barra(pct, pct >= 70 ? 'ok' : 'alerta') + '</div>' +
        '<div class="sm tenue">' + d.ok + '/' + d.n + '</div></div>';
    });
    html += '</div>';

    /* Interpretación honesta del resultado */
    var lectura;
    var n3 = r.porNivel[3], n1 = r.porNivel[1];
    if (n3.n && n1.n && (n1.ok / n1.n) - (n3.ok / n3.n) > 0.3) {
      lectura = 'Tienes los datos pero fallas al aplicarlos: la diferencia entre nivel 1 y nivel 3 es grande. ' +
        'No necesitas releer, necesitas más casos clínicos.';
    } else if (n1.n && (n1.ok / n1.n) < 0.6) {
      lectura = 'Los fallos empiezan en el nivel básico, así que el problema no es de razonamiento sino de base. ' +
        'Vuelve a los temas con menor dominio en modo comprender.';
    } else if (r.porcentaje >= 80) {
      lectura = 'Resultado sólido y repartido. Este es el momento de subir el nivel de dificultad o de profundizar, ' +
        'no de repetir lo que ya dominas.';
    } else {
      lectura = 'Resultado intermedio: revisa abajo cada fallo con su explicación. ' +
        'Los temas fallados ya se han registrado como brechas y volverán a tu plan.';
    }
    html += '<div class="aviso mt"><b>Lectura del resultado.</b> ' + lectura + '</div>';

    /* Revisión pregunta a pregunta */
    html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Revisión</h3>' +
      '<div class="der sm tenue">Cada opción explica por qué</div></div></div>';

    e.preguntas.forEach(function (p, i) {
      var elegida = p.respuesta === null ? null : p.respuesta;
      html += '<div class="tarjeta revision ' + (p.correcta ? 'ok' : 'mal') + '">' +
        '<div class="linea entre" style="margin-bottom:8px">' +
        '<span class="etiq ' + (p.correcta ? 'etiq-ok' : 'etiq-acento') + '">' +
        (p.correcta ? '✓ Correcta' : elegida === null ? '— Sin responder' : '✗ Fallada') + '</span>' +
        '<span class="sm tenue">' + (i + 1) + ' · ' + UI.esc((TUTOR.tema(p.tema) || {}).nombre || '') + '</span>' +
        '</div>' +
        '<div class="enunciado" style="font-weight:600;margin-bottom:10px">' + p.q + '</div>';

      p.opciones.forEach(function (o, k) {
        var esCorrecta = o.ok === true;
        var esElegida = elegida === k;
        var clase = 'opcion-revision' + (esCorrecta ? ' correcta' : '') + (esElegida && !esCorrecta ? ' elegida' : '');
        html += '<div class="' + clase + '">' +
          '<div class="cab-op"><span class="letra">' + String.fromCharCode(65 + k) + '</span>' +
          '<span class="texto">' + UI.esc(o.t) + '</span>' +
          (esCorrecta ? '<span class="etiq etiq-ok">correcta</span>' : '') +
          (esElegida && !esCorrecta ? '<span class="etiq etiq-acento">tu respuesta</span>' : '') +
          '</div>' +
          '<div class="razon">' + UI.esc(o.r) + '</div></div>';
      });

      html += '<div class="linea fin mt">' +
        '<button class="btn btn-s btn-fantasma" data-accion="ver-tema" data-tema="' + p.tema + '">Ver el tema</button>' +
        '</div></div>';
    });

    html += '<div class="linea fin mt">' +
      '<button class="btn" data-accion="ir-inicio">Volver al inicio</button>' +
      '<button class="btn btn-primario" data-accion="navegar" data-ruta="preparar-examen">Otro examen</button>' +
      '</div>';

    return html;
  }

  function render() {
    if (!e) return '<div class="vacio">No hay examen activo.</div>';
    return e.entregado ? renderResultado() : renderPregunta();
  }

  return {
    iniciar: iniciar, render: render, entregar: entregar, abandonar: abandonar,
    responder: responder, marcar: marcar, ir: ir,
    activo: function () { return !!e; },
    datos: function () { return e; }
  };
})();

          '</div>';
      });

    }

    return html;
  }
});

/* ============================================================
   DIAPOSITIVAS — modo presentación de un tema
   ------------------------------------------------------------
   Construye la presentación a partir del mismo contenido que ya
   tiene el tema: no hay material duplicado que mantener.

   Sirve para tres cosas distintas: repasar en pantalla completa
   sin distracciones, proyectar el tema en una sesión clínica, y
   pasar el contenido en el móvil con el pulgar.
   ============================================================ */

var Diapositivas = (function () {
  var d = null;   // presentación activa

  /* ------------------------------------------------------------
     Construcción: cada pieza del tema es una diapositiva.
     ------------------------------------------------------------ */
  function construir(tema, soloEsenciales) {
    var s = [];

    s.push({
      tipo: 'portada',
      titulo: tema.nombre,
      cuerpo: '<p class="idea">' + tema.ideaCentral + '</p>',
      pie: (TUTOR.area(TUTOR.areaDeTema(tema.id)) || {}).nombre || ''
    });

    var bloques = tema.bloques.filter(function (b) {
      return soloEsenciales ? b.nivel === 'imprescindible' : true;
    });

    bloques.forEach(function (b) {
      s.push({
        tipo: 'bloque',
        etiqueta: TUTOR.NIVELES[b.nivel].nombre,
        titulo: b.titulo,
        cuerpo: (b.html || '') + UI.cadena(b.cadena) + UI.esquema(b.esquema)
      });
    });

    if (tema.variables && tema.variables.length) {
      s.push({
        tipo: 'variables',
        etiqueta: 'Variables clave',
        titulo: '¿Qué se mueve y en qué dirección?',
        cuerpo: UI.variables(tema.variables)
      });
    }

    if (!soloEsenciales) {
      if (tema.fisiopatologia) {
        s.push({ tipo: 'bloque', etiqueta: 'Fisiopatología', titulo: 'Cuando el sistema se altera', cuerpo: tema.fisiopatologia });
      }
      if (tema.clinica) {
        s.push({ tipo: 'bloque', etiqueta: 'Correlación clínica', titulo: 'Cómo se manifiesta', cuerpo: tema.clinica });
      }
    }

    if (tema.error) {
      s.push({
        tipo: 'error',
        etiqueta: 'Error frecuente',
        titulo: tema.error.confunde,
        cuerpo: '<p><b>Por qué se parecen:</b> ' + tema.error.parecido + '</p>' +
          '<p><b>La diferencia real:</b> ' + tema.error.diferencia + '</p>' +
          '<div class="regla">🧭 ' + tema.error.regla + '</div>'
      });
    }

    s.push({ tipo: 'perla', etiqueta: 'Perla de examen', titulo: '', cuerpo: tema.perla });

    /* Cierre útil: en qué se convierte esto al salir. */
    s.push({
      tipo: 'cierre',
      titulo: '¿Y ahora?',
      cuerpo: '<p>Las diapositivas son <b>reconocimiento</b>: pasarlas se siente fluido y por eso engaña. ' +
        'Lo que fija la memoria es <b>recuperar</b>.</p>' +
        '<p>Cierra esto y responde las preguntas del tema, o pasa sus tarjetas.</p>',
      tema: tema.id
    });

    return s;
  }

  function abrir(idTema, soloEsenciales) {
    var tema = TUTOR.tema(idTema);
    if (!tema) return;
    d = { tema: tema, slides: construir(tema, soloEsenciales), i: 0, esenciales: !!soloEsenciales };
    pintar();
    document.addEventListener('keydown', teclado);
  }

  function cerrar() {
    d = null;
    document.removeEventListener('keydown', teclado);
    var el = UI.$('#presentacion');
    if (el) el.remove();
  }

  function mover(delta) {
    if (!d) return;
    var nuevo = d.i + delta;
    if (nuevo < 0 || nuevo >= d.slides.length) return;
    d.i = nuevo;
    pintar();
  }

  function irA(indice) {
    if (!d) return;
    d.i = Math.max(0, Math.min(d.slides.length - 1, indice));
    pintar();
  }

  function teclado(ev) {
    if (!d) return;
    if (ev.key === 'ArrowRight' || ev.key === ' ' || ev.key === 'PageDown') { ev.preventDefault(); mover(1); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); mover(-1); }
    else if (ev.key === 'Escape') { ev.preventDefault(); cerrar(); }
    else if (ev.key === 'Home') { ev.preventDefault(); irA(0); }
    else if (ev.key === 'End') { ev.preventDefault(); irA(d.slides.length - 1); }
  }

  function pintar() {
    var s = d.slides[d.i];
    var progreso = ((d.i + 1) / d.slides.length) * 100;

    var html =
      '<div class="pres-barra"><i style="width:' + progreso + '%"></i></div>' +

      '<div class="pres-sup">' +
      '<span class="sm tenue">' + UI.esc(d.tema.nombre) + '</span>' +
      '<span class="crece"></span>' +
      '<span class="sm tenue">' + (d.i + 1) + ' / ' + d.slides.length + '</span>' +
      '<button class="btn btn-s btn-fantasma" data-accion="pres-cerrar" aria-label="Cerrar presentación">✕ Salir</button>' +
      '</div>' +

      '<div class="pres-cuerpo slide-' + s.tipo + '">' +
      '<div class="pres-caja">' +
      (s.etiqueta ? '<div class="pres-etiqueta">' + UI.esc(s.etiqueta) + '</div>' : '') +
      (s.titulo ? '<h2>' + UI.esc(s.titulo) + '</h2>' : '') +
      '<div class="doc">' + s.cuerpo + '</div>' +
      (s.tipo === 'cierre'
        ? '<div class="linea mt">' +
          '<button class="btn btn-primario" data-accion="pres-estudiar" data-tema="' + s.tema + '">Ir a las preguntas</button>' +
          '<button class="btn" data-accion="pres-tarjetas" data-tema="' + s.tema + '">Pasar sus tarjetas</button>' +
          '</div>'
        : '') +
      '</div></div>' +

      '<div class="pres-inf">' +
      '<button class="btn btn-s" data-accion="pres-mover" data-d="-1"' + (d.i === 0 ? ' disabled' : '') + '>← Anterior</button>' +
      '<div class="pres-puntos">' +
      d.slides.map(function (_, k) {
        return '<button class="punto' + (k === d.i ? ' actual' : '') + '" data-accion="pres-ir" data-i="' + k + '" ' +
          'aria-label="Diapositiva ' + (k + 1) + '"></button>';
      }).join('') +
      '</div>' +
      '<button class="btn btn-s btn-primario" data-accion="pres-mover" data-d="1"' +
      (d.i === d.slides.length - 1 ? ' disabled' : '') + '>Siguiente →</button>' +
      '</div>' +

      '<div class="pres-ayuda sm tenue">← → para navegar · Esc para salir</div>';

    var el = UI.$('#presentacion');
    if (!el) {
      el = document.createElement('div');
      el.id = 'presentacion';
      el.className = 'presentacion';
      document.body.appendChild(el);
    }
    el.innerHTML = html;
    var cuerpo = UI.$('.pres-cuerpo');
    if (cuerpo) cuerpo.scrollTop = 0;
  }

  return {
    abrir: abrir, cerrar: cerrar, mover: mover, irA: irA,
    activa: function () { return !!d; },
    datos: function () { return d; }
  };
})();


/* ============================================================
   BIBLIOTECA Y NOTAS — la parte de «segundo cerebro»
   ------------------------------------------------------------
   Dos piezas complementarias al resto de la app:

   · BIBLIOTECA: las fuentes que usas de verdad (papers, guías,
     apuntes, capítulos), enlazadas a los temas que las citan.
     No almacena archivos —no cabrían— sino referencias con su
     enlace, de modo que sepas siempre de dónde salió algo.

   · NOTAS: notas atómicas enlazadas entre sí con [[dobles
     corchetes]], al estilo Zettelkasten. Una nota = una idea.
     La estructura emerge de los enlaces, no de una jerarquía.

   Por qué conviven con el temario jerárquico: el temario sirve
   para NO OLVIDAR lo que ya entendiste; las notas sirven para
   PENSAR y conectar entre áreas. Son objetivos distintos y por
   eso son herramientas distintas.
   ============================================================ */

var Notas = (function () {

  function idNuevo(prefijo) {
    return prefijo + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function normalizar(t) {
    return String(t || '').trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  /* ------------------------------------------------------------
     Enlaces [[así]]: el mecanismo que hace emerger la estructura.
     ------------------------------------------------------------ */
  function extraerEnlaces(cuerpo) {
    var salida = [];
    var re = /\[\[([^\]]+)\]\]/g;
    var m;
    while ((m = re.exec(String(cuerpo || ''))) !== null) {
      var t = m[1].trim();
      if (t && salida.indexOf(t) < 0) salida.push(t);
    }
    return salida;
  }

  /* ------------------------------------------------------------
     ÍNDICE DE ENLACES
     ------------------------------------------------------------
     Sin él, cada [[enlace]] recorría la lista entera de notas para
     resolver su destino, y como el cuerpo se renderiza una vez por
     nota, el coste crecía con el cuadrado del número de notas: con
     150 notas la vista tardaba 29 ms y a las 500 habría pasado de
     300 ms, que ya se nota al escribir.

     El índice se construye una vez y se reutiliza mientras las
     notas no cambien. La invalidación mira dos cosas: la identidad
     del array (cambia al cargar el estado guardado) y el contador
     de revisión (cambia al editar en el sitio, donde la identidad
     no basta). Con ambas, ni se sirve un índice viejo ni se
     reconstruye de más.
     ------------------------------------------------------------ */
  var cache = null, cacheRef = null, cacheRev = -1;

  function indice() {
    var lista = Estado.notas();
    var rev = Estado.revision ? Estado.revision() : 0;
    if (cache && cacheRef === lista && cacheRev === rev) return cache;

    var porTit = {};      /* título normalizado -> nota            */
    var entrantes = {};   /* título normalizado -> notas que la citan */
    var salientes = {};   /* id de nota -> nº de enlaces que emite  */

    lista.forEach(function (n) {
      var clave = normalizar(n.titulo);
      /* Ante títulos repetidos gana el primero, igual que antes. */
      if (!(clave in porTit)) porTit[clave] = n;
    });

    lista.forEach(function (n) {
      var enlaces = extraerEnlaces(n.cuerpo);
      salientes[n.id] = enlaces.length;
      enlaces.forEach(function (t) {
        var clave = normalizar(t);
        (entrantes[clave] || (entrantes[clave] = [])).push(n);
      });
    });

    cache = { porTit: porTit, entrantes: entrantes, salientes: salientes };
    cacheRef = lista;
    cacheRev = rev;
    return cache;
  }

  function porTitulo(titulo) {
    var t = indice().porTit[normalizar(titulo)];
    return t || null;
  }

  /* Renderiza el cuerpo convirtiendo [[enlaces]] en botones.
     Los que no existen todavía aparecen punteados y ofrecen
     crearlos: escribir el enlace antes que la nota es
     precisamente cómo crece un Zettelkasten. */
  function render(cuerpo) {
    var texto = UI.esc(cuerpo || '');
    texto = texto.replace(/\[\[([^\]]+)\]\]/g, function (_, titulo) {
      var t = titulo.trim();
      var destino = porTitulo(t);
      if (destino) {
        return '<button class="enlace-nota" data-accion="nota-abrir" data-id="' + destino.id + '">' +
          UI.esc(t) + '</button>';
      }
      return '<button class="enlace-nota vacio" data-accion="nota-crear-desde" data-titulo="' +
        UI.esc(t) + '">' + UI.esc(t) + ' +</button>';
    });
    return texto.replace(/\n/g, '<br>');
  }

  /* Notas que enlazan a una dada: el valor real del sistema no
     está en los enlaces que pones, sino en los que descubres. */
  function retroenlaces(nota) {
    var lista = indice().entrantes[normalizar(nota.titulo)] || [];
    /* Una nota que se cita a sí misma no se cuenta como retroenlace. */
    return lista.filter(function (x) { return x.id !== nota.id; });
  }

  function huerfanas() {
    var ix = indice();
    return Estado.notas().filter(function (n) {
      if (ix.salientes[n.id]) return false;
      return retroenlaces(n).length === 0;
    });
  }

  function buscar(termino) {
    var q = normalizar(termino);
    if (!q) return Estado.notas();
    return Estado.notas().filter(function (n) {
      return normalizar(n.titulo).indexOf(q) >= 0 || normalizar(n.cuerpo).indexOf(q) >= 0;
    });
  }

  function deTema(idTema) {
    return Estado.notas().filter(function (n) {
      return (n.temas || []).indexOf(idTema) >= 0;
    });
  }

  return {
    idNuevo: idNuevo, extraerEnlaces: extraerEnlaces, porTitulo: porTitulo,
    render: render, retroenlaces: retroenlaces, huerfanas: huerfanas,
    buscar: buscar, deTema: deTema, normalizar: normalizar
  };
})();

/* ============================================================
   BASE DE DATOS EN SHEETS — lado cliente
   ------------------------------------------------------------
   El servidor no conoce el temario: los temas viven en este
   paquete, no en Apps Script. Así que las filas se arman aquí y
   se mandan por secciones.

   Qué va a cada sitio, y por qué:

   · CONTENIDO (áreas, módulos, temas, tarjetas, alternativas,
     notas, fuentes) va desglosado en columnas cuando es
     realmente tabular, y en una celda JSON cuando no lo es. Un
     tema tiene bloques con HTML, un caso clínico con pasos y un
     ejercicio Feynman: aplanar eso en columnas sería inventarse
     una estructura relacional que no existe y perder información
     al volver. Lo tabular se edita cómodo; lo anidado viaja
     entero en «detalle_json».

   · HISTÓRICO (progreso, repaso, sesiones, exámenes, brechas) va
     en columnas y con los números como números, porque el motivo
     de tenerlo en Sheets es poder graficarlo.
   ============================================================ */

var BD = (function () {

  function texto(v) {
    if (v === undefined || v === null) return '';
    return String(v);
  }

  function numero(v) {
    var n = Number(v);
    return isFinite(n) ? n : 0;
  }

  /* Un año que no lo es se deja en blanco, no en cero: un 0 en la
     columna ordenaría por delante de 1950 y mentiría al consultar. */
  function anioValido(v) {
    var n = parseInt(v, 10);
    return (isFinite(n) && n > 1000 && n < 3000) ? n : '';
  }

  function lista(v) {
    return Array.isArray(v) ? v.join(', ') : texto(v);
  }

  /* Lo que NO cabe en columnas viaja aquí. Se excluyen los
     campos que ya tienen columna propia para no duplicarlos. */
  var YA_EN_COLUMNAS = ['id', 'modulo', 'nombre', 'alto', 'minutos',
    'ideaCentral', 'perla', 'fuentes', 'propio', 'verificado', 'tarjetas', 'mcq'];

  function detalleDeTema(t) {
    var resto = {};
    Object.keys(t).forEach(function (k) {
      if (YA_EN_COLUMNAS.indexOf(k) < 0) resto[k] = t[k];
    });
    return JSON.stringify(resto);
  }

  /* ------------------------------------------------------------
     Constructores de filas, uno por sección
     ------------------------------------------------------------ */
  var CONSTRUCTORES = {

    Areas: function () {
      return TUTOR.AREAS.map(function (a) {
        return [a.id, a.nombre, a.icono, a.resumen, texto(a.lema),
          a.propio ? 'propio' : 'de fábrica'];
      });
    },

    Modulos: function () {
      return TUTOR.MODULOS.map(function (m) {
        return [m.id, m.area, m.nombre, texto(m.icono), texto(m.resumen),
          m.propio ? 'propio' : 'de fábrica'];
      });
    },

    Temas: function () {
      return TUTOR.TEMAS.map(function (t) {
        return [t.id, t.modulo, texto(TUTOR.areaDeTema(t.id)), t.nombre,
          t.alto ? 'sí' : 'no', numero(t.minutos), texto(t.ideaCentral),
          texto(t.perla), texto(t.fuentes),
          t.propio ? 'propio' : 'de fábrica',
          t.propio ? (t.verificado ? 'sí' : 'no') : '—',
          detalleDeTema(t)];
      });
    },

    Tarjetas: function () {
      var filas = [];
      TUTOR.TEMAS.forEach(function (t) {
        (t.tarjetas || []).forEach(function (c, i) {
          filas.push([t.id, i, texto(c.f), texto(c.d)]);
        });
      });
      return filas;
    },

    /* Una fila por OPCIÓN, no por pregunta. Es lo que permite
       corregir un distractor concreto desde la hoja, que es
       justo para lo que sirve tenerlo aquí. */
    Alternativas: function () {
      var filas = [];
      TUTOR.TEMAS.forEach(function (t) {
        TUTOR.mcqDe(t.id).forEach(function (q) {
          (q.o || []).forEach(function (op) {
            filas.push([t.id, numero(q.n), texto(q.q), texto(op.t),
              op.ok ? 'sí' : '', texto(op.r)]);
          });
        });
      });
      return filas;
    },

    Notas: function () {
      return Estado.notas().map(function (n) {
        return [n.id, texto(n.titulo), lista(n.temas), texto(n.creado),
          texto(n.modificado), texto(n.cuerpo)];
      });
    },

    Fuentes: function () {
      return Estado.fuentes().map(function (f) {
        return [f.id, texto(f.titulo), texto(f.autor), anioValido(f.anio),
          texto(f.tipo), texto(f.enlace), lista(f.temas)];
      });
    },

    Progreso: function () {
      var temas = Estado.datos().temas || {};
      return Object.keys(temas).map(function (id) {
        var p = temas[id];
        return [id, numero(p.dominio), numero(p.vistas), numero(p.minutos),
          numero(p.aciertos), numero(p.intentos), texto(p.ultimo)];
      });
    },

    Repaso: function () {
      var tarjetas = Estado.datos().tarjetas || {};
      return Object.keys(tarjetas).map(function (clave) {
        var r = tarjetas[clave];
        var corte = clave.lastIndexOf('::');
        return [
          corte >= 0 ? clave.slice(0, corte) : clave,
          numero(corte >= 0 ? clave.slice(corte + 2) : 0),
          numero(r.facilidad), numero(r.intervalo),
          numero(r.repeticiones), numero(r.lapsos), texto(r.vence)
        ];
      });
    },

    Sesiones: function () {
      return (Estado.datos().sesiones || []).map(function (s) {
        return [texto(s.fecha), texto(s.tema), texto(s.modo), numero(s.minutos),
          numero(s.aciertos), numero(s.total), numero(s.porcentaje)];
      });
    },

    Examenes: function () {
      return (Estado.datos().examenes || []).map(function (e) {
        return [texto(e.fecha), numero(e.porcentaje), numero(e.preguntas),
          numero(e.minutos), JSON.stringify({ porArea: e.porArea, porNivel: e.porNivel })];
      });
    },

    Brechas: function () {
      return (Estado.datos().brechas || []).map(function (b) {
        return [texto(b.fecha), texto(b.tema), texto(b.texto)];
      });
    }
  };

  var SECCIONES = ['Areas', 'Modulos', 'Temas', 'Tarjetas', 'Alternativas',
    'Notas', 'Fuentes', 'Progreso', 'Repaso', 'Sesiones', 'Examenes', 'Brechas'];

  function filasDe(seccion) {
    var f = CONSTRUCTORES[seccion];
    return f ? f() : [];
  }

  /**
   * Vuelca todo, sección a sección, avisando del avance.
   * Secuencial a propósito: en paralelo las llamadas competirían
   * por el mismo libro y Sheets serializa igualmente.
   */
  function volcar(alAvanzar) {
    var resumen = { secciones: 0, filas: 0, recortados: [], errores: [] };

    function paso(i) {
      if (i >= SECCIONES.length) {
        return Puente.bdFinalizar({
          temas: TUTOR.TEMAS.length,
          tarjetas: TUTOR.todasLasTarjetas().length,
          alternativas: TUTOR.totalMcq(),
          filasTotales: resumen.filas
        }).then(function (r) {
          resumen.ok = !resumen.errores.length && r.ok;
          resumen.url = r.url;
          if (!r.ok && r.error) resumen.errores.push(r.error);
          return resumen;
        });
      }

      var seccion = SECCIONES[i];
      if (alAvanzar) alAvanzar(seccion, i, SECCIONES.length);

      var filas;
      try {
        filas = filasDe(seccion);
      } catch (e) {
        resumen.errores.push(seccion + ': no se pudieron armar las filas (' + e.message + ')');
        return paso(i + 1);
      }

      return Puente.bdVolcar(seccion, filas).then(function (r) {
        if (!r.ok) resumen.errores.push(r.error);
        else {
          resumen.secciones += 1;
          resumen.filas += r.filas;
          if (r.recortados && r.recortados.length) {
            resumen.recortados = resumen.recortados.concat(r.recortados);
          }
        }
        return paso(i + 1);
      });
    }

    return paso(0);
  }

  return {
    SECCIONES: SECCIONES,
    filasDe: filasDe,
    volcar: volcar
  };
})();


/* ============================================================
   TARJETAS — repaso con recuperación activa y repetición espaciada
   Algoritmo SM-2 adaptado (ver Estado.calificarTarjeta)
   ============================================================ */

var Mazo = (function () {
  var cola = [];
  var actual = null;
  var revelada = false;
  var sesion = { revisadas: 0, aciertos: 0, inicio: null, filtroTema: null };

  function cargar(idTema) {
    cola = idTema ? Estado.tarjetasDeTema(idTema) : Estado.tarjetasVencidas();
    // barajar para evitar el aprendizaje por orden
    for (var i = cola.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = cola[i]; cola[i] = cola[j]; cola[j] = tmp;
    }
    sesion = { revisadas: 0, aciertos: 0, inicio: Date.now(), filtroTema: idTema || null };
    siguiente();
  }

  function siguiente() {
    actual = cola.shift() || null;
    revelada = false;
  }

  function revelar() { revelada = true; UI.refrescar(); }

  function calificar(grado) {
    if (!actual) return;
    var e = Estado.calificarTarjeta(actual.id, grado);
    sesion.revisadas += 1;
    if (grado >= 3) sesion.aciertos += 1;
    if (grado === 1) cola.push(actual);       // vuelve al final de la cola de hoy
    siguiente();
    UI.refrescar();
    window.scrollTo(0, 0);
  }

  function intervaloTexto(grado) {
    if (!actual) return '';
    var e = Estado.tarjeta(actual.id);
    var s = TUTOR.SRS;
    if (grado === 1) return 'hoy';
    var reps = e.repeticiones + 1;
    var intervalo;
    if (reps === 1) intervalo = s.primerIntervalo;
    else if (reps === 2) intervalo = s.segundoIntervalo;
    else {
      var mult = grado === 2 ? s.multiplicadorDificil : grado === 4 ? e.facilidad * s.multiplicadorFacil : e.facilidad;
      intervalo = Math.round(e.intervalo * mult);
    }
    intervalo = Math.min(s.intervaloMaximo, Math.max(1, intervalo));
    if (intervalo === 1) return 'mañana';
    if (intervalo < 30) return intervalo + ' días';
    return Math.round(intervalo / 30) + ' meses';
  }

  return {
    cargar: cargar,
    revelar: revelar,
    calificar: calificar,
    actual: function () { return actual; },
    revelada: function () { return revelada; },
    restantes: function () { return cola.length; },
    sesion: function () { return sesion; },
    intervaloTexto: intervaloTexto
  };
})();

    L.push('Modo POCO TIEMPO. Divide el contenido en IMPRESCINDIBLE / IMPORTANTE / COMPLEMENTARIO y cubre solo lo imprescindible salvo que sobre tiempo. No gastes tiempo en detalles de bajo rendimiento ni en conversación innecesaria.');

  }
  L.push('');

  L.push('No seas un libro de texto que habla: hazme razonar.');
  L.push('- Si puedo deducir una respuesta a partir de un principio fisiológico, guíame a deducirla en lugar de dármela.');

}

/* Si se quita el temario de fábrica, las áreas activas guardadas
   apuntarían a áreas que ya no existen y la app se vería vacía
   sin explicar por qué. Y al revés: al devolverlo, las áreas
   recuperadas deben entrar activas o seguirían sin aparecer. */
function sincronizarAreasActivas(activarTodas) {
  var existentes = TUTOR.AREAS.map(function (a) { return a.id; });
  var activas = activarTodas ? existentes.slice() : Estado.areasActivas().filter(function (id) {
    return existentes.indexOf(id) >= 0;
  });
  if (!activas.length) activas = existentes.slice();
  Estado.guardarAjustes({ areasActivas: activas });
}

/* El plan guarda identificadores de tema. Al cambiar el temario
   hay que rehacerlo, o quedarían bloques apuntando a temas que
   ya no existen: huecos silenciosos en la semana. */
function rehacerPlanTrasCambioDeTemario() {
  if (TUTOR.TEMAS.length) Estado.generarPlan(14);
  else Estado.guardarAjustes({});   // solo persistir
}

UI.accion('temario-base', function (d) {
  var quitar = d.valor === '0';
  if (!quitar) {
    TUTOR.restaurarBase();
    Estado.guardarAjustes({ temarioBase: true });
    /* Al devolver el temario, sus áreas entran activas: si no,
       volverían pausadas y parecería que no ha vuelto nada. */
    sincronizarAreasActivas(true);
    rehacerPlanTrasCambioDeTemario();
    UI.refrescar();
    UI.brindis('Temario de fisiología devuelto');
    return;
  }

  UI.modal('<h3>Quitar el temario de fisiología</h3>' +
    '<p>Desaparecerán las 5 áreas de fábrica, sus 32 temas, sus 252 tarjetas y sus 63 ' +
    'preguntas. La app queda vacía y lista para la materia que quieras.</p>' +
    '<p class="sm tenue">No se borra nada del código: es reversible desde este mismo sitio. ' +
    'Tu progreso sobre esos temas se conserva por si los devuelves, y tu contenido propio ' +
    'no se toca.</p>' +
    '<div class="linea fin mt"><button class="btn btn-fantasma" data-accion="cerrar-modal">Cancelar</button>' +
    '<button class="btn btn-acento" data-accion="confirmar-quitar-base">Quitar el temario</button></div>');
});

  UI.ir('temario');
  UI.brindis(TUTOR.TEMAS.length

UI.accion('gemini-guardar', function () {
  var clave = (UI.$('#a-gemini-clave') || {}).value || '';
  var modelo = (UI.$('#a-gemini-modelo') || {}).value || '';
  if (!clave.trim()) { UI.brindis('Pega primero la clave'); return; }

  var caja = UI.$('#a-gemini-estado');
  if (caja) caja.innerHTML = '<div class="sm tenue mt">Guardando y probando…</div>';

  Puente.guardarClave(clave.trim(), modelo.trim()).then(function (r) {
    if (!r.ok) {
      if (caja) caja.innerHTML = '<div class="aviso aviso-acento mt">' + UI.esc(r.error) + '</div>';
      return;
    }
    /* Guardar sin probar dejaría el fallo para el peor momento:
       cuando esté esperando un módulo generado. */
    return Puente.probarClave().then(function (p) {
      var el = UI.$('#a-gemini-estado');
      if (!el) return;
      if (!p.ok) {
        el.innerHTML = '<div class="aviso aviso-acento mt"><b>Guardada, pero no funciona.</b> ' +
          UI.esc(p.error) + '</div>';
        UI.brindis('La clave no responde');
        return;
      }
      el.innerHTML = '<div class="aviso aviso-ok mt"><b>Clave verificada.</b> ' +
        p.modelos + ' modelos disponibles.</div>';
      var campo = UI.$('#a-gemini-clave');
      if (campo) campo.value = '';
      UI.brindis('Clave verificada');
    });
  });
});

function copiarTexto(texto) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto);
      return;
    }
  } catch (e) { /* se usa el método alternativo */ }
  var ta = document.createElement('textarea');
  ta.value = texto;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { }
  ta.remove();
}

function pintarValidacion(r) {
  var html = '';

  if (r.errores.length) {
    html += '<div class="aviso aviso-acento mt"><b>No se puede importar todavía.</b> ' +
      'Corrige esto y vuelve a pedirle la respuesta al modelo, o edita el JSON a mano:' +
      '<ul style="margin:8px 0 0;padding-left:18px">' +
      r.errores.map(function (e) { return '<li>' + UI.esc(e) + '</li>'; }).join('') +
      '</ul></div>';
  }

  if (r.avisos.length) {
    html += '<div class="aviso aviso-alerta mt"><b>Avisos</b> (no impiden importar):' +
      '<ul style="margin:8px 0 0;padding-left:18px">' +
      r.avisos.map(function (a) { return '<li>' + UI.esc(a) + '</li>'; }).join('') +
      '</ul></div>';
  }

  if (!r.ok) return html;

  /* Vista previa */
  var p = r.paquete;
  html += '<div class="aviso aviso-ok mt"><b>Estructura correcta.</b> Revisa la vista previa antes de importar.</div>';

  html += '<div class="previa mt">';
  if (p.area) {
    html += '<div class="fila"><div style="font-size:1.3rem">' + p.area.icono + '</div>' +
      '<div class="crece"><div class="titulo">Área nueva: ' + UI.esc(p.area.nombre) + '</div>' +
      '<div class="sub">' + UI.esc(p.area.resumen) + '</div></div></div>';
  } else {
    var ae = TUTOR.area(p.areaId);
    html += '<div class="fila"><div class="crece"><div class="titulo">Se añade al área ' +
      (ae ? ae.icono + ' ' + UI.esc(ae.nombre) : UI.esc(p.areaId)) + '</div></div></div>';
  }
  if (p.modulo) {
    html += '<div class="fila"><div class="crece"><div class="titulo">Módulo nuevo: ' +
      UI.esc(p.modulo.nombre) + '</div></div></div>';
  }

  p.temas.forEach(function (t) {
    html += '<div class="fila"><div class="crece">' +
      '<div class="titulo">' + UI.esc(t.nombre) + (t.alto ? ' <span class="etiq etiq-fuego">🔥</span>' : '') + '</div>' +
      '<div class="sub">' + t.bloques.length + ' bloques · ' + t.preguntas.length + ' preguntas · ' +
      t.caso.pasos.length + ' pasos de caso · ' + t.tarjetas.length + ' tarjetas' +
      (t.mcq && t.mcq.length ? ' · ' + t.mcq.length + ' de alternativa' : '') +
      ' · ' + t.minutos + ' min</div>' +
      (t.fuentes ? '<div class="sub">Fuentes: ' + UI.esc(t.fuentes) + '</div>' : '') +
      '</div></div>';
    html += '<div class="previa-idea">' + UI.esc(t.ideaCentral) + '</div>';
  });
  html += '</div>';

  html += '<div class="linea fin mt">' +
    '<button class="btn btn-primario btn-g" data-accion="taller-importar">Importar al temario</button></div>';

  return html;
}

  UI.modal('<h3>Progreso exportado</h3>' +

});

UI.accion('importar', function () {
  UI.modal('<h3>Importar progreso</h3>' +
    '<p class="sm tenue">Pega aquí el JSON exportado previamente. Se sustituirá todo tu progreso actual.</p>' +
    '<textarea id="json-importar" style="min-height:200px;font-family:var(--mono);font-size:.75rem" placeholder="{ … }"></textarea>' +

  UI.cerrarModal();
  UI.aplicarTema(Estado.ajustes().tema);

});

UI.accion('cerrar-modal', function () { UI.cerrarModal(); });

/* ------------------------------------------------------------
   Feynman: registrar brechas al avanzar de fase
   ------------------------------------------------------------ */
(function interceptarFeynman() {
  var avanzarOriginal = Sesion.avanzar;
  Sesion.avanzar = function () {
    if (Sesion.activa()) {
      var s = Sesion.datos();
      if (s.fases[s.indice].id === 'feynman') {
        var casillas = UI.$$('.chk-feynman');
        if (casillas.length) {
          var noMarcados = [];
          casillas.forEach(function (c) {
            if (!c.checked) noMarcados.push(parseInt(c.dataset.i, 10));
          });
          Sesion.registrarBrechasFeynman(noMarcados);
          if (noMarcados.length) {
            UI.brindis(noMarcados.length + ' brecha(s) registrada(s) para tu próximo repaso');
          }
        }
      }
    }
    avanzarOriginal();
  };
})();

/* ------------------------------------------------------------
   ARRANQUE
   ------------------------------------------------------------ */
function arrancar() {
  Estado.iniciar().then(function () {
    UI.aplicarTema(Estado.ajustes().tema);
    /* Se guarda copia del temario de fábrica ANTES de incorporar
       lo propio, para poder distinguir uno de otro después. */
    TUTOR.congelarBase();
    /* El contenido creado en el Taller vive en el estado guardado:
       se reincorpora al temario antes de pintar nada. */
    Taller.registrarGuardado();
    if (Estado.ajustes().temarioBase === false) TUTOR.quitarBase();
    sincronizarAreasActivas();
    pintarNavegacion();

    // Genera un plan inicial la primera vez.
    if (!Object.keys(Estado.plan()).length) Estado.generarPlan(14);

    UI.ir('inicio');
    UI.actualizarGlobos();
    Minerva.pintarBoton();
    Estado.suscribir(function () {
      UI.actualizarGlobos();
      Minerva.pintarBoton();
    });
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', arrancar);
} else {
  arrancar();
}

</script>
