<script>
/* ============================================================
   ALMACÉN — capa de persistencia intercambiable
   ------------------------------------------------------------
   ÚNICO punto del código que toca el almacenamiento.
   - En navegador (mockup): localStorage.
   - En Apps Script: google.script.run → PropertiesService.
   Toda la API es asíncrona (promesas) para que la migración
   no exija cambiar ninguna vista.
   ============================================================ */

var Almacen = (function () {
  var CLAVE = 'tutor-mit-cardio-v1';

  var enAppsScript = (typeof google !== 'undefined' &&
    typeof google.script !== 'undefined' &&
    typeof google.script.run !== 'undefined');

  function estadoInicial() {
    return {
      version: 1,
      creado: new Date().toISOString(),
      ajustes: JSON.parse(JSON.stringify(TUTOR.AJUSTES_DEFECTO)),
      temas: {},
      tarjetas: {},
      sesiones: [],
      plan: {},
      brechas: [],
      racha: { ultimoDia: null, dias: 0, mejor: 0 }
    };
  }

  function fusionar(guardado) {
    var base = estadoInicial();
    if (!guardado) return base;
    Object.keys(base).forEach(function (k) {
      if (guardado[k] === undefined) guardado[k] = base[k];
    });
    Object.keys(base.ajustes).forEach(function (k) {
      if (guardado.ajustes[k] === undefined) guardado.ajustes[k] = base.ajustes[k];
    });
    return guardado;
  }

  function leerLocal() {
    try {
      var crudo = window.localStorage.getItem(CLAVE);
      return crudo ? JSON.parse(crudo) : null;
    } catch (e) {
      return null;
    }
  }

  function escribirLocal(estado) {
    try {
      window.localStorage.setItem(CLAVE, JSON.stringify(estado));
      return true;
    } catch (e) {
      return false;
    }
  }

  return {
    modo: enAppsScript ? 'appsscript' : 'local',

    /* Devuelve una promesa con el estado completo. */
    cargar: function () {
      return new Promise(function (resolver) {
        if (enAppsScript) {
          google.script.run
            .withSuccessHandler(function (json) {
              resolver(fusionar(json ? JSON.parse(json) : null));
            })
            .withFailureHandler(function () { resolver(estadoInicial()); })
            .leerEstado();
        } else {
          resolver(fusionar(leerLocal()));
        }
      });
    },

    /* Persiste el estado. Devuelve promesa. */
    guardar: function (estado) {
      return new Promise(function (resolver) {
        if (enAppsScript) {
          google.script.run
            .withSuccessHandler(function () { resolver(true); })
            .withFailureHandler(function () { resolver(false); })
            .guardarEstado(JSON.stringify(estado));
        } else {
          resolver(escribirLocal(estado));
        }
      });
    },

    reiniciar: function () {
      return this.guardar(estadoInicial());
    },

    inicial: estadoInicial
  };
})();


/* ============================================================
   ESTADO — modelo en memoria y reglas de negocio
   ============================================================ */

var Estado = (function () {
  var d = null;                 // datos
  var oyentes = [];
  var guardadoPendiente = null;

  function hoyISO(desplazamiento) {
    var f = new Date();
    if (desplazamiento) f.setDate(f.getDate() + desplazamiento);
    return f.toISOString().slice(0, 10);
  }

  function diasEntre(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }

  function notificar() {
    oyentes.forEach(function (fn) { fn(d); });
  }

  /* Guardado diferido para no escribir en cada tecla. */
  function persistir() {
    if (guardadoPendiente) clearTimeout(guardadoPendiente);
    guardadoPendiente = setTimeout(function () {
      Almacen.guardar(d);
    }, 400);
  }

  function temaEstado(id) {
    if (!d.temas[id]) {
      d.temas[id] = {
        dominio: 0, vistas: 0, minutos: 0, ultimo: null,
        aciertos: 0, intentos: 0, feynman: 0, casos: 0
      };
    }
    return d.temas[id];
  }

  function tarjetaEstado(id) {
    if (!d.tarjetas[id]) {
      d.tarjetas[id] = {
        facilidad: TUTOR.SRS.facilidadInicial,
        intervalo: 0,
        repeticiones: 0,
        lapsos: 0,
        vence: hoyISO(),
        ultimo: null,
        nueva: true
      };
    }
    return d.tarjetas[id];
  }

  return {
    /* ---------- ciclo de vida ---------- */
    iniciar: function () {
      return Almacen.cargar().then(function (cargado) {
        d = cargado;
        Estado.registrarDia();
        return d;
      });
    },

    datos: function () { return d; },
    ajustes: function () { return d.ajustes; },
    suscribir: function (fn) { oyentes.push(fn); },
    guardar: persistir,

    guardarAjustes: function (parciales) {
      Object.keys(parciales).forEach(function (k) { d.ajustes[k] = parciales[k]; });
      persistir();
      notificar();
    },

    /* ---------- racha ---------- */
    registrarDia: function () {
      var hoy = hoyISO();
      var r = d.racha;
      if (r.ultimoDia === hoy) return;
      if (r.ultimoDia === hoyISO(-1)) r.dias += 1;
      else if (r.ultimoDia !== null) r.dias = 1;
      else r.dias = 1;
      r.ultimoDia = hoy;
      if (r.dias > (r.mejor || 0)) r.mejor = r.dias;
      persistir();
    },

    /* ---------- temas ---------- */
    tema: temaEstado,

    dominio: function (id) {
      return d.temas[id] ? Math.round(d.temas[id].dominio) : 0;
    },

    /* El dominio combina precisión en preguntas, exposición y
       frescura: decae con el tiempo si no se repasa. */
    recalcularDominio: function (id) {
      var t = temaEstado(id);
      var precision = t.intentos > 0 ? (t.aciertos / t.intentos) : 0;
      var exposicion = Math.min(1, t.vistas / 3);
      var profundidad = Math.min(1, (t.feynman * 0.6 + t.casos * 0.4) / 2);
      var bruto = (precision * 55) + (exposicion * 25) + (profundidad * 20);

      // Decaimiento por olvido: −1,5 puntos por día sin repasar (tope 30).
      if (t.ultimo) {
        var dias = diasEntre(t.ultimo, hoyISO());
        bruto -= Math.min(30, Math.max(0, dias - 2) * 1.5);
      }
      t.dominio = Math.max(0, Math.min(100, bruto));
      return t.dominio;
    },

    dominioModulo: function (idModulo) {
      var temas = TUTOR.temasDe(idModulo);
      if (!temas.length) return 0;
      var suma = 0;
      temas.forEach(function (t) { suma += Estado.dominio(t.id); });
      return Math.round(suma / temas.length);
    },

    dominioArea: function (idArea) {
      var temas = TUTOR.temasDeArea(idArea);
      if (!temas.length) return 0;
      var suma = 0;
      temas.forEach(function (t) { suma += Estado.dominio(t.id); });
      return Math.round(suma / temas.length);
    },

    /* El dominio global solo cuenta las áreas activas: si Diego
       ha desactivado un área para concentrarse en un examen, no
       tiene sentido que su progreso se diluya con ella. */
    dominioGlobal: function () {
      var temas = Estado.temasActivos();
      if (!temas.length) return 0;
      var suma = 0;
      temas.forEach(function (t) { suma += Estado.dominio(t.id); });
      return Math.round(suma / temas.length);
    },

    /* ---------- áreas del conocimiento ---------- */
    areasActivas: function () {
      var a = d.ajustes.areasActivas;
      if (!a || !a.length) return TUTOR.AREAS.map(function (x) { return x.id; });
      return a;
    },

    areaActiva: function (idArea) {
      return Estado.areasActivas().indexOf(idArea) >= 0;
    },

    alternarArea: function (idArea) {
      var activas = Estado.areasActivas().slice();
      var i = activas.indexOf(idArea);
      if (i >= 0) {
        if (activas.length === 1) return false;   // nunca dejar el temario vacío
        activas.splice(i, 1);
      } else {
        activas.push(idArea);
      }
      d.ajustes.areasActivas = activas;
      persistir();
      notificar();
      return true;
    },

    /* Temas de las áreas actualmente activas. */
    temasActivos: function () {
      var activas = Estado.areasActivas();
      return TUTOR.TEMAS.filter(function (t) {
        return activas.indexOf(TUTOR.areaDeTema(t.id)) >= 0;
      });
    },

    registrarRespuesta: function (idTema, acierto) {
      var t = temaEstado(idTema);
      t.intentos += 1;
      if (acierto) t.aciertos += 1;
      t.ultimo = hoyISO();
      Estado.recalcularDominio(idTema);
      persistir();
    },

    registrarFase: function (idTema, fase) {
      var t = temaEstado(idTema);
      if (fase === 'feynman') t.feynman += 1;
      if (fase === 'caso') t.casos += 1;
      t.ultimo = hoyISO();
      Estado.recalcularDominio(idTema);
      persistir();
    },

    /* ---------- sesiones ---------- */
    cerrarSesion: function (resumen) {
      var t = temaEstado(resumen.tema);
      t.vistas += 1;
      t.minutos += resumen.minutos;
      t.ultimo = hoyISO();
      Estado.recalcularDominio(resumen.tema);
      resumen.fecha = new Date().toISOString();
      d.sesiones.unshift(resumen);
      if (d.sesiones.length > 300) d.sesiones.length = 300;
      Estado.registrarDia();
      Estado.marcarPlanHecho(resumen.tema);
      persistir();
      notificar();
    },

    sesionesDe: function (fechaISO) {
      return d.sesiones.filter(function (s) {
        return s.fecha && s.fecha.slice(0, 10) === fechaISO;
      });
    },

    minutosDe: function (fechaISO) {
      return Estado.sesionesDe(fechaISO).reduce(function (a, s) {
        return a + (s.minutos || 0);
      }, 0);
    },

    /* ---------- brechas conceptuales ---------- */
    anotarBrecha: function (idTema, texto) {
      d.brechas.unshift({
        tema: idTema, texto: texto,
        fecha: new Date().toISOString(), resuelta: false
      });
      if (d.brechas.length > 120) d.brechas.length = 120;
      persistir();
    },

    resolverBrecha: function (indice) {
      if (d.brechas[indice]) d.brechas[indice].resuelta = true;
      persistir();
      notificar();
    },

    brechasAbiertas: function () {
      return d.brechas.filter(function (b) { return !b.resuelta; });
    },

    /* ---------- tarjetas (SM-2 adaptado) ---------- */
    tarjeta: tarjetaEstado,

    tarjetasVencidas: function () {
      var hoy = hoyISO();
      var activas = Estado.areasActivas();
      var todas = TUTOR.todasLasTarjetas().filter(function (c) {
        return activas.indexOf(TUTOR.areaDeTema(c.tema)) >= 0;
      });
      var vencidas = [], nuevas = [];
      todas.forEach(function (c) {
        var e = d.tarjetas[c.id];
        if (!e) { nuevas.push(c); return; }
        if (e.vence <= hoy) vencidas.push(c);
      });
      var maxNuevas = d.ajustes.tarjetasNuevasDia;
      var limite = d.ajustes.maxTarjetasDia;
      var lote = vencidas.concat(nuevas.slice(0, maxNuevas));
      return lote.slice(0, limite);
    },

    tarjetasDeTema: function (idTema) {
      return TUTOR.todasLasTarjetas().filter(function (c) {
        return c.tema === idTema;
      });
    },

    /* grado: 1 = otra vez, 2 = difícil, 3 = bien, 4 = fácil */
    calificarTarjeta: function (idTarjeta, grado) {
      var s = TUTOR.SRS;
      var e = tarjetaEstado(idTarjeta);
      e.nueva = false;
      e.ultimo = hoyISO();

      if (grado === 1) {
        e.repeticiones = 0;
        e.lapsos += 1;
        e.intervalo = 0;
        e.facilidad = Math.max(s.facilidadMinima, e.facilidad - s.penalizacionFallo);
        e.vence = hoyISO();           // vuelve a aparecer hoy
      } else {
        e.repeticiones += 1;
        if (e.repeticiones === 1) e.intervalo = s.primerIntervalo;
        else if (e.repeticiones === 2) e.intervalo = s.segundoIntervalo;
        else {
          var mult = e.facilidad;
          if (grado === 2) mult = s.multiplicadorDificil;
          if (grado === 4) mult = e.facilidad * s.multiplicadorFacil;
          e.intervalo = Math.round(e.intervalo * mult);
        }
        if (grado === 2) e.facilidad = Math.max(s.facilidadMinima, e.facilidad - 0.15);
        if (grado === 4) e.facilidad = e.facilidad + 0.1;
        e.intervalo = Math.min(s.intervaloMaximo, Math.max(1, e.intervalo));
        e.vence = hoyISO(e.intervalo);
      }
      persistir();
      return e;
    },

    estadisticasTarjetas: function () {
      var activas = Estado.areasActivas();
      var todas = TUTOR.todasLasTarjetas().filter(function (c) {
        return activas.indexOf(TUTOR.areaDeTema(c.tema)) >= 0;
      });
      var hoy = hoyISO();
      var r = { total: todas.length, nuevas: 0, aprendiendo: 0, maduras: 0, vencenHoy: 0 };
      todas.forEach(function (c) {
        var e = d.tarjetas[c.id];
        if (!e) { r.nuevas += 1; return; }
        if (e.intervalo >= 21) r.maduras += 1; else r.aprendiendo += 1;
        if (e.vence <= hoy) r.vencenHoy += 1;
      });
      r.vencenHoy += Math.min(r.nuevas, d.ajustes.tarjetasNuevasDia);
      return r;
    },

    /* ---------- planificador ---------- */
    minutosDisponibles: function (fechaISO) {
      var dia = new Date(fechaISO + 'T12:00:00').getDay();
      return d.ajustes.minutosPorDia[dia] || 0;
    },

    plan: function () { return d.plan; },

    planDe: function (fechaISO) { return d.plan[fechaISO] || []; },

    marcarPlanHecho: function (idTema) {
      var hoy = hoyISO();
      (d.plan[hoy] || []).forEach(function (b) {
        if (b.tema === idTema && !b.hecho) b.hecho = true;
      });
    },

    /* Genera un plan de N días equilibrando temas nuevos,
       repasos vencidos y prioridad de alto rendimiento. */
    generarPlan: function (dias) {
      dias = dias || 14;
      var plan = {};

      /* Prioridad dentro de cada área: alto rendimiento primero y,
         a igualdad, menor dominio. */
      var porArea = {};
      Estado.temasActivos().forEach(function (t) {
        var area = TUTOR.areaDeTema(t.id);
        if (!porArea[area]) porArea[area] = [];
        porArea[area].push(t);
      });
      Object.keys(porArea).forEach(function (k) {
        porArea[k].sort(function (a, b) {
          if (a.alto !== b.alto) return a.alto ? -1 : 1;
          return Estado.dominio(a.id) - Estado.dominio(b.id);
        });
      });

      /* Intercalado entre áreas: alternar materias distintas retiene
         mejor que agotar una antes de pasar a la siguiente, porque
         obliga a discriminar en lugar de reconocer por contexto. */
      var pendientes = [];
      var areas = Object.keys(porArea);
      var quedan = true;
      for (var vuelta = 0; quedan; vuelta++) {
        quedan = false;
        for (var a = 0; a < areas.length; a++) {
          var lista = porArea[areas[a]];
          if (lista[vuelta]) { pendientes.push(lista[vuelta]); quedan = true; }
        }
      }
      if (!pendientes.length) { d.plan = {}; persistir(); return {}; }

      var cola = pendientes.slice();
      for (var i = 0; i < dias; i++) {
        var fecha = hoyISO(i);
        var disponibles = Estado.minutosDisponibles(fecha);
        if (disponibles <= 0) { plan[fecha] = []; continue; }

        var bloques = [];
        var restantes = disponibles;

        // Reserva fija para repaso espaciado si hay mazo activo.
        var stats = Estado.estadisticasTarjetas();
        if (stats.vencenHoy > 0 || i > 0) {
          var minRepaso = Math.min(10, Math.round(disponibles * 0.3));
          bloques.push({ tipo: 'repaso', tema: null, minutos: minRepaso, hecho: false });
          restantes -= minRepaso;
        }

        // Bloques de estudio con el tiempo restante.
        while (restantes >= 12 && cola.length) {
          var tema = cola.shift();
          var min = Math.min(restantes, tema.minutos || 20);
          bloques.push({ tipo: 'estudio', tema: tema.id, minutos: min, hecho: false });
          restantes -= min;
          if (cola.length === 0) cola = pendientes.slice();  // segunda vuelta = consolidación
        }
        plan[fecha] = bloques;
      }
      d.plan = plan;
      persistir();
      notificar();
      return plan;
    },

    /* Sugerencia de la próxima sesión según tiempo disponible hoy. */
    sugerencia: function () {
      var hoy = hoyISO();
      var bloques = Estado.planDe(hoy).filter(function (b) {
        return !b.hecho && b.tipo === 'estudio';
      });
      if (bloques.length) {
        return { tema: bloques[0].tema, minutos: bloques[0].minutos, origen: 'plan' };
      }
      var candidatos = Estado.temasActivos().sort(function (a, b) {
        if (a.alto !== b.alto) return a.alto ? -1 : 1;
        return Estado.dominio(a.id) - Estado.dominio(b.id);
      });
      if (!candidatos.length) candidatos = TUTOR.TEMAS.slice();
      return {
        tema: candidatos[0].id,
        minutos: Math.min(Estado.minutosDisponibles(hoy) || 25, 30),
        origen: 'sugerido'
      };
    },

    /* ---------- utilidades expuestas ---------- */
    hoyISO: hoyISO,
    diasEntre: diasEntre,

    exportar: function () { return JSON.stringify(d, null, 2); },

    importar: function (json) {
      try {
        var nuevo = JSON.parse(json);
        if (!nuevo || typeof nuevo !== 'object') return false;
        d = nuevo;
        persistir();
        notificar();
        return true;
      } catch (e) { return false; }
    },

    reiniciar: function () {
      d = Almacen.inicial();
      persistir();
      notificar();
    }
  };
})();


/* ============================================================
   UI — utilidades, enrutador y armazón de la aplicación
   Sin dependencias externas: compatible con HtmlService.
   ============================================================ */

var UI = (function () {
  var acciones = {};   // registro de manejadores por data-accion

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function $(sel, raiz) { return (raiz || document).querySelector(sel); }
  function $$(sel, raiz) {
    return Array.prototype.slice.call((raiz || document).querySelectorAll(sel));
  }

  function brindis(mensaje) {
    var el = $('#brindis');
    el.textContent = mensaje;
    el.classList.add('ver');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('ver'); }, 2200);
  }

  function modal(html) {
    cerrarModal();
    var velo = document.createElement('div');
    velo.className = 'velo';
    velo.id = 'velo';
    velo.innerHTML = '<div class="modal">' + html + '</div>';
    velo.addEventListener('click', function (e) {
      if (e.target === velo) cerrarModal();
    });
    document.body.appendChild(velo);
  }

  function cerrarModal() {
    var v = $('#velo');
    if (v) v.remove();
  }

  function barra(valor, clase) {
    return '<div class="barra-progreso ' + (clase || '') + '">' +
      '<i style="width:' + Math.max(0, Math.min(100, valor)) + '%"></i></div>';
  }

  function flecha(direccion) {
    if (direccion === 'up') return '<span class="dir up">↑</span>';
    if (direccion === 'down') return '<span class="dir down">↓</span>';
    return '<span class="dir eq">=</span>';
  }

  function variables(lista) {
    if (!lista || !lista.length) return '';
    return '<div class="variables">' + lista.map(function (v) {
      return '<span class="var-chip" title="' + esc(v.nota || '') + '">' +
        flecha(v.d) + esc(v.n) + '</span>';
    }).join('') + '</div>';
  }

  function cadena(pasos) {
    if (!pasos || !pasos.length) return '';
    return '<div class="cadena">' + pasos.map(function (p, i) {
      var sep = i < pasos.length - 1 ? '<span class="flecha">→</span>' : '';
      var clase = i === pasos.length - 1 ? 'paso destacado' : 'paso';
      return '<span class="' + clase + '">' + esc(p) + '</span>' + sep;
    }).join('') + '</div>';
  }

  function esquema(nodos) {
    if (!nodos || !nodos.length) return '';
    return '<div class="esquema">' + nodos.map(function (n, i) {
      var f = i < nodos.length - 1 ? '<span class="baja-flecha">↓</span>' : '';
      return '<div class="nodo">' + esc(n) + '</div>' + f;
    }).join('') + '</div>';
  }

  function etiquetaDominio(valor) {
    var n = TUTOR.nivelDominio(valor);
    return '<span class="etiq ' + n.clase + '">' + n.etiqueta + ' · ' + valor + '%</span>';
  }

  function minutosTexto(m) {
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60), r = m % 60;
    return h + ' h' + (r ? ' ' + r + ' min' : '');
  }

  function fechaCorta(iso) {
    var f = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
    return f.toLocaleDateString('es', { day: 'numeric', month: 'short' });
  }

  function nombreDia(iso) {
    var f = new Date(iso + 'T12:00:00');
    return ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'][f.getDay()];
  }

  /* ---------------- acciones delegadas ---------------- */
  function accion(nombre, fn) { acciones[nombre] = fn; }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-accion]');
    if (!el) return;
    var fn = acciones[el.getAttribute('data-accion')];
    if (fn) {
      e.preventDefault();
      fn(el.dataset, el, e);
    }
  });

  /* ---------------- enrutador ---------------- */
  var rutas = {};
  var rutaActual = null;
  var parametros = {};

  function registrar(id, def) { rutas[id] = def; }

  function ir(id, params) {
    if (!rutas[id]) id = 'inicio';
    rutaActual = id;
    parametros = params || {};
    pintar();
    window.scrollTo(0, 0);
  }

  function pintar() {
    var r = rutas[rutaActual];
    if (!r) return;
    var titulo = typeof r.titulo === 'function' ? r.titulo(parametros) : r.titulo;
    var sub = typeof r.sub === 'function' ? r.sub(parametros) : (r.sub || '');
    var acc = r.acciones ? r.acciones(parametros) : '';

    $('#titulo-vista').innerHTML = esc(titulo);
    $('#sub-vista').innerHTML = sub;
    $('#acciones-vista').innerHTML = acc;
    $('#contenido').className = 'contenido' + (r.angosto ? ' angosto' : '');
    $('#contenido').innerHTML = r.render(parametros);

    if (r.despues) r.despues(parametros);
    marcarNavegacion();
    /* Minerva reevalúa su consejo en cada cambio de vista. */
    if (typeof Minerva !== 'undefined') Minerva.pintarBoton();
  }

  function refrescar() { pintar(); }

  function marcarNavegacion() {
    $$('.nav-item').forEach(function (b) {
      b.classList.toggle('activo', b.dataset.ruta === rutaActual);
    });
    $$('.menu-movil button').forEach(function (b) {
      b.classList.toggle('activo', b.dataset.ruta === rutaActual);
    });
  }

  function actualizarGlobos() {
    var pendientes = Estado.estadisticasTarjetas().vencenHoy;
    $$('[data-globo="tarjetas"]').forEach(function (el) {
      el.innerHTML = pendientes ? '<span class="globo">' + pendientes + '</span>' : '';
    });
  }

  /* ---------------- tema claro/oscuro ----------------
     'auto' retira el atributo para que decidan el anfitrión
     (data-theme) o la preferencia del sistema. */
  function aplicarTema(tema) {
    if (tema === 'auto' || !tema) document.documentElement.removeAttribute('data-tema');
    else document.documentElement.setAttribute('data-tema', tema);
  }

  return {
    esc: esc, $: $, $$: $$,
    brindis: brindis, modal: modal, cerrarModal: cerrarModal,
    barra: barra, variables: variables, cadena: cadena, esquema: esquema,
    etiquetaDominio: etiquetaDominio, minutosTexto: minutosTexto,
    fechaCorta: fechaCorta, nombreDia: nombreDia,
    accion: accion, registrar: registrar, ir: ir, refrescar: refrescar,
    actualizarGlobos: actualizarGlobos, aplicarTema: aplicarTema,
    rutaActual: function () { return rutaActual; }
  };
})();


/* ============================================================
   Cronómetro reutilizable para las sesiones
   ============================================================ */

var Crono = (function () {
  var intervalo = null;
  var restanteSeg = 0;
  var alCambiar = null;
  var alTerminar = null;
  var pausado = false;

  function formatear(seg) {
    var m = Math.floor(Math.abs(seg) / 60), s = Math.abs(seg) % 60;
    return (seg < 0 ? '−' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function tic() {
    if (pausado) return;
    restanteSeg -= 1;
    if (alCambiar) alCambiar(restanteSeg, formatear(restanteSeg));
    if (restanteSeg === 0 && alTerminar) alTerminar();
  }

  return {
    iniciar: function (minutos, cambio, fin) {
      Crono.parar();
      restanteSeg = Math.round(minutos * 60);
      alCambiar = cambio; alTerminar = fin; pausado = false;
      if (alCambiar) alCambiar(restanteSeg, formatear(restanteSeg));
      intervalo = setInterval(tic, 1000);
    },
    alternarPausa: function () {
      pausado = !pausado;
      return pausado;
    },
    estaPausado: function () { return pausado; },
    parar: function () {
      if (intervalo) clearInterval(intervalo);
      intervalo = null;
    },
    transcurridoMin: function (totalMin) {
      return Math.max(0, Math.round(totalMin - restanteSeg / 60));
    },
    formatear: formatear,
    restante: function () { return restanteSeg; }
  };
})();


/* ============================================================
   MINERVA — asistente de estudio
   ------------------------------------------------------------
   El búho de Minerva emprende su vuelo al caer el crepúsculo
   (Hegel). Apropiado para quien estudia después del turno.

   No es un adorno: lee el estado real (racha, tarjetas vencidas,
   brechas, precisión por nivel, decaimiento por área) y produce
   consejos priorizados con UNA acción concreta cada uno.
   ============================================================ */

var Minerva = (function () {

  /* ------------------------------------------------------------
     Avatar en SVG. Hereda color de los tokens del tema, de modo
     que funciona igual en claro y en oscuro.
     ------------------------------------------------------------ */
  function avatar(tamano, clase) {
    var t = tamano || 40;
    return '<svg class="buho ' + (clase || '') + '" viewBox="0 0 64 64" width="' + t + '" height="' + t + '" ' +
      'role="img" aria-label="Minerva, tu asistente de estudio">' +
      /* penachos */
      '<path d="M14 20 L18 8 L26 16 Z" fill="var(--buho-cuerpo)"/>' +
      '<path d="M50 20 L46 8 L38 16 Z" fill="var(--buho-cuerpo)"/>' +
      /* cuerpo */
      '<ellipse cx="32" cy="36" rx="22" ry="24" fill="var(--buho-cuerpo)"/>' +
      /* pecho */
      '<ellipse cx="32" cy="42" rx="14" ry="16" fill="var(--buho-pecho)" opacity=".55"/>' +
      /* discos faciales */
      '<circle cx="23" cy="30" r="10" fill="var(--buho-cara)"/>' +
      '<circle cx="41" cy="30" r="10" fill="var(--buho-cara)"/>' +
      /* ojos */
      '<g class="buho-ojos">' +
      '<circle cx="23" cy="30" r="6" fill="var(--buho-ojo)"/>' +
      '<circle cx="41" cy="30" r="6" fill="var(--buho-ojo)"/>' +
      '<circle cx="25" cy="28" r="2" fill="#fff" opacity=".9"/>' +
      '<circle cx="43" cy="28" r="2" fill="#fff" opacity=".9"/>' +
      '</g>' +
      /* párpados para el parpadeo */
      '<g class="buho-parpados">' +
      '<circle cx="23" cy="30" r="6.4" fill="var(--buho-cara)"/>' +
      '<circle cx="41" cy="30" r="6.4" fill="var(--buho-cara)"/>' +
      '</g>' +
      /* pico */
      '<path d="M32 33 L28 40 L36 40 Z" fill="var(--buho-pico)"/>' +
      /* alas */
      '<path d="M12 32 Q8 44 16 52 Q14 42 16 34 Z" fill="var(--buho-ala)"/>' +
      '<path d="M52 32 Q56 44 48 52 Q50 42 48 34 Z" fill="var(--buho-ala)"/>' +
      /* patas */
      '<path d="M27 58 v3 M31 58 v3 M33 58 v3 M37 58 v3" stroke="var(--buho-pico)" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>';
  }

  /* ------------------------------------------------------------
     Saludo según la hora. Diego estudia de noche, después del
     turno: el mensaje lo reconoce en lugar de ignorarlo.
     ------------------------------------------------------------ */
  function saludo() {
    var h = new Date().getHours();
    var n = Estado.ajustes().nombre;
    if (h < 6) return '¿Guardia o insomnio, ' + n + '? A esta hora conviene repaso corto, no tema nuevo.';
    if (h < 12) return 'Buenos días, ' + n + '. La mañana rinde bien para comprender mecanismos.';
    if (h < 18) return 'Buenas tardes, ' + n + '. ¿Cuánto tiempo real tienes ahora?';
    if (h < 22) return 'Buenas noches, ' + n + '. Es la franja en la que más has estudiado.';
    return 'Tarde, ' + n + '. Si vienes cansado, quince minutos de tarjetas valen más que forzar un tema nuevo.';
  }

  /* ------------------------------------------------------------
     MOTOR DE REGLAS
     Cada regla devuelve null o un consejo con una sola acción.
     Prioridad mayor = más arriba.
     ------------------------------------------------------------ */
  var REGLAS = [

    /* --- 1. Tarjetas vencidas acumuladas --- */
    function () {
      var s = Estado.estadisticasTarjetas();
      if (s.vencenHoy < 1) return null;
      var urgente = s.vencenHoy >= 25;
      return {
        id: 'tarjetas',
        prioridad: urgente ? 95 : 60,
        tono: urgente ? 'alerta' : 'info',
        titulo: s.vencenHoy + ' tarjetas esperan hoy',
        texto: urgente
          ? 'Se te han acumulado. Si las dejas crecer, el mazo se vuelve una deuda y acabas abandonándolo. Haz una tanda ahora aunque no las termines todas: el algoritmo reorganiza el resto.'
          : 'Es lo más rentable por minuto invertido que puedes hacer ahora mismo. Se recuperan en cualquier hueco, también desde el móvil.',
        accion: { etiqueta: 'Repasar ahora', accion: 'ir-tarjetas' }
      };
    },

    /* --- 2. Racha en riesgo --- */
    function () {
      var d = Estado.datos();
      var hoy = Estado.hoyISO();
      var minHoy = Estado.minutosDe(hoy);
      if (minHoy > 0) return null;
      if (d.racha.dias < 2) return null;
      var hora = new Date().getHours();
      if (hora < 17) return null;
      return {
        id: 'racha',
        prioridad: 80,
        tono: 'alerta',
        titulo: 'Tu racha de ' + d.racha.dias + ' días se corta hoy',
        texto: 'No hace falta una sesión completa. Diez minutos de repaso mantienen la continuidad, y la continuidad es lo que realmente construye la memoria: importa más la frecuencia que la duración.',
        accion: { etiqueta: 'Sesión de 10 min', accion: 'arranque-rapido', datos: { min: 10 } }
      };
    },

    /* --- 3. Brechas repetidas en un mismo tema --- */
    function () {
      var abiertas = Estado.brechasAbiertas();
      if (abiertas.length < 3) return null;
      var cuenta = {};
      abiertas.forEach(function (b) { cuenta[b.tema] = (cuenta[b.tema] || 0) + 1; });
      var peor = null, max = 0;
      Object.keys(cuenta).forEach(function (k) {
        if (cuenta[k] > max) { max = cuenta[k]; peor = k; }
      });
      if (max < 2) return null;
      var t = TUTOR.tema(peor);
      if (!t) return null;
      return {
        id: 'brechas',
        prioridad: 85,
        tono: 'alerta',
        titulo: max + ' brechas abiertas en «' + t.nombre + '»',
        texto: 'Cuando las brechas se concentran en un tema, no es despiste: hay un concepto de base que no está sujeto. Vuelve a él en modo comprender y detente en la fase Feynman, que es donde se ve exactamente qué falta.',
        accion: { etiqueta: 'Reforzar el tema', accion: 'estudiar-tema', datos: { tema: peor } }
      };
    },

    /* --- 4. Área sin tocar --- */
    function () {
      /* No tiene sentido antes de la primera sesión: ahí manda la
         regla de arranque, y decir que "todo está sin abrir" sobra. */
      if (Estado.datos().sesiones.length === 0) return null;
      var activas = Estado.areasActivas();
      if (activas.length < 2) return null;
      var candidata = null;
      activas.forEach(function (id) {
        if (candidata) return;
        var temas = TUTOR.temasDeArea(id);
        if (!temas.length) return;
        var tocada = temas.some(function (t) { return Estado.tema(t.id).vistas > 0; });
        if (!tocada) candidata = id;
      });
      if (!candidata) return null;
      var a = TUTOR.area(candidata);
      var primero = TUTOR.temasDeArea(candidata).filter(function (t) { return t.alto; })[0] ||
        TUTOR.temasDeArea(candidata)[0];
      return {
        id: 'area-nueva',
        prioridad: 40,
        tono: 'info',
        titulo: a.icono + ' ' + a.nombre + ' sigue sin abrir',
        texto: a.lema + ' Intercalar áreas distintas rinde más que agotar una antes de pasar a la siguiente: el contraste entre materias mejora la discriminación y la retención.',
        accion: { etiqueta: 'Empezar por lo esencial', accion: 'estudiar-tema', datos: { tema: primero.id } }
      };
    },

    /* --- 5. Precisión baja en razonamiento clínico --- */
    function () {
      var d = Estado.datos();
      if (d.sesiones.length < 3) return null;
      var acc = 0, tot = 0;
      d.sesiones.slice(0, 8).forEach(function (s) { acc += s.aciertos || 0; tot += s.total || 0; });
      if (tot < 10) return null;
      var pct = Math.round((acc / tot) * 100);
      if (pct >= 65) return null;
      return {
        id: 'precision',
        prioridad: 70,
        tono: 'alerta',
        titulo: 'Precisión del ' + pct + '% en tus últimas sesiones',
        texto: 'Fallar no es el problema; fallar sin volver sí lo es. Prueba una sesión en modo examen: sin explicación previa, solo preguntas con corrección razonada. Es incómodo y es exactamente lo que consolida.',
        accion: { etiqueta: 'Modo examen', accion: 'abrir-preparar' }
      };
    },

    /* --- 6. Tema consolidado que empieza a decaer --- */
    function () {
      var candidato = null, peorDias = 0;
      TUTOR.TEMAS.forEach(function (t) {
        var e = Estado.tema(t.id);
        if (!e.ultimo || e.vistas < 1) return;
        var dias = Estado.diasEntre(e.ultimo, Estado.hoyISO());
        if (dias >= 7 && dias > peorDias) { peorDias = dias; candidato = t; }
      });
      if (!candidato) return null;
      return {
        id: 'decaimiento',
        prioridad: 55,
        tono: 'info',
        titulo: 'Hace ' + peorDias + ' días que no tocas «' + candidato.nombre + '»',
        texto: 'La curva de olvido es más pronunciada justo después de aprender algo. Un repaso corto ahora cuesta cinco minutos; reconstruirlo desde cero dentro de un mes costará la sesión entera.',
        accion: { etiqueta: 'Repaso rápido', accion: 'estudiar-tema', datos: { tema: candidato.id } }
      };
    },

    /* --- 7. Plan más ambicioso que la realidad --- */
    function () {
      var plan = Estado.plan();
      var claves = Object.keys(plan).sort();
      if (claves.length < 4) return null;
      var hoy = Estado.hoyISO();
      var pasados = claves.filter(function (f) { return f < hoy; });
      if (pasados.length < 3) return null;
      var total = 0, hechos = 0;
      pasados.forEach(function (f) {
        plan[f].forEach(function (b) { total++; if (b.hecho) hechos++; });
      });
      if (total === 0) return null;
      var cumplimiento = hechos / total;
      if (cumplimiento > 0.45) return null;
      return {
        id: 'sobrecarga',
        prioridad: 75,
        tono: 'alerta',
        titulo: 'Estás cumpliendo el ' + Math.round(cumplimiento * 100) + '% de tu plan',
        texto: 'Eso casi nunca significa falta de voluntad: significa que el plan no cabe en tu semana. Baja los minutos diarios a lo que de verdad puedes sostener con guardias y familia. Un plan que se cumple al 90 % rinde más que uno ambicioso que se abandona.',
        accion: { etiqueta: 'Ajustar disponibilidad', accion: 'navegar', datos: { ruta: 'ajustes' } }
      };
    },

    /* --- 8. Todo al día --- */
    function () {
      var s = Estado.estadisticasTarjetas();
      var minHoy = Estado.minutosDe(Estado.hoyISO());
      if (s.vencenHoy > 0 || minHoy === 0) return null;
      var global = Estado.dominioGlobal();
      return {
        id: 'al-dia',
        prioridad: 20,
        tono: 'ok',
        titulo: 'Vas al día',
        texto: global < 50
          ? 'Tarjetas al día y sesión hecha. Si te queda tiempo y energía, un tema nuevo rinde más ahora que mañana con prisa.'
          : 'Tarjetas al día, sesión hecha y dominio del ' + global + '%. Este es el momento de profundizar en un tema que ya domines: la profundización sobre base sólida es lo que separa aprobar de razonar.',
        accion: { etiqueta: 'Elegir tema', accion: 'abrir-preparar' }
      };
    },

    /* --- 9. Primer arranque --- */
    function () {
      var d = Estado.datos();
      if (d.sesiones.length > 0) return null;
      var s = Estado.sugerencia();
      var t = TUTOR.tema(s.tema);
      return {
        id: 'primera',
        prioridad: 100,
        tono: 'info',
        titulo: 'Empecemos por lo que más rinde',
        texto: 'No hace falta que decidas nada todavía. «' + t.nombre + '» es alto rendimiento y sostiene buena parte de lo que viene después. Veinte minutos bastan para una sesión completa: se dosifica sola.',
        accion: { etiqueta: 'Sesión de 20 min', accion: 'arranque-rapido', datos: { min: 20 } }
      };
    }
  ];

  function consejos() {
    var salida = [];
    REGLAS.forEach(function (r) {
      try {
        var c = r();
        if (c) salida.push(c);
      } catch (e) { /* una regla defectuosa no debe romper el panel */ }
    });
    salida.sort(function (a, b) { return b.prioridad - a.prioridad; });
    return salida;
  }

  function principal() {
    var c = consejos();
    return c.length ? c[0] : null;
  }

  /* ------------------------------------------------------------
     Voz de Minerva dentro de la sesión: una línea por fase que
     explica POR QUÉ se hace lo que se está haciendo.
     ------------------------------------------------------------ */
  var VOZ_FASE = {
    anclaje: 'Vas a fallar esto y está bien. Intentar recuperar algo que aún no sabes prepara al cerebro para codificarlo: el error previo hace que la explicación se fije mejor que si la leyeras directamente.',
    comprension: 'Lee buscando la cadena causal, no los datos sueltos. Si una flecha no tiene un porqué, ahí tienes tu primera brecha.',
    feynman: 'Esta es la fase que más incomoda y la que más te va a servir. La fluidez al leer engaña; solo producir la explicación revela lo que falta.',
    recuperacion: 'Responde antes de revelar, aunque sea a medias. Y sé honesto al calificarte: si te sobrevaloras, el sistema te devolverá esta pregunta demasiado tarde.',
    caso: 'Pregúntate siempre lo mismo: ¿qué variable cambió primero? El resto del cuadro son consecuencias y compensaciones de esa primera.',
    consolidacion: 'Cierra bien: el error frecuente y la perla son lo que sobrevive a los meses. Las tarjetas ya quedan programadas para devolvértelo justo antes de que lo olvides.'
  };

  function vozFase(idFase) { return VOZ_FASE[idFase] || ''; }

  /* ------------------------------------------------------------
     Panel flotante
     ------------------------------------------------------------ */
  function pintarBoton() {
    var contenedor = UI.$('#minerva');
    if (!contenedor) return;
    if (!Estado.ajustes().asistente) { contenedor.innerHTML = ''; return; }

    var c = principal();
    var alerta = c && (c.tono === 'alerta');
    contenedor.innerHTML =
      '<button class="minerva-btn' + (alerta ? ' con-aviso' : '') + '" data-accion="abrir-minerva" ' +
      'aria-label="Abrir a Minerva, tu asistente">' + avatar(34) +
      (alerta ? '<span class="punto"></span>' : '') + '</button>';
  }

  function abrir() {
    var lista = consejos();
    var html =
      '<div class="minerva-cab">' + avatar(52) +
      '<div><h3 style="margin:0">Minerva</h3>' +
      '<div class="sm tenue">Tu asistente de estudio</div></div>' +
      '<button class="btn btn-s btn-fantasma" data-accion="cerrar-modal" style="margin-left:auto">✕</button>' +
      '</div>' +
      '<p class="minerva-saludo">' + UI.esc(saludo()) + '</p>';

    if (!lista.length) {
      html += '<div class="vacio"><span class="emoji">🌙</span>Nada urgente ahora mismo.</div>';
    } else {
      html += lista.slice(0, 4).map(function (c) {
        return '<div class="minerva-consejo tono-' + c.tono + '">' +
          '<div class="titulo">' + UI.esc(c.titulo) + '</div>' +
          '<p>' + UI.esc(c.texto) + '</p>' +
          (c.accion
            ? '<button class="btn btn-s btn-primario" data-accion="minerva-accion" ' +
              'data-real="' + c.accion.accion + '" ' +
              'data-carga="' + UI.esc(JSON.stringify(c.accion.datos || {})) + '">' +
              UI.esc(c.accion.etiqueta) + ' →</button>'
            : '') +
          '</div>';
      }).join('');
    }

    html += '<div class="minerva-pie">' +
      '<span class="sm tenue">«El búho de Minerva levanta el vuelo al anochecer.» ' +
      'Un buen momento para estudiar es el que existe de verdad.</span></div>';

    UI.modal(html);
  }

  return {
    avatar: avatar,
    consejos: consejos,
    principal: principal,
    vozFase: vozFase,
    pintarBoton: pintarBoton,
    abrir: abrir,
    saludo: saludo
  };
})();

      '</div>';

    /* --- dos columnas --- */
    html += '<div class="rejilla c2 mt">';

    /* progreso por área del conocimiento */
    html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Avance por área</h3>' +
      '<div class="der"><button class="btn btn-s btn-fantasma" data-accion="navegar" data-ruta="areas">Áreas</button>' +
      '<button class="btn btn-s btn-fantasma" data-accion="ver-temario">Temario</button></div></div>';

        (activa ? '' : ' <span class="etiq">pausada</span>') + '</div>' +

        UI.barra(v, v >= 70 ? 'ok' : v >= 40 ? 'alerta' : 'acento') + '</div>' +
        '<div class="sm tenue">' + v + '%</div></div>';
    });
    html += '</div>';

    /* brechas detectadas */
    html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Brechas detectadas</h3>' +
      '<div class="der"><span class="etiq' + (brechas.length ? ' etiq-acento' : '') + '">' + brechas.length + '</span></div></div>';

      html += '<div class="vacio"><span class="emoji">🎯</span>Sin brechas abiertas.<br>' +
        '<span class="sm">Aparecerán aquí cuando falles una pregunta o marques un punto no explicado en la fase Feynman.</span></div>';
    } else {
      html += '<ul class="lista-limpia">';
      brechas.slice(0, 6).forEach(function (b, i) {
        var t = TUTOR.tema(b.tema);
        html += '<div class="fila"><div class="crece">' +
          '<div class="titulo">' + UI.esc(b.texto) + '</div>' +
          '<div class="sub">' + UI.esc(t ? t.nombre : '') + '</div></div>' +
          '<button class="btn btn-s" data-accion="repasar-brecha" data-tema="' + b.tema + '">Repasar</button>' +
          '<button class="btn btn-s btn-fantasma" data-accion="cerrar-brecha" data-i="' + i + '">✓</button></div>';
      });
      html += '</ul>';
    }
    html += '</div>';
    html += '</div>';

    /* --- actividad reciente --- */
    var sesiones = Estado.datos().sesiones.slice(0, 5);
    html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Últimas sesiones</h3>' +
      '<div class="der"><button class="btn btn-s btn-fantasma" data-accion="ver-rendimiento">Ver rendimiento</button></div></div>';
    if (!sesiones.length) {
      html += '<div class="vacio"><span class="emoji">📚</span>Todavía no hay sesiones registradas.<br>' +
        '<span class="sm">Empieza por un bloque de 20 minutos: es suficiente para una fase completa del método.</span></div>';
    } else {
      sesiones.forEach(function (s) {
        var t = TUTOR.tema(s.tema);
        var pct = s.total ? Math.round((s.aciertos / s.total) * 100) : null;
        html += '<div class="fila"><div class="crece">' +
          '<div class="titulo">' + UI.esc(t ? t.nombre : s.tema) + '</div>' +
          '<div class="sub">' + UI.fechaCorta(s.fecha.slice(0, 10)) + ' · ' + TUTOR.modo(s.modo).nombre +
          ' · ' + s.minutos + ' min</div></div>' +
          (pct !== null ? '<span class="etiq ' + (pct >= 70 ? 'etiq-ok' : 'etiq-alerta') + '">' + pct + '% acierto</span>' : '') +
          '</div>';
      });
    }
    html += '</div>';

    return html;
  }
});

function tarjetaMetrica(rotulo, valor, extra) {
  return '<div class="tarjeta"><div class="metrica">' +
    '<span class="rotulo">' + rotulo + '</span>' +
    '<span class="valor">' + valor + '</span>' + (extra || '') + '</div></div>';
}

function descripcionTiempo(m) {
  if (m <= 10) return 'Repaso rápido';
  if (m <= 20) return 'Imprescindible';
  if (m <= 30) return 'Comprender';
  if (m <= 45) return 'Tutor intensivo';
  return 'Profundización';
}

UI.registrar('plan', {
  titulo: 'Plan de estudio',
  sub: 'Dosificado según tus minutos disponibles cada día',
  acciones: function () {
    return '<button class="btn btn-s" data-accion="editar-disponibilidad">Disponibilidad</button>' +
      '<button class="btn btn-s btn-primario" data-accion="generar-plan">Regenerar</button>';
  },
  render: function () {
    var plan = Estado.plan();
    var claves = Object.keys(plan).sort();
    if (!claves.length) {
      return '<div class="tarjeta"><div class="vacio"><span class="emoji">🗓️</span>' +
        'Todavía no has generado un plan.<br><span class="sm">El plan reparte los temas priorizando alto rendimiento y menor dominio, y reserva tiempo diario para el repaso espaciado.</span>' +
        '<div class="mt"><button class="btn btn-primario" data-accion="generar-plan">Generar plan de 14 días</button></div></div></div>';
    }

    var hoy = Estado.hoyISO();
    var html = '';
    var totalMin = 0, totalBloques = 0, hechos = 0;
    claves.forEach(function (f) {
      plan[f].forEach(function (b) {
        totalMin += b.minutos; totalBloques++; if (b.hecho) hechos++;
      });
    });

    html += '<div class="rejilla c3">' +
      tarjetaMetrica('Tiempo planificado', UI.minutosTexto(totalMin), '<span class="nota">próximos 14 días</span>') +
      tarjetaMetrica('Bloques completados', hechos + ' / ' + totalBloques,
        UI.barra(totalBloques ? (hechos / totalBloques) * 100 : 0, 'ok')) +
      tarjetaMetrica('Media diaria', Math.round(totalMin / claves.length) + ' min',
        '<span class="nota">ajustable en Disponibilidad</span>') +
      '</div>';

    // semanas de 7 días
    for (var semana = 0; semana < Math.ceil(claves.length / 7); semana++) {
      var dias = claves.slice(semana * 7, semana * 7 + 7);
      html += '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>' +
        (semana === 0 ? 'Esta semana' : 'Semana siguiente') + '</h3>' +
        '<div class="der sm tenue">' + UI.fechaCorta(dias[0]) + ' – ' + UI.fechaCorta(dias[dias.length - 1]) + '</div></div>' +
        '<div class="semana">';
      dias.forEach(function (f) {
        var bloques = plan[f];
        var min = bloques.reduce(function (a, b) { return a + b.minutos; }, 0);
        html += '<div class="dia' + (f === hoy ? ' hoy' : '') + '">' +
          '<div class="cab"><span class="nombre">' + UI.nombreDia(f) + '</span>' +
          '<span class="num">' + parseInt(f.slice(8), 10) + '</span>' +
          '<span class="min">' + (min || '—') + (min ? "'" : '') + '</span></div>';
        if (!bloques.length) {
          html += '<div class="sm tenue">Descanso</div>';
        } else {
          bloques.forEach(function (b) {
            if (b.tipo === 'repaso') {
              html += '<div class="bloque-plan repaso' + (b.hecho ? ' hecho' : '') + '" data-accion="ir-tarjetas">' +
                '🔁 Tarjetas · ' + b.minutos + "'" + '</div>';
            } else {
              var t = TUTOR.tema(b.tema);
              html += '<div class="bloque-plan' + (b.hecho ? ' hecho' : '') + '" data-accion="estudiar-tema" data-tema="' + b.tema + '">' +
                (t && t.alto ? '🔥 ' : '📘 ') + UI.esc(t ? t.nombre : b.tema) + ' · ' + b.minutos + "'" + '</div>';
            }
          });
        }
        html += '</div>';
      });
      html += '</div></div>';
    }

    html += '<div class="aviso mt"><b>Cómo se construye el plan.</b> Los temas de 🔥 alto rendimiento y los de menor dominio van primero; ' +
      'cada día reserva un bloque de repaso espaciado, porque la retención depende más de la frecuencia de recuperación que del tiempo total invertido. ' +
      'Al completar una sesión, el bloque correspondiente se marca automáticamente.</div>';

    return html;
  }
});

/* ============================================================
   ESTUDIO — motor de la sesión guiada con el método MIT
   Fases: anclaje → comprensión → Feynman → recuperación activa
          → razonamiento clínico → consolidación
   ============================================================ */

var Sesion = (function () {
  var s = null;   // sesión activa

  /* ------------------------------------------------------------
     Reparto del tiempo entre fases según el modo elegido
     ------------------------------------------------------------ */
  function repartirTiempo(modo, minutos) {
    var total = 0;
    modo.fases.forEach(function (f) { total += modo.pesos[f] || 0; });
    return modo.fases.map(function (f) {
      return {
        id: f,
        minutos: Math.max(1, Math.round(minutos * (modo.pesos[f] || 0) / total))
      };
    });
  }

  /* Selección de preguntas según modo y tiempo disponible. */
  function elegirPreguntas(tema, modo, minutosFase) {
    var cupo = Math.max(2, Math.min(8, Math.round(minutosFase / 1.6)));
    var porNivel = { 1: [], 2: [], 3: [] };
    tema.preguntas.forEach(function (q) { porNivel[q.nivel].push(q); });

    var orden;
    if (modo.id === 'repaso') orden = [1, 1, 2, 1, 2];
    else if (modo.id === 'examen') orden = [1, 2, 2, 3, 3, 3];
    else if (modo.id === 'profundizar') orden = [2, 3, 2, 3, 3];
    else orden = [1, 2, 2, 3, 1, 3];

    var salida = [];
    var indices = { 1: 0, 2: 0, 3: 0 };
    for (var i = 0; i < orden.length && salida.length < cupo; i++) {
      var n = orden[i];
      if (porNivel[n][indices[n]]) { salida.push(porNivel[n][indices[n]]); indices[n]++; }
    }
    // completar con lo que quede
    [1, 2, 3].forEach(function (n) {
      while (salida.length < cupo && porNivel[n][indices[n]]) {
        salida.push(porNivel[n][indices[n]]); indices[n]++;
      }
    });
    return salida;
  }

  function iniciar(idTema, idModo, minutos) {
    var tema = TUTOR.tema(idTema);
    var modo = TUTOR.modo(idModo);
    if (!tema) return;

    s = {
      tema: tema,
      modo: modo,
      minutos: minutos,
      fases: repartirTiempo(modo, minutos),
      indice: 0,
      inicio: Date.now(),
      aciertos: 0,
      total: 0,
      preguntas: [],
      pasoPregunta: 0,
      pasoCaso: 0,
      brechasMarcadas: [],
      bloques: tema.bloques.filter(function (b) {
        return modo.niveles.indexOf(b.nivel) >= 0;
      })
    };
    var faseRec = s.fases.filter(function (f) { return f.id === 'recuperacion'; })[0];
    s.preguntas = elegirPreguntas(tema, modo, faseRec ? faseRec.minutos : 6);

    UI.ir('sesion');
    arrancarCrono();
  }

  function arrancarCrono() {
    Crono.iniciar(s.minutos, function (seg, txt) {
      var el = UI.$('#crono');
      if (!el) return;
      el.textContent = txt;
      el.className = 'cronometro' + (seg < 0 ? ' critico' : seg < 120 ? ' aviso' : '');
    }, function () {
      UI.brindis('Se acabó el tiempo previsto. Puedes cerrar la sesión cuando quieras.');
    });
  }

  function faseActual() { return s.fases[s.indice]; }

  function avanzar() {
    var fase = faseActual();
    if (fase) Estado.registrarFase(s.tema.id, fase.id);
    if (s.indice < s.fases.length - 1) {
      s.indice += 1;
      s.pasoPregunta = 0;
      s.pasoCaso = 0;
      UI.refrescar();
      window.scrollTo(0, 0);
    } else {
      cerrar();
    }
  }

  function cerrar() {
    Crono.parar();
    var transcurrido = Math.max(1, Math.round((Date.now() - s.inicio) / 60000));
    Estado.cerrarSesion({
      tema: s.tema.id,
      modo: s.modo.id,
      minutos: transcurrido,
      aciertos: s.aciertos,
      total: s.total
    });
    var resumen = {
      tema: s.tema, minutos: transcurrido,
      aciertos: s.aciertos, total: s.total,
      brechas: s.brechasMarcadas.slice(),
      dominio: Estado.dominio(s.tema.id)
    };
    s = null;
    UI.ir('resumen', { r: resumen });
  }

  function abandonar() {
    Crono.parar();
    s = null;
    UI.ir('inicio');
  }

  /* ============================================================
     RENDERIZADO POR FASE
     ============================================================ */

  function cabecera() {
    var fase = faseActual();
    var def = TUTOR.FASES[fase.id];
    var pasos = s.fases.map(function (f, i) {
      return '<div class="paso-sesion ' + (i < s.indice ? 'hecho' : i === s.indice ? 'actual' : '') + '"></div>';
    }).join('');

    return '<div class="sesion-cab">' +
      '<div><div class="sm tenue">' + UI.esc(s.tema.nombre) + '</div>' +
      '<div style="font-weight:650">' + def.icono + ' ' + def.nombre + '</div></div>' +
      '<div class="pasos-sesion">' + pasos + '</div>' +
      '<div class="cronometro" id="crono">--:--</div>' +
      '<button class="btn btn-s btn-fantasma" data-accion="pausar-sesion" id="btn-pausa">⏸</button>' +
      '<button class="btn btn-s btn-fantasma" data-accion="abandonar-sesion">Salir</button>' +
      '</div>' +
      '<div class="aviso"><b>' + UI.esc(def.lema) + '</b><br>' +
      '<span class="sm">' + UI.esc(def.principio) + '</span></div>' +
      (Estado.ajustes().asistente && typeof Minerva !== 'undefined'
        ? '<div class="minerva-linea">' + Minerva.avatar(32) +
          '<div><div class="nombre">Minerva</div><p>' + UI.esc(Minerva.vozFase(fase.id)) + '</p></div></div>'
        : '');
  }

  function pie(textoBoton) {
    return '<div class="linea fin mt">' +
      '<button class="btn btn-primario btn-g" data-accion="fase-siguiente">' +
      (textoBoton || 'Continuar') + ' →</button></div>';
  }

  function renderAnclaje() {
    var t = s.tema;
    return '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">1</span>Antes de leer nada</div>' +
      '<h2>' + UI.esc(t.anclaje.q) + '</h2>' +
      '<p class="sm tenue">No busques la respuesta. Escribe lo que recuerdes, aunque sea incompleto o erróneo: ' +
      'el intento fallido es lo que prepara la codificación del contenido que viene.</p>' +
      '<textarea id="resp-anclaje" placeholder="Escribe tu respuesta de memoria…"></textarea>' +
      '<div class="aviso aviso-alerta mt"><b>Pista si te bloqueas:</b> ' + UI.esc(t.anclaje.pista) + '</div>' +
      '</div>' +
      '<div class="aviso aviso-acento mt"><b>Idea central del tema.</b> ' + t.ideaCentral + '</div>' +
      pie('Ya lo intenté, seguir');
  }

  function renderComprension() {
    var html = '<div class="tarjeta"><div class="fase-etiqueta"><span class="num">2</span>Construir el mecanismo</div>' +
      '<div class="doc">';
    s.bloques.forEach(function (b) {
      html += '<div class="seccion-tema"><h3>' + UI.esc(b.titulo) +
        ' <span class="etiq ' + (b.nivel === 'imprescindible' ? 'etiq-acento' : b.nivel === 'importante' ? 'etiq-info' : '') + '">' +
        TUTOR.NIVELES[b.nivel].nombre + '</span></h3>' +
        (b.html || '') + UI.cadena(b.cadena) + UI.esquema(b.esquema) + '</div>';
    });
    html += '</div></div>';

    html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Variables que debes manejar</h3></div>' +
      UI.variables(s.tema.variables) + '</div>';

    if (s.modo.niveles.length > 1) {
      html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Fisiopatología</h3></div>' +
        '<div class="doc">' + s.tema.fisiopatologia + '</div></div>';
      html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Correlación clínica</h3></div>' +
        '<div class="doc">' + s.tema.clinica + '</div></div>';
    }

    var omitidos = s.tema.bloques.length - s.bloques.length;
    if (omitidos > 0) {
      html += '<div class="aviso mt"><b>Modo «poco tiempo» activo.</b> Se han omitido ' + omitidos +
        ' bloque(s) de nivel complementario para proteger las fases de recuperación y caso clínico, ' +
        'que son las que producen retención. Puedes verlos en la ficha del tema cuando tengas más margen.</div>';
    }

    return html + pie('Ahora explícalo tú');
  }

  function renderFeynman() {
    var f = s.tema.feynman;
    var puntos = f.puntos.map(function (p, i) {
      return '<label class="fila" style="cursor:pointer;gap:9px">' +
        '<input type="checkbox" class="chk-feynman" data-i="' + i + '" style="width:auto;margin:0">' +
        '<span class="crece">' + UI.esc(p) + '</span></label>';
    }).join('');

    return '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">3</span>Técnica Feynman</div>' +
      '<h2>' + UI.esc(f.consigna) + '</h2>' +
      '<p class="sm tenue">Escríbelo como se lo explicarías a un residente de primer año, sin volver atrás a mirar. ' +
      'Si necesitas una palabra técnica para no trabarte, esa palabra es tu brecha.</p>' +
      '<textarea id="resp-feynman" style="min-height:170px" placeholder="Explícalo con tus palabras…"></textarea>' +
      '<div class="linea mt"><button class="btn btn-primario" data-accion="revelar-feynman">Comparar con la explicación de referencia</button></div>' +
      '</div>' +
      '<div id="feynman-referencia" class="oculto">' +
      '<div class="tarjeta"><div class="tarjeta-cab"><h3>Autoevaluación</h3>' +
      '<div class="der sm tenue">Marca lo que SÍ mencionaste</div></div>' +
      puntos +
      '<div class="aviso aviso-alerta mt"><b>Lo que dejes sin marcar se registra como brecha</b> y aparecerá en tu panel de inicio y en el plan de repaso.</div>' +
      '</div>' +
      '<div class="tarjeta"><div class="tarjeta-cab"><h3>Explicación de referencia</h3></div>' +
      '<div class="doc">' + f.referencia + '</div></div>' +
      pie('Registrar brechas y seguir') +
      '</div>';
  }

  function renderRecuperacion() {
    if (!s.preguntas.length) return '<div class="vacio">Sin preguntas disponibles.</div>' + pie();

    var i = s.pasoPregunta;
    if (i >= s.preguntas.length) {
      var pct = s.total ? Math.round((s.aciertos / s.total) * 100) : 0;
      return '<div class="tarjeta centro">' +
        '<div class="metrica" style="align-items:center"><span class="rotulo">Precisión en esta fase</span>' +
        '<span class="valor">' + pct + '%</span>' +
        '<span class="nota">' + s.aciertos + ' de ' + s.total + ' preguntas</span></div>' +
        UI.barra(pct, pct >= 70 ? 'ok' : 'alerta') +
        '<p class="sm tenue mt">' + (pct >= 80
          ? 'Sólido. El tema está entrando en memoria a largo plazo.'
          : pct >= 50
            ? 'Va bien, pero conviene un repaso corto en 2 días: es justo cuando la curva de olvido cae más.'
            : 'Precisión baja: no es fracaso, es información. Este tema vuelve al principio de tu plan.') +
        '</p></div>' + pie('Ir al caso clínico');
    }

    var q = s.preguntas[i];
    var nombresNivel = { 1: 'Nivel 1 · Conocimiento', 2: 'Nivel 2 · Integración', 3: 'Nivel 3 · Razonamiento clínico' };

    return '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">4</span>Recuperación activa · ' + (i + 1) + ' de ' + s.preguntas.length + '</div>' +
      '<div class="pregunta-bloque" style="border:0;padding:0">' +
      '<div class="nivel">' + nombresNivel[q.nivel] + '</div>' +
      '<div class="enunciado" style="font-size:1.08rem">' + q.q + '</div>' +
      '<textarea id="resp-preg" placeholder="Responde antes de revelar. Escribir obliga a comprometerse."></textarea>' +
      '<div class="linea mt"><button class="btn btn-primario" data-accion="revelar-respuesta">Revelar respuesta</button></div>' +
      '<div id="zona-respuesta" class="oculto">' +
      '<div class="respuesta-oculta">' + q.r + '</div>' +
      '<div class="autoeval">' +
      '<button class="btn grado-1" data-accion="calificar-preg" data-ok="0">✗ Fallé</button>' +
      '<button class="btn grado-2" data-accion="calificar-preg" data-ok="0">~ Dudé mucho</button>' +
      '<button class="btn grado-3" data-accion="calificar-preg" data-ok="1">◐ Casi completo</button>' +
      '<button class="btn grado-4" data-accion="calificar-preg" data-ok="1">✓ Correcto</button>' +
      '</div>' +
      '<p class="sm tenue mt mb0">Sé honesto: el sistema usa esta calificación para decidir cuándo te vuelve a preguntar. ' +
      'Sobrevalorarte solo retrasa el momento en que descubres que no lo sabías.</p>' +
      '</div></div></div>';
  }

  function renderCaso() {
    var caso = s.tema.caso;
    var i = s.pasoCaso;

    var html = '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">5</span>Razonamiento clínico</div>' +
      '<div class="caso-vineta">' + caso.vineta + '</div></div>';

    if (i >= caso.pasos.length) {
      html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Cierre del caso</h3></div>' +
        '<div class="doc">' + caso.cierre + '</div></div>';
      return html + pie('Consolidar');
    }

    var paso = caso.pasos[i];
    html += '<div class="tarjeta">' +
      '<div class="sm tenue">Pregunta ' + (i + 1) + ' de ' + caso.pasos.length + '</div>' +
      '<div class="enunciado" style="font-size:1.05rem;font-weight:600;margin:6px 0 12px">' + paso.q + '</div>' +

      '<div class="linea mt">' +

      '<button class="btn btn-primario" data-accion="revelar-caso">Revelar razonamiento</button></div>' +
      '<div id="pista-caso" class="oculto"><div class="aviso aviso-alerta mt">' + UI.esc(paso.pista) + '</div></div>' +
      '<div id="zona-caso" class="oculto">' +
      '<div class="respuesta-oculta">' + paso.r + '</div>' +
      '<div class="linea fin mt"><button class="btn btn-primario" data-accion="siguiente-caso">Siguiente paso →</button></div>' +
      '</div></div>';

    // pasos ya respondidos, plegados arriba
    if (i > 0) {
      html += '<div class="tarjeta"><div class="tarjeta-cab"><h3>Cadena reconstruida</h3></div>' +
        UI.cadena(caso.pasos.slice(0, i).map(function (p, k) { return 'Paso ' + (k + 1); })) + '</div>';
    }
    return html;
  }

  function renderConsolidacion() {
    var t = s.tema;
    var nTarjetas = (t.tarjetas || []).length;

    return '<div class="tarjeta">' +
      '<div class="fase-etiqueta"><span class="num">6</span>Consolidación</div>' +
      '<h2>Lo que no debe olvidarse de este tema</h2></div>' +
      bloqueError(t.error) +
      '<div class="aviso aviso-ok mt"><b>Perla de examen.</b> ' + t.perla + '</div>' +
      '<div class="tarjeta mt"><div class="tarjeta-cab"><h3>Al mazo de repaso espaciado</h3>' +
      '<div class="der"><span class="etiq etiq-info">' + nTarjetas + ' tarjetas</span></div></div>' +
      '<p class="sm tenue">Estas tarjetas ya están en tu mazo y el algoritmo las programará según tu rendimiento. ' +
      'La primera revisión será mañana; después, los intervalos crecen si aciertas y se reinician si fallas.</p>' +
      '<ul class="lista-limpia">' +
      (t.tarjetas || []).slice(0, 4).map(function (c) {
        return '<div class="fila"><div class="crece"><div class="titulo">' + UI.esc(c.f) + '</div></div>' +
          '<span class="etiq">nueva</span></div>';
      }).join('') +
      (nTarjetas > 4 ? '<div class="fila"><div class="sm tenue">y ' + (nTarjetas - 4) + ' más…</div></div>' : '') +
      '</ul></div>' +
      '<div class="linea fin mt"><button class="btn btn-primario btn-g" data-accion="fase-siguiente">Cerrar sesión ✓</button></div>';
  }

  /* ------------------------------------------------------------ */
  function render() {
    if (!s) return '<div class="vacio">No hay sesión activa.</div>';
    var fase = faseActual().id;
    var cuerpo =
      fase === 'anclaje' ? renderAnclaje() :
      fase === 'comprension' ? renderComprension() :
      fase === 'feynman' ? renderFeynman() :
      fase === 'recuperacion' ? renderRecuperacion() :
      fase === 'caso' ? renderCaso() :
      renderConsolidacion();
    return cabecera() + cuerpo;
  }

  return {
    iniciar: iniciar,
    render: render,
    avanzar: avanzar,
    abandonar: abandonar,
    activa: function () { return !!s; },
    datos: function () { return s; },
    calificar: function (ok) {
      s.total += 1;
      if (ok) s.aciertos += 1;
      Estado.registrarRespuesta(s.tema.id, ok);
      if (!ok) {
        var q = s.preguntas[s.pasoPregunta];
        Estado.anotarBrecha(s.tema.id, 'Pregunta fallada: ' + q.q.slice(0, 90));
      }
      s.pasoPregunta += 1;
      UI.refrescar();
      window.scrollTo(0, 0);
    },
    siguienteCaso: function () {
      s.pasoCaso += 1;
      UI.refrescar();
      window.scrollTo(0, 0);
    },
    registrarBrechasFeynman: function (indicesNoMarcados) {
      var f = s.tema.feynman;
      indicesNoMarcados.forEach(function (i) {
        Estado.anotarBrecha(s.tema.id, 'No explicado: ' + f.puntos[i]);
        s.brechasMarcadas.push(f.puntos[i]);
      });
    }
  };
})();

/* ============================================================
   TARJETAS — repaso con recuperación activa y repetición espaciada
   Algoritmo SM-2 adaptado (ver Estado.calificarTarjeta)
   ============================================================ */

var Mazo = (function () {
  var cola = [];
  var actual = null;
  var revelada = false;
  var sesion = { revisadas: 0, aciertos: 0, inicio: null, filtroTema: null };

  function cargar(idTema) {
    cola = idTema ? Estado.tarjetasDeTema(idTema) : Estado.tarjetasVencidas();
    // barajar para evitar el aprendizaje por orden
    for (var i = cola.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = cola[i]; cola[i] = cola[j]; cola[j] = tmp;
    }
    sesion = { revisadas: 0, aciertos: 0, inicio: Date.now(), filtroTema: idTema || null };
    siguiente();
  }

  function siguiente() {
    actual = cola.shift() || null;
    revelada = false;
  }

  function revelar() { revelada = true; UI.refrescar(); }

  function calificar(grado) {
    if (!actual) return;
    var e = Estado.calificarTarjeta(actual.id, grado);
    sesion.revisadas += 1;
    if (grado >= 3) sesion.aciertos += 1;
    if (grado === 1) cola.push(actual);       // vuelve al final de la cola de hoy
    siguiente();
    UI.refrescar();
    window.scrollTo(0, 0);
  }

  function intervaloTexto(grado) {
    if (!actual) return '';
    var e = Estado.tarjeta(actual.id);
    var s = TUTOR.SRS;
    if (grado === 1) return 'hoy';
    var reps = e.repeticiones + 1;
    var intervalo;
    if (reps === 1) intervalo = s.primerIntervalo;
    else if (reps === 2) intervalo = s.segundoIntervalo;
    else {
      var mult = grado === 2 ? s.multiplicadorDificil : grado === 4 ? e.facilidad * s.multiplicadorFacil : e.facilidad;
      intervalo = Math.round(e.intervalo * mult);
    }
    intervalo = Math.min(s.intervaloMaximo, Math.max(1, intervalo));
    if (intervalo === 1) return 'mañana';
    if (intervalo < 30) return intervalo + ' días';
    return Math.round(intervalo / 30) + ' meses';
  }

  return {
    cargar: cargar,
    revelar: revelar,
    calificar: calificar,
    actual: function () { return actual; },
    revelada: function () { return revelada; },
    restantes: function () { return cola.length; },
    sesion: function () { return sesion; },
    intervaloTexto: intervaloTexto
  };
})();

  L.push('- Mi dominio actual estimado del tema: ' + dom + '%');
  if (brechas.length) {
    L.push('- Brechas ya detectadas que debes atacar de forma prioritaria:');

  if (minutos <= 15) {
    L.push('Modo REPASO RÁPIDO. Entrega: 5–10 conceptos esenciales, las relaciones fisiológicas fundamentales, 3 errores frecuentes, 5 preguntas rápidas y 3 perlas de examen. Debe poder revisarse en unos 10 minutos. No te extiendas.');
  } else if (minutos <= 25) {
    L.push('Modo POCO TIEMPO. Divide el contenido en IMPRESCINDIBLE / IMPORTANTE / COMPLEMENTARIO y cubre solo lo imprescindible salvo que sobre tiempo. No gastes tiempo en detalles de bajo rendimiento ni en conversación innecesaria.');
  } else if (minutos <= 45) {
    L.push('Modo TUTOR INTENSIVO. Identifica los conceptos fundamentales, explícalos rápido, detecta mis brechas mediante preguntas, corrígelas, aplícalas a casos clínicos y termina con preguntas de integración.');
  } else {
    L.push('Modo PROFUNDIZACIÓN. Puedes abordar mecanismos celulares, receptores, segundos mensajeros, electrofisiología, curvas presión-volumen, hemodinámica y regulación neurohumoral, manteniendo siempre la conexión con la clínica.');
  }
  L.push('');
  L.push('## 6. MÉTODO DE INTERACCIÓN (lo más importante)');
  L.push('No seas un libro de texto que habla: hazme razonar.');
  L.push('- Si puedo deducir una respuesta a partir de un principio fisiológico, guíame a deducirla en lugar de dármela.');
  L.push('- Construye cadenas de razonamiento progresivas: «¿qué determina el gasto cardíaco?» → «si baja el retorno venoso, ¿qué ocurre con la precarga?» → «¿y con el volumen sistólico?» → «¿qué compensación esperarías?».');
  L.push('- En los casos clínicos, formula las preguntas de una en una y ESPERA mi respuesta antes de continuar. No adelantes las soluciones.');
  L.push('- Si detectas que confundo dos conceptos, detente y explícame: qué confundo, por qué se parecen, cuál es la diferencia real, un ejemplo clínico y una regla mental para no volver a confundirlos.');
  L.push('');
  if (m.id === 'examen') {
    L.push('## 7. MODO EXAMEN (activo)');
    L.push('No me des la respuesta de entrada. Hazme preguntas progresivas. Tras cada respuesta mía: indica si es correcta, explica por qué, corrige mis errores, expón el razonamiento correcto y súbeme la dificultad.');
    L.push('');
  }
  L.push('## 8. PREGUNTAS DE ENTRENAMIENTO');
  L.push('Al terminar el tema, genera preguntas en tres niveles:');
  L.push('- NIVEL 1 (conocimiento): conceptos fundamentales.');
  L.push('- NIVEL 2 (integración): relacionar dos o más conceptos.');
  L.push('- NIVEL 3 (razonamiento clínico): casos donde deba deducir qué ocurre.');
  L.push('Prioriza «¿qué ocurriría si…?», «¿cuál es el mecanismo que explica…?», «¿qué variable cambió primero?», «¿qué compensación esperarías?», «¿qué pasa si ese mecanismo falla?».');
  L.push('');
  L.push('## 9. FUENTES');
  var FUENTES = {
    cardio: 'Guyton & Hall, Boron & Boulpaep, Costanzo, Harrison y Braunwald',
    respiratorio: 'West (Fisiología respiratoria), Guyton & Hall, Boron & Boulpaep y Harrison',
    renal: 'Rose & Post (Trastornos de electrolitos y ácido-base), Brenner, Guyton & Hall y Harrison',
    neuro: 'Kandel (Principios de neurociencia), Guyton & Hall, Ropper (Adams y Victor) y Harrison',
    farmaco: 'Goodman & Gilman, Katzung, Rang & Dale y guías de sociedades de medicina intensiva'
  };
  L.push('Usa conceptos compatibles con ' + (FUENTES[area.id] || FUENTES.cardio) + '. Si hay diferencias relevantes entre fuentes, indícalas. No inventes referencias.');
  L.push('');
  L.push('## 10. ARRANQUE');
  L.push('Empieza directamente por lo más importante del tema indicado. No me preguntes de nuevo el tema ni el tiempo: ya están arriba.');
  L.push('Al terminar cada concepto importante, pregúntame: «¿lo llevamos a un caso clínico o avanzamos?». Si el tiempo es escaso, prioriza avanzar.');

  return L.join('\n');
}

  UI.cerrarModal();

  try { datos = JSON.parse(d.carga || '{}'); } catch (e) { datos = {}; }
  var real = d.real;
  if (real === 'ir-tarjetas') { Mazo.cargar(null); UI.ir('tarjetas'); return; }
  if (real === 'arranque-rapido') {
    var s = Estado.sugerencia();
    var min = parseInt(datos.min, 10) || 20;
    Sesion.iniciar(s.tema, min <= 10 ? 'repaso' : min <= 30 ? 'comprender' : 'intensivo', min);
    return;

  if (real === 'estudiar-tema') { UI.ir('preparar', { tema: datos.tema }); return; }
  if (real === 'abrir-preparar') { UI.ir('preparar'); return; }
  if (real === 'navegar') { UI.ir(datos.ruta || 'inicio'); return; }
  UI.ir('inicio');
});

  }
  copiarTexto(texto);
  UI.brindis('Prompt copiado al portapapeles');
});

function copiarTexto(texto) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto);
      return;
    }
  } catch (e) { /* se usa el método alternativo */ }
  var ta = document.createElement('textarea');
  ta.value = texto;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { }
  ta.remove();
}

/* ------------------------------------------------------------
   Feynman: registrar brechas al avanzar de fase
   ------------------------------------------------------------ */
(function interceptarFeynman() {
  var avanzarOriginal = Sesion.avanzar;
  Sesion.avanzar = function () {
    if (Sesion.activa()) {
      var s = Sesion.datos();
      if (s.fases[s.indice].id === 'feynman') {
        var casillas = UI.$$('.chk-feynman');
        if (casillas.length) {
          var noMarcados = [];
          casillas.forEach(function (c) {
            if (!c.checked) noMarcados.push(parseInt(c.dataset.i, 10));
          });
          Sesion.registrarBrechasFeynman(noMarcados);
          if (noMarcados.length) {
            UI.brindis(noMarcados.length + ' brecha(s) registrada(s) para tu próximo repaso');
          }
        }
      }
    }
    avanzarOriginal();
  };
})();

/* ------------------------------------------------------------
   ARRANQUE
   ------------------------------------------------------------ */
function arrancar() {
  Estado.iniciar().then(function () {
    UI.aplicarTema(Estado.ajustes().tema);
    pintarNavegacion();

    // Genera un plan inicial la primera vez.
    if (!Object.keys(Estado.plan()).length) Estado.generarPlan(14);

    UI.ir('inicio');
    UI.actualizarGlobos();
    Minerva.pintarBoton();
    Estado.suscribir(function () {
      UI.actualizarGlobos();
      Minerva.pintarBoton();
    });
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', arrancar);
} else {
  arrancar();
}
